            if (collectTimer <= 0) spawnCollectible();

            // --- Move & clean up world objects ---
            for (const o of obstacles) {
                o.x -= dx;
                // Pigeons fly: their hitbox follows the sprite, so what you see is what hits
                if (o.type === "overhead") o.y = pigeonY(o);
            }
            for (const g of gaps) g.x -= dx;
            for (const c of collectibles) c.x -= dx;
            obstacles = obstacles.filter(o => o.x + o.w > -60);
            gaps = gaps.filter(g => g.x + g.w > -60);
            collectibles = collectibles.filter(c => c.x + c.r > -60);

            // --- Collisions ---
            const hb = playerHitbox();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                // obstacleHitbox() honours HITBOX_MODE, so switching modes changes what
                // actually kills you without touching anything that is drawn.
                if (invincibleTimer > 0 || !rectsOverlap(hb, obstacleHitbox(o))) continue;
                if (loseHeart()) continue; // a spare heart absorbs the hit
                die(o.type === "ground" ? "caught by a koala cop" : "hit by a pigeon");
                return;
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                const box = collectibleBox(c); // pickup box = exactly the drawn artwork
                if (rectsOverlap(hb, box)) {
                    collectibles.splice(i, 1);
                    if (c.kind === "jetpack") {
                        fuel = Math.min(FUEL_MAX, fuel + FUEL_REFILL);
                        sndJetpack();
                    } else if (c.kind === "heart") {
                        lives = Math.min(LIVES_MAX, lives + 1);
                        addPopup(c.x, c.y - 14, "+❤️", "#ff3050");
                        sndHeart();
                    } else {
                        score += COLLECT_VALUE;
                        addPopup(c.x, c.y - 14, "+" + COLLECT_VALUE, "#444");
                        sndCollect();
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (const p of particles) {
                p.life -= dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 500 * dt; // light gravity on particles
            }
            particles = particles.filter(p => p.life > 0);
        }

        function updatePopups(dt) {
            for (const p of popups) {
                p.life -= dt;
                p.y -= 40 * dt; // floats upward
            }
            popups = popups.filter(p => p.life > 0);
        }

        /* =====================================================================
           DRAWING
           ===================================================================== */

        function draw() {
            ctx.imageSmoothingEnabled = false; // pixel art: a scaled sprite stays crisp, never blurred
            drawScreen();
        }

        // One game screen, drawn in coordinates 0..W x 0..H
        function drawScreen() {
            if (state === "boot") { drawBoot(); return; }
            if (state === "home") { drawHome(); return; }
            if (state === "intro") { drawIntro(); return; }
            if (state === "leaderboard") { drawLeaderboard(); return; }

            // --- Below: the game world (states "playing", "dying" and "gameover") ---
            ctx.save();

            // Screen shake offset (+ a constant rumble while the jetpack fires)
            let s = shakeTimer > 0 ? shakePower * (shakeTimer / SHAKE_DURATION) : 0;
            if (state === "playing" && player.jetting) s = Math.max(s, 1.6);
            if (s > 0) ctx.translate(rand(-s, s), rand(-s, s));

            // --- Backdrop (placeholder until the in-game art arrives) ---
            drawRunBackdrop();
            // Jetpack boost: speed streaks rushing past, behind the ground
            drawSpeedLines();
            // --- The ground the player runs on ---
            drawRunGround();

            // --- Holes cut into the ground ---
            const holeTop = GROUND_Y - 3;
            ctx.fillStyle = "#1c1c1c";
            for (const g of gaps) ctx.fillRect(g.x, holeTop, g.w, H - holeTop);

            // --- Obstacles: the animated koala / pigeon, drawn as FULL frames.
            // The frames share a canvas, so drawing them untrimmed is what keeps the
            // creature from sliding around between frames. ---
            for (const o of obstacles) {
                const f = obstacleFrameRect(o);
                const slot = obstacleFrameSlot(o);
                if (slot && drawSlot(slot, f.x, f.y, f.w, f.h)) continue;
                ctx.fillStyle = "#2a2a2a"; // placeholder rect on the hitbox itself
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }

            // --- Collectibles: drawn rect = pickup hitbox = the visible artwork ---
            for (const c of collectibles) {
                const box = collectibleBox(c);
                if (drawSlot(collectibleSlotName(c.kind), box.x, box.y, box.w, box.h)) continue;
                if (c.kind === "heart") { drawHeart(c.x, c.y, c.r * 2, "#ff3050"); continue; }
                // Circle fallback, one color per kind so they stay readable
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = c.kind === "jetpack" ? "#30c060" : "#909090";
                ctx.fill();
                ctx.beginPath(); // small inner dot for readability
                ctx.arc(c.x, c.y, c.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = "#f7f7f7";
                ctx.fill();
            }

            // --- Player (the death sequence draws its own character instead) ---
            if (state === "playing") {
                // Blinking right after losing a heart: he can't be hit during it
                if (invincibleTimer > 0 && Math.floor(invincibleTimer * 12) % 2 === 0) ctx.globalAlpha = 0.3;
                drawPlayer();
                ctx.globalAlpha = 1;
            }

            // Debug overlay: green boxes = the REAL collision rects of everything
            // (player, obstacles, collectibles). Obstacles also get their sprite FRAME
            // outlined in faint blue, so the gap between art and hitbox is visible.
            // Toggle with DEBUG_HITBOX; switch HITBOX_MODE to compare the two schemes.
            if (DEBUG_HITBOX && state === "playing") {
                drawHitboxDebug(); // player box
                ctx.lineWidth = 2;
                for (const o of obstacles) {
                    const f = obstacleFrameRect(o);
                    ctx.strokeStyle = "rgba(60,140,255,0.45)";
                    ctx.strokeRect(f.x, f.y, f.w, f.h);
                    const hb = obstacleHitbox(o);
                    ctx.strokeStyle = "#00e050";
                    ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
                }
                ctx.strokeStyle = "#00e050";
                for (const c of collectibles) { const b = collectibleBox(c); ctx.strokeRect(b.x, b.y, b.w, b.h); }
                ctx.fillStyle = "#00e050";
                ctx.font = "bold 13px monospace";
                ctx.textAlign = "right"; // bottom right, in the ground strip: clear of the runner
                ctx.fillText("HITBOX: " + HITBOX_MODE, W - HUD_INSET_X, H - 20);
            }

            // --- Particles ---
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / 0.7);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // --- Floating score popups ---
            for (const p of popups) {
                ctx.globalAlpha = Math.max(0, p.life / 0.8);
                ctx.fillStyle = p.color;
                ctx.font = "bold 18px monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;

            // --- HUD ---
            // No backdrop panels; the HUD simply sits away from the screen edges.
            const hudColor = "#2a2a2a";
            ctx.fillStyle = hudColor;
            ctx.font = "bold 30px monospace";
            ctx.textAlign = "right";
            ctx.fillText(String(Math.floor(score)).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 12);
            ctx.font = "18px monospace";
            ctx.fillText("HI " + String(bestScore).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 40);

            // Jetpack fuel gauge, top left, and the hearts (lives) right under it
            drawFuelGauge(HUD_INSET_X, HUD_INSET_Y + 7, hudColor);
            drawLives(HUD_INSET_X, HUD_INSET_Y + 40);

            // Controls reminder, always visible during the run
            if (state === "playing") drawControlsHint(H - 34, "#606060"); // it sits on the ground band

            ctx.restore();

            // --- Screen flash (drawn on top, ignores shake) ---
            if (flashTimer > 0) {
                ctx.globalAlpha = Math.min(0.5, flashTimer / FLASH_DURATION * 0.5);
                ctx.fillStyle = flashColor;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }

            // --- Overlays on top of the (frozen) world ---
            if (state === "dying") drawDeathSequence();
            if (state === "gameover") drawGameOverScreen();

            // --- Pause overlay (P) on top of everything in the window ---
            if (paused && state === "playing") drawPauseOverlay();
        }

        // Draws text in a chunky PIXELATED style: rendered small on an offscreen
        // canvas, then blown up with image smoothing disabled.
        const pixelCanvas = document.createElement("canvas");
        const pixelCtx = pixelCanvas.getContext("2d");
        function drawPixelText(text, cx, cy, smallPx, scaleFactor, color) {
            pixelCtx.font = "bold " + smallPx + "px monospace";
            const tw = Math.ceil(pixelCtx.measureText(text).width) + 4;
            const th = smallPx + 6;
            pixelCanvas.width = tw;  // resizing also clears the offscreen canvas
            pixelCanvas.height = th;
            pixelCtx.font = "bold " + smallPx + "px monospace"; // re-set after the resize
            pixelCtx.textAlign = "left";
            pixelCtx.textBaseline = "top";
            pixelCtx.fillStyle = color;
            pixelCtx.fillText(text, 2, 2);
            ctx.save();
            ctx.imageSmoothingEnabled = false; // this is what makes the pixels chunky
            ctx.drawImage(pixelCanvas, cx - (tw * scaleFactor) / 2, cy - (th * scaleFactor) / 2, tw * scaleFactor, th * scaleFactor);
            ctx.restore();
        }

        // Jetpack icon: two red capsule tanks on a dark backplate, a flared nozzle under
        // each — and little flames coming out of them while the jetpack actually fires.
        // Drawn on a 20x20 grid, scaled up, vertically centered on the fuel cells.
        function drawJetpackIcon(x, y, color) {
            ctx.save();
            ctx.translate(x, y - 4);
            ctx.scale(1.25, 1.25);
            ctx.fillStyle = color;
            ctx.fillRect(6, 1, 8, 15);                       // backplate between the tanks
            ctx.fillStyle = "#e0352b";
            for (const tx of [0, 12]) {
                ctx.beginPath();
                ctx.arc(tx + 4, 3, 4, Math.PI, 0);           // rounded top
                ctx.lineTo(tx + 8, 13);
                ctx.arc(tx + 4, 13, 4, 0, Math.PI);          // rounded bottom
                ctx.closePath();
                ctx.fill();
            }
            ctx.fillStyle = "rgba(255,255,255,0.6)";         // shine on each tank
            for (const tx of [0, 12]) ctx.fillRect(tx + 1.5, 2, 1.5, 9);
            ctx.fillStyle = color;                           // flared nozzles
            for (const tx of [0, 12]) {
                ctx.beginPath();
                ctx.moveTo(tx + 2.5, 16);
                ctx.lineTo(tx + 5.5, 16);
                ctx.lineTo(tx + 7, 20);
                ctx.lineTo(tx + 1, 20);
                ctx.fill();
            }
            if (state === "playing" && player.jetting) {
                ctx.fillStyle = "#ff9a20";
                for (const tx of [0, 12]) {
                    ctx.beginPath();
                    ctx.moveTo(tx + 1, 20);
                    ctx.lineTo(tx + 7, 20);
                    ctx.lineTo(tx + 4, 24 + Math.random() * 4);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // Jetpack fuel gauge: the jetpack icon, then 10 cells that fill bottom-up like
        // a tank; the color drops green -> amber -> red, and the cells blink when low.
        function drawFuelGauge(x, y, color) {
            const SEG = 10, segW = 14, segGap = 3, h = 17;
            const f = fuel / FUEL_MAX;
            const blinkOff = f < 0.25 && Math.floor(performance.now() / 180) % 2 === 0;
            const fillColor = f > 0.5 ? "#30c060" : f > 0.25 ? "#f0a020" : "#ff3020";

            drawJetpackIcon(x, y, color);
            const gx = x + 33;
            for (let i = 0; i < SEG; i++) {
                const sx = gx + i * (segW + segGap);
                ctx.fillStyle = "rgba(0,0,0,0.15)";
                ctx.fillRect(sx, y, segW, h);
                const cell = Math.max(0, Math.min(1, f * SEG - i)); // how full THIS cell is
                if (cell > 0 && !blinkOff) {
                    ctx.fillStyle = fillColor;
                    ctx.fillRect(sx, y + h * (1 - cell), segW, h * cell);
                }
            }
        }

        // A heart centered on (cx, cy), size = its width
        function drawHeart(cx, cy, size, color) {
            const s = size / 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx, cy + s * 0.9); // bottom tip
            ctx.bezierCurveTo(cx - s * 1.2, cy + s * 0.1, cx - s * 0.9, cy - s * 0.9, cx, cy - s * 0.35);
            ctx.bezierCurveTo(cx + s * 0.9, cy - s * 0.9, cx + s * 1.2, cy + s * 0.1, cx, cy + s * 0.9);
            ctx.fill();
        }

        // Lives: one small heart per life left, under the fuel gauge
        function drawLives(x, y) {
            for (let i = 0; i < lives; i++) drawHeart(x + 9 + i * 22, y + 8, 18, "#ff3050");
        }

        // Pause: just the word, nothing else
        function drawPauseOverlay() {
            ctx.textAlign = "center";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 52px monospace";
            ctx.fillText("PAUSE", W / 2, H / 2 + 18);
        }

        function drawPlayer() {
            const px = player.x;
            const py = player.y;

            drawJetFlame(); // behind the runner

            // --- Sprite path (visuals only — the collision hitbox NEVER changes).
            // A state whose frame isn't drawn yet (jump, hold...) shows the run frame. ---
            let name = playerSpriteName();
            if (!assets[name]) name = playerSpritePrefix() + "_run_1";
            const img = assets[name];
            if (img) {
                drawSpriteAnchored(img, name);
                return;
            }

            // --- Placeholder path: a plain dark runner, used while a frame is missing ---
            // Squash is VISUAL ONLY: we scale the drawing around the feet,
            // the collision hitbox stays exactly PLAYER_W x PLAYER_H.
            const drawH = PLAYER_H * squash;
            const drawW = PLAYER_W * (2 - squash); // conserve area: squash down = widen
            const ox = px + (PLAYER_W - drawW) / 2;
            const oy = py + (PLAYER_H - drawH);

            ctx.fillStyle = "#2a2a2a";
            ctx.fillRect(ox, oy, drawW, drawH);
            ctx.fillStyle = "#f7f7f7"; // eye
            ctx.fillRect(ox + drawW - 13, oy + 9, 6, 6);

            // Little legs while running on the ground (simple 2-frame animation)
            if (player.grounded) {
                const legPhase = Math.floor(worldX / 30) % 2;
                ctx.fillStyle = "#2a2a2a";
                if (legPhase === 0) {
                    ctx.fillRect(ox + 5, GROUND_Y - 5, 7, 5);
                    ctx.fillRect(ox + drawW - 12, GROUND_Y - 9, 7, 9);
                } else {
                    ctx.fillRect(ox + 5, GROUND_Y - 9, 7, 9);
                    ctx.fillRect(ox + drawW - 12, GROUND_Y - 5, 7, 5);
                }
            }
        }

        // The player's sprite set: the red gummy (gummy_run_1, gummy_jump, ...)
        function playerSpritePrefix() {
            return "gummy";
        }

        // Picks the sprite frame matching the current player state
        function playerSpriteName() {
            const pre = playerSpritePrefix();
            if (!player.grounded) {
                // Hold frames only show while the jetpack is ACTUALLY firing
                if (player.jetting) {
                    const f = Math.floor(runTime * ANIM_FPS) % HOLD_FRAME_COUNT + 1;
                    return pre + "_hold_" + f;
                }
                if (player.jumpsUsed >= 2) return pre + "_doublejump"; // after the 2nd jump
                return pre + "_jump";                                  // first jump / simple fall
            }
            const f = Math.floor(runTime * RUN_FPS) % runFrameCount() + 1;
            return pre + "_run_" + f; // running on the ground
        }

        // Run frames actually delivered: the loop cycles over what exists (none = placeholder).
        function runFrameCount() {
            let n = 0;
            while (n < RUN_FRAME_COUNT && assets[playerSpritePrefix() + "_run_" + (n + 1)]) n++;
            return n || RUN_FRAME_COUNT;
        }

        // Draws a player sprite at its NATIVE size, centered on the hitbox, its bottom
        // row on the hitbox's bottom edge (= GROUND_Y when running). squash is the
        // takeoff / landing juice — visual only, the hitbox never changes.
        // gummy_hurt (thrown through the air) is anchored on the hitbox CENTER instead.
        function drawSpriteAnchored(img, name) {
            const h = img.height * squash;
            const w = img.width * (2 - squash);
            const anchorX = player.x + PLAYER_W / 2; // horizontal center of the hitbox
            if (name && name.endsWith("_hurt")) {
                const anchorY = player.y + PLAYER_H / 2; // CENTER anchor: he is airborne
                ctx.drawImage(img, Math.round(anchorX - w / 2), Math.round(anchorY - h / 2), w, h);
                return;
            }
            const anchorY = player.y + PLAYER_H;      // bottom of the hitbox (= ground contact)
            ctx.drawImage(img, Math.round(anchorX - w / 2), Math.round(anchorY - h), w, h);
        }

        // Debug: draws the REAL collision box (with its forgiveness padding) over the sprite
        function drawHitboxDebug() {
            const hb = playerHitbox();
            ctx.strokeStyle = "#00e050";
            ctx.lineWidth = 2;
            ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
        }

        // Jetpack flame: a flickering fire cone blasting down and back from the nozzle
        function drawJetFlame() {
            if (!player.jetting) return;
            const n = jetNozzle();
            const len = (48 + Math.random() * 26) * Math.min(1, jetPower * 2); // grows on ignition
            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(Math.PI * 0.72); // pointing down-left, behind the runner
            const g = ctx.createLinearGradient(0, 0, len, 0);
            g.addColorStop(0, "rgba(255,245,200,0.95)");
            g.addColorStop(0.35, "rgba(255,170,40,0.9)");
            g.addColorStop(1, "rgba(255,60,20,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(0, -11);
            ctx.quadraticCurveTo(len * 0.5, -9, len, 0);
            ctx.quadraticCurveTo(len * 0.5, 9, 0, 11);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.85)"; // white-hot core
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.quadraticCurveTo(len * 0.25, -4, len * 0.45, 0);
            ctx.quadraticCurveTo(len * 0.25, 4, 0, 5);
            ctx.fill();
            ctx.restore();
        }

        // Jetpack boost: horizontal streaks rushing past faster than the world
        function drawSpeedLines() {
            if (state !== "playing" || jetPower < 0.05) return;
            const span = W + 200;
            ctx.strokeStyle = `rgba(42,42,42,${0.28 * jetPower})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 14; i++) {
                const len = (60 + (i * 37) % 90) * jetPower;
                const x = span - ((i * 263 + worldX * 1.6) % span) - 100;
                const y = 40 + (i * 97) % (GROUND_Y - 60);
                ctx.moveTo(x, y);
                ctx.lineTo(x + len, y);
            }
            ctx.stroke();
        }

        // Placeholder sky for the run, until its art arrives: soft fluffy clouds
        // drifting slower than the ground (cheap parallax feel).
        // Overlapping circles + a flat belly = classic cartoon cloud silhouette.
        // RULE: nothing overlaps — the clouds are evenly spaced (one per slot, wider
        // than any cloud) and kept in a sky band ABOVE the highest point a pigeon can
        // reach (~y 186), so they never touch a bird, a collectible or each other.
        const CLOUD_COUNT = 4;
        function drawClouds() {
            ctx.fillStyle = "rgba(200,200,200,0.65)";
            const span = W + 240;
            for (let i = 0; i < CLOUD_COUNT; i++) {
                const cxp = (W + 160) - ((i * span / CLOUD_COUNT + worldX * 0.35) % span);
                const cyp = 60 + (i * 47) % 80;   // 60..121: cloud bottoms stay above y ~135
                const r = 10 + (i % 3) * 4; // size variety between clouds
                ctx.beginPath();
                ctx.arc(cxp, cyp, r, 0, Math.PI * 2);
                ctx.arc(cxp + r * 1.1, cyp - r * 0.75, r * 1.3, 0, Math.PI * 2);
                ctx.arc(cxp + r * 2.5, cyp - r * 0.55, r * 1.15, 0, Math.PI * 2);
                ctx.arc(cxp + r * 3.5, cyp, r * 0.95, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(cxp - r * 0.7, cyp - r * 0.15, r * 4.8, r * 1.1); // flat belly
            }
        }

        /* =====================================================================
           RUN BACKDROP — placeholder until the in-game art arrives
           ===================================================================== */

        function drawRunBackdrop() {
            // Sky, oversized so a screen shake never uncovers an edge
            ctx.fillStyle = "#f7f7f7";
            ctx.fillRect(-20, -20, W + 40, H + 40);
            drawClouds();
        }

        // The ground: a flat band under the running line, plus scrolling speed marks
        function drawRunGround() {
            ctx.fillStyle = "#e2e2e2";
            ctx.fillRect(-20, GROUND_Y, W + 40, H - GROUND_Y + 20);
            ctx.fillStyle = "#2a2a2a";
            ctx.fillRect(-20, GROUND_Y, W + 40, 3);
            ctx.fillStyle = "#b5b5b5";
            for (let i = 0; i < 14; i++) {
                const mx = ((i * 104) - (worldX % 104));
                ctx.fillRect(mx, GROUND_Y + 5 + (i % 3) * 4, 17, 2);
            }
        }

        /* =====================================================================
           TITLE SCREEN — the forest
           The still layers back to front (HOME_BACK_LAYERS, the waterfall loop,
           HOME_FRONT_LAYERS), then what lives in them: falling leaves, the
           meditating samurai and his katana, the koi. Everything is drawn at its
           native size on whole pixels, so the pixel art stays crisp.
           ===================================================================== */

        const HOME_SPLASH_T = 0.9;   // how long a koi splash lasts (s)

        // Draws a slot's artwork at its native size (x scale when given) with its
        // top-left corner on (x, y), snapped to whole pixels; flipX / flipY mirror it in
        // place. Slots listed in SPRITE_TRIM draw only their artwork's rect (when the
        // image is big enough to hold it: a trimmed export is drawn whole).
        // False if the image is missing.
        function spriteRect(slot, img) {
            const t = SPRITE_TRIM[slot];
            return t && t.x + t.w <= img.width && t.y + t.h <= img.height ? t : { x: 0, y: 0, w: img.width, h: img.height };
        }
        function drawNative(slot, x, y, flipX, flipY, scale) {
            const img = assets[slot];
            if (!img) return false;
            const t = spriteRect(slot, img);
            const w = Math.round(t.w * (scale || 1)), h = Math.round(t.h * (scale || 1));
            x = Math.round(x);
            y = Math.round(y);
            ctx.save();
            ctx.translate(x + (flipX ? w : 0), y + (flipY ? h : 0));
            ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
            ctx.drawImage(img, t.x, t.y, t.w, t.h, 0, 0, w, h);
            ctx.restore();
            return true;
        }

        // Artwork size of a slot (its SPRITE_TRIM rect when measured, known even before
        // it loads), or the fallback while it is missing
        function slotW(slot, fallback) { const t = SPRITE_TRIM[slot]; return t ? t.w : assets[slot] ? assets[slot].width : fallback; }
        function slotH(slot, fallback) { const t = SPRITE_TRIM[slot]; return t ? t.h : assets[slot] ? assets[slot].height : fallback; }
        function randIn(range) { return rand(range[0], range[1]); }

        // --- The living scene. Set up once at load, then animated on the title
        //     screen AND during the START sequence, so nothing jumps when START is
        //     pressed. ---
        let homeSceneTime = 0;     // the scene's own clock (s)
        let leaves = [];           // {cx, y, w, h, fall, sway, speed, phase, far, slot, size, wait} — cx = center of the sway
        let leafSpawnXs = [];      // where the last leaves came down (center x), newest last
        let kois = [];             // the swimmers: HOME_KOI_SWIMMERS + s (distance along the axis), dir, alpha, mode, wait
        let koiJump = null;        // the tancho's leap in progress {t, x0, dir}, or null
        let koiJumpWait = 2.5;     // time before the next leap (s) — the first one comes early
        let splashes = [];         // see makeSplash: where the tancho broke the water
        let floatClear = [];       // per floater, per x: how low the rocks make it sit (see pondClearance)
        let lookCache = [], lookTime = -1; // sceneAt's answers, for the current frame

        const HOME_LOOK_STEP = 0.1; // s between two looks when a path is played ahead
        const shuffled = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
        // Are rects {x, y, w, h} a and b closer than gap px?
        function rectsNear(a, b, gap) {
            return a.x < b.x + b.w + gap && b.x < a.x + a.w + gap && a.y < b.y + b.h + gap && b.y < a.y + a.h + gap;
        }

        // Draws a slot's artwork centered on (cx, cy), x scale (nearest-neighbour), turned
        // `quarter` quarter turns clockwise and mirrored left/right if asked. Quarter turns
        // and mirrors only move whole pixels (the drawn width and height must be even).
        function drawTurned(slot, cx, cy, quarter, mirror, scale) {
            const img = assets[slot];
            if (!img) return false;
            const t = spriteRect(slot, img);
            const w = Math.round(t.w * (scale || 1)), h = Math.round(t.h * (scale || 1));
            const c = [1, 0, -1, 0][quarter], s = [0, 1, 0, -1][quarter], m = mirror ? -1 : 1;
            ctx.save();
            ctx.translate(Math.round(cx), Math.round(cy));
            ctx.transform(m * c, s, -m * s, c, 0, 0);
            ctx.drawImage(img, t.x, t.y, t.w, t.h, -w / 2, -h / 2, w, h);
            ctx.restore();
            return true;
        }

        // The kite at time t ({x, y, w, h}, flip = flying right: the art faces left): on
        // the flat loop set by its `soar`, through its PSD spot, turning round at soar.left
        // (behind the trunk) and soar.right (off the screen)
        const HOME_TOBI = HOME_BACK_LAYERS.find(L => L.soar);
        function tobiAt(t) {
            const L = HOME_TOBI, s = L.soar;
            const cx = (s.left + s.right) / 2, rx = (s.right - s.left) / 2;
            const a0 = Math.acos((L.x - cx) / rx); // its PSD spot on the loop, heading left
            const a = a0 + t * Math.PI * 2 / s.period;
            return {
                x: cx + rx * Math.cos(a), y: L.y + s.ry * (Math.sin(a) - Math.sin(a0)),
                w: slotW(L.slot, 38), h: slotH(L.slot, 38), flip: Math.sin(a) < 0
            };
        }

        // --- The pond's floating flowers (see HOME_FLOATERS) ---
        const pondTopCol = new Int16Array(W); // HOME_POND_TOP, one value per column
        HOME_POND_TOP.forEach(([x, y], i) => pondTopCol.fill(y, x, i + 1 < HOME_POND_TOP.length ? HOME_POND_TOP[i + 1][0] : W));
        // The highest a floater w px wide, left edge on x, may sit (its top edge, px): under
        // the rock / water edge all along it, and eased down on its way there
        function pondClearance(x, w) {
            const reach = (H - 640) / HOME_FLOAT_EASE; // the pond's rock edges are all below y 640
            let y = 0;
            for (let c = Math.floor(x - reach); c <= x + w + reach; c++) {
                const d = c < x ? x - c : c > x + w ? c - x - w : 0;
                y = Math.max(y, pondTopCol[Math.max(0, Math.min(W - 1, c))] - d * HOME_FLOAT_EASE);
            }
            return Math.ceil(y);
        }
        // Do floaters a and b share columns, counting the current's loop (one that just
        // left on the right is also about to come in on the left)?
        function loopOverlapX(a, b) {
            const d = ((b.x - a.x) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP;
            return d < a.w || HOME_FLOAT_LOOP - d < b.w;
        }
        // Every floater at time t: [{slot, x, y, w, h}], in HOME_FLOATERS order
        function floatersAt(t) {
            const off = HOME_FLOAT_LOOP - W;
            const out = HOME_FLOATERS.map((f, i) => {
                const x = ((f.x + off + HOME_FLOAT_SPEED * t) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP - off;
                const bob = Math.sin(t * Math.PI * 2 / HOME_FLOAT_BOB_T - x / 40) > 0 ? -1 : 0; // the ripple runs with the current
                return { slot: f.slot, x, y: Math.max(f.y + bob, floatClear[i][Math.floor(x) + off]), w: f.w, h: f.h };
            });
            // one that comes under another one (listed before it) is nudged below it
            for (let i = 1; i < out.length; i++)
                for (let j = 0; j < i; j++)
                    if (loopOverlapX(out[i], out[j])) out[i].y = Math.max(out[i].y, out[j].y + out[j].h);
            return out;
        }

        // --- The tancho's leap j = {x0, dir}: x0 = its center as it leaves the water ---
        // At time t into the leap: {x, y, w, h} = what shows above the water, cx / cy = its
        // center, quarter = 0 head up (first half) or 2 head down (second half); null under water
        function tanchoSize() {
            return {
                w: Math.round(slotW(HOME_KOI_JUMPER, 102) * HOME_KOI_JUMP_SCALE),
                h: Math.round(slotH(HOME_KOI_JUMPER, 152) * HOME_KOI_JUMP_SCALE)
            };
        }
        function tanchoAt(j, t) {
            if (t < 0 || t > HOME_KOI_JUMP_T) return null;
            const { w, h } = tanchoSize();
            const p = t / HOME_KOI_JUMP_T;
            const rise = HOME_KOI_WATER_Y - HOME_KOI_JUMP_TOP; // its top is on JUMP_TOP at the top of the arc
            const cx = j.x0 + j.dir * HOME_KOI_JUMP_DX * p;   // a ballistic arc
            const cy = HOME_KOI_WATER_Y + h / 2 - rise * 4 * p * (1 - p);
            const quarter = p < 0.5 ? 0 : 2;
            const top = cy - h / 2;
            if (top >= HOME_KOI_WATER_Y) return null;
            return { x: cx - w / 2, y: top, w, h: Math.min(h, HOME_KOI_WATER_Y - top), cx, cy, quarter };
        }
        // Is leap j clear all the way: nothing in the air along its arc, nothing on the
        // water where it breaks through (a floating flower)? null if not; otherwise the koi
        // that are up where it breaks through ([] = none, it can go)
        function tanchoLeapKoi(j) {
            const w = tanchoSize().w;
            const splash = x => ({ x: x - w / 4, y: HOME_KOI_WATER_Y - 14, w: w / 2, h: 28 }); // its body where it breaks the water
            const out = splash(j.x0), back = splash(j.x0 + j.dir * HOME_KOI_JUMP_DX);
            for (let k = 0; k * HOME_LOOK_STEP <= HOME_KOI_JUMP_T; k++) {
                const tau = k * HOME_LOOK_STEP, f = tanchoAt(j, tau);
                const rs = [tau < 0.3 ? out : tau > HOME_KOI_JUMP_T - 0.3 ? back : null, f].filter(Boolean);
                for (const o of sceneAt(k)) for (const r of rs) if (rectsNear(r, o.r, HOME_LEAF_GAP)) return null;
            }
            return kois.filter(k => k.mode !== "hidden" && assets[k.slot] &&
                (rectsNear(koiRect(k, k.s), out, 12) || rectsNear(koiRect(k, k.s), back, 12)));
        }

        // --- Falling leaves ---
        // A new falling leaf (or cherry blossom), not placed yet. far = falls behind the
        // forest, smaller and slower. slot / size are picked at random when omitted.
        function makeLeaf(far, slot, size) {
            slot = slot || (Math.random() < HOME_BLOSSOM_CHANCE ? "cherry_blossom" : "leaf_1");
            size = size || randIn(far ? HOME_LEAF_FAR_SIZE : HOME_LEAF_SIZE);
            return {
                far, slot, size, cx: 0, y: 0, phase: 0, wait: 0, behind: false,
                w: Math.round(slotW(slot, 40) * size), h: Math.round(slotH(slot, 45) * size),
                fall: randIn(HOME_LEAF_FALL) * size, sway: randIn(HOME_LEAF_SWAY) * size,
                speed: randIn(HOME_LEAF_SWAY_SPEED)
            };
        }
        // A leaf that passes behind the samurai or his katana stays behind them: it comes
        // down on the grass behind him (it is cut off at GROUND_Y, the line he sits on)
        // instead of reappearing in front of the ledge. Its fall ends there.
        const HOME_BEHIND_RECTS = [
            { x: HOME_SAMURAI.x, y: HOME_SAMURAI.y, w: 298, h: GROUND_Y - HOME_SAMURAI.y }, // samuraï.png
            { x: 422, y: 349, w: 35, h: GROUND_Y - 349 }                                     // katana.png's art
        ];
        function leafEnd(l) { return l.behind ? GROUND_Y : H; }
        function leafGoesBehind(l) {
            for (let tau = 0; ; tau += HOME_LOOK_STEP / 2) {
                const r = leafRect(l, tau);
                if (r.y >= GROUND_Y) return false;
                if (HOME_BEHIND_RECTS.some(b => rectsNear(r, b, 0))) return true;
            }
        }
        // Where leaf l will be tau s from now
        function leafRect(l, tau) {
            return { x: l.cx + Math.sin(l.phase + l.speed * tau) * l.sway - l.w / 2, y: l.y + l.fall * tau, w: l.w, h: l.h };
        }
        // Everything whose path is known, k looks (HOME_LOOK_STEP) from now: [{r, who}] —
        // the leaves, the kite, the floaters, the tancho's leap in progress
        function sceneAt(k) {
            if (lookTime !== homeSceneTime) { lookTime = homeSceneTime; lookCache = []; }
            if (!lookCache[k]) {
                const tau = k * HOME_LOOK_STEP, t = homeSceneTime + tau, list = [];
                for (const l of leaves) if (!l.wait && l.y + l.fall * tau < leafEnd(l)) list.push({ r: leafRect(l, tau), who: l });
                list.push({ r: tobiAt(t), who: "tobi" });
                for (const f of floatersAt(t)) list.push({ r: f, who: "float" });
                const j = koiJump && tanchoAt(koiJump, koiJump.t + tau);
                if (j) list.push({ r: j, who: "tancho" });
                lookCache[k] = list;
            }
            return lookCache[k];
        }
        // Does leaf l's whole fall, until it is off the screen, keep HOME_LEAF_GAP from all that?
        function leafPathClear(l) {
            l.behind = !l.far && leafGoesBehind(l);
            for (let k = 0; ; k++) {
                const r = leafRect(l, k * HOME_LOOK_STEP);
                if (r.y >= leafEnd(l)) return true;
                for (const o of sceneAt(k)) if (o.who !== l && rectsNear(r, o.r, HOME_LEAF_GAP)) return false;
            }
        }
        // Leaf l comes down again as a new one, from just above the screen: away from where
        // the last ones came down, at a spot where its whole fall is clear. If there is no
        // such spot right now, it waits a moment and tries again.
        function dropLeaf(l) {
            Object.assign(l, makeLeaf(Math.random() < HOME_LEAF_FAR_CHANCE));
            l.y = -l.h;
            l.wait = 0.4;
            for (let i = 0; i < 24 && l.wait; i++) {
                const cx = rand(0, W);
                if (leafSpawnXs.some(x => Math.abs(x - cx) < HOME_LEAF_SPREAD)) continue;
                l.cx = cx;
                l.phase = rand(0, Math.PI * 2);
                if (leafPathClear(l)) {
                    l.wait = 0;
                    leafSpawnXs = leafSpawnXs.concat(cx).slice(-HOME_LEAF_MEMORY);
                }
            }
            lookTime = -1; // the scene changed
        }

        // --- Koi ---
        function koiRect(k, s) { return { x: k.x + k.axis[0] * s, y: k.y + k.axis[1] * s - 1, w: k.w, h: k.h + 2 }; } // + its 1px bob
        // Would koi k, at rect r, touch something within `ahead` s: a floater, a leaf, the
        // leaping tancho, another koi that is up?
        function koiBlocked(k, r, ahead) {
            for (let tau = 0; tau <= ahead; tau += 0.25) {
                for (const f of floatersAt(homeSceneTime + tau)) if (rectsNear(r, f, 2)) return true;
                for (const l of leaves) if (!l.wait && l.y + l.fall * tau < leafEnd(l) && rectsNear(r, leafRect(l, tau), 2)) return true;
                const j = koiJump && tanchoAt(koiJump, koiJump.t + tau);
                if (j && rectsNear(r, j, 2)) return true;
            }
            return kois.some(o => o !== k && o.mode !== "hidden" && assets[o.slot] && rectsNear(r, koiRect(o, o.s), 2));
        }

        function initHomeScene() {
            const off = HOME_FLOAT_LOOP - W;
            floatClear = HOME_FLOATERS.map(f => Int16Array.from({ length: HOME_FLOAT_LOOP }, (_, i) => pondClearance(i - off, f.w)));
            kois = HOME_KOI_SWIMMERS.map(k => ({ ...k, s: 0, dir: 1, alpha: 1, mode: "swim", wait: 0 }));
            // The leaves: the PSD's where the master has them (only their pace and sway are
            // drawn at random, until their fall is clear), then a few far ones at random
            // spots. One that finds no clear fall comes down later, from above.
            leaves = [];
            const add = make => {
                let l;
                for (let i = 0; i < 40; i++) {
                    l = make();
                    if (leafPathClear(l)) break;
                    l.wait = rand(1, 4);
                }
                leaves.push(l);
                lookTime = -1;
            };
            const starts = HOME_LEAF_START.map(s => ["leaf_1", ...s]).concat(HOME_BLOSSOM_START.map(s => ["cherry_blossom", ...s]));
            for (const [slot, cx, cy, size] of starts)
                add(() => { const l = makeLeaf(false, slot, size); l.cx = cx; l.y = cy - l.h / 2; return l; });
            for (let i = 0; i < HOME_LEAF_FAR_START; i++)
                add(() => { const l = makeLeaf(true); l.cx = rand(0, W); l.y = rand(0, GROUND_Y); l.phase = rand(0, Math.PI * 2); return l; });
        }

        function updateHomeScene(dt) {
            homeSceneTime += dt;

            // Leaves: fall and sway; once out of the screen they come down again from above
            // (a leaf waiting for a clear spot is not on screen)
            for (const l of leaves) {
                if (l.wait > 0) {
                    if ((l.wait -= dt) <= 0) dropLeaf(l);
                    continue;
                }
                l.y += l.fall * dt;
                l.phase += l.speed * dt;
                if (l.y > leafEnd(l)) dropLeaf(l);
            }

            // Swimmers: back and forth along their axis; they turn back at each end or when
            // something is in the way, dive when hemmed in, and come back up where it is clear
            for (const k of kois) {
                if (!assets[k.slot]) continue; // not exported yet
                const clampS = s => Math.max(k.min, Math.min(k.max, s));
                if (k.mode === "swim") {
                    const free = d => (d > 0 ? k.s < k.max : k.s > k.min) &&
                        !koiBlocked(k, koiRect(k, clampS(k.s + d * HOME_KOI_LOOK)), 1);
                    if (!free(k.dir)) k.dir = -k.dir;
                    if (free(k.dir)) k.s = clampS(k.s + k.dir * k.speed * dt);
                    else k.mode = "dive";
                } else if (k.mode === "dive") {
                    if ((k.alpha -= dt / HOME_KOI_DIVE_T) <= 0) { k.alpha = 0; k.mode = "hidden"; k.wait = rand(1, 3); }
                } else if (k.mode === "hidden") {
                    if ((k.wait -= dt) <= 0) {
                        const s = rand(k.min, k.max);
                        if (koiBlocked(k, koiRect(k, s), 2.5)) k.wait = 0.5;
                        else { k.s = s; k.dir = Math.random() < 0.5 ? 1 : -1; k.mode = "rise"; }
                    }
                } else if (koiBlocked(k, koiRect(k, k.s), 1)) {
                    k.mode = "dive"; // coming up, and something is on its way: back down
                } else if ((k.alpha += dt / HOME_KOI_DIVE_T) >= 1) {
                    k.alpha = 1;
                    k.mode = "swim";
                }
            }

            // The tancho: waits, then leaps from a spot where its whole arc is clear (a
            // random one of HOME_KOI_JUMP_SHIFT, either way) — a splash each way. If only
            // koi are in its way, they dive out of sight and it leaps once they are gone.
            if (koiJump) {
                koiJump.t += dt;
                if (koiJump.t >= HOME_KOI_JUMP_T) {
                    splashes.push(makeSplash(koiJump.x0 + koiJump.dir * HOME_KOI_JUMP_DX, true));
                    koiJump = null;
                    koiJumpWait = randIn(HOME_KOI_JUMP_GAP);
                }
            } else if ((koiJumpWait -= dt) <= 0) {
                koiJumpWait = 0.5; // busy everywhere: it looks again in a moment
                let inTheWay = null;
                search: for (const shift of shuffled(HOME_KOI_JUMP_SHIFT)) {
                    for (const dir of shuffled([1, -1])) {
                        const j = { t: 0, dir, x0: HOME_KOI_JUMP_CX + shift - dir * HOME_KOI_JUMP_DX / 2 };
                        const koi = tanchoLeapKoi(j);
                        if (!koi) continue;
                        if (koi.length) { inTheWay = inTheWay || koi; continue; }
                        koiJump = j;
                        splashes.push(makeSplash(j.x0, false));
                        lookTime = -1; // the scene changed
                        inTheWay = null;
                        break search;
                    }
                }
                if (inTheWay) for (const k of inTheWay) if (k.mode !== "dive") k.mode = "dive";
            }
            for (const s of splashes) s.t += dt;
            splashes = splashes.filter(s => s.t < HOME_SPLASH_T);
        }

        // Sky, clouds, mountains, forest, the waterfall's current frame, rocks, ground
        function drawHomeBackdrop() {
            ctx.fillStyle = "#56dbfd"; // sky.png's own color, also the placeholder while it loads
            ctx.fillRect(0, 0, W, H);
            for (const L of HOME_BACK_LAYERS) {
                if (L.leavesBehind) drawLeaves(true);
                let x = L.x || 0, y = L.y || 0, flipX = false;
                if (L.drift) {
                    // right to left, back in from the right once fully gone
                    const w = slotW(L.slot, 0), period = W + w;
                    x = -w + ((((x + w - L.drift * homeSceneTime) % period) + period) % period);
                }
                if (L.soar) ({ x, y, flip: flipX } = tobiAt(homeSceneTime)); // flying right: mirrored
                if (L.blend) ctx.globalCompositeOperation = L.blend;
                drawNative(L.slot, x, y, flipX);
                ctx.globalCompositeOperation = "source-over";
            }
            for (const L of HOME_FRONT_LAYERS) drawNative(L.slot, L.x || 0, L.y || 0);
            drawHomeWater();
        }

        // --- Water, animated by code (see HOME_WATER_*) ---
        // The streaks are drawn on an offscreen canvas, cut to water_mask with
        // "destination-in" (only the mask's pixels keep them), then laid over the art.
        // No pixel is ever read back, so it also works when the page is opened as a file.
        const waterCanvas = document.createElement("canvas");
        waterCanvas.width = W;
        waterCanvas.height = H;
        const waterCtx = waterCanvas.getContext("2d");
        let waterStreaks = null;   // one list of seeds per zone, built on first use
        let waterTick = -1;        // the pattern step currently on waterCanvas

        // Small seeded random generator: the same pattern on every load
        function seededRandom(seed) {
            return () => {
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function buildWaterStreaks() {
            const rnd = seededRandom(1234);
            const between = (range) => range[0] + rnd() * (range[1] - range[0]);
            return HOME_WATER_ZONES.map(z => {
                const F = HOME_WATER_FLOWS[z.flow];
                return Array.from({ length: Math.round(z.w * z.h * F.density) }, () => ({
                    x: rnd() * z.w, y: rnd() * z.h, len: Math.round(between(F.len)),
                    speed: between(F.speed), phase: rnd() * Math.PI * 2, light: rnd() < F.light
                }));
            });
        }

        function drawHomeWater() {
            const mask = assets["water_mask"];
            if (!mask) return;
            const tick = Math.floor(homeSceneTime * HOME_WATER_FPS);
            if (tick !== waterTick) {
                waterTick = tick;
                const t = tick / HOME_WATER_FPS;
                if (!waterStreaks) waterStreaks = buildWaterStreaks();
                waterCtx.clearRect(0, 0, W, H);
                HOME_WATER_ZONES.forEach((z, i) => {
                    const F = HOME_WATER_FLOWS[z.flow];
                    waterCtx.save();
                    waterCtx.beginPath();
                    waterCtx.rect(z.x, z.y, z.w, z.h); // a zone's streaks never spill into the next
                    waterCtx.clip();
                    for (const s of waterStreaks[i]) {
                        waterCtx.fillStyle = s.light ? HOME_WATER_LIGHT : HOME_WATER_DARK;
                        if (F.dir === "down") {
                            const y = ((s.y + s.speed * t) % (z.h + s.len)) - s.len;
                            waterCtx.fillRect(z.x + Math.round(s.x), z.y + Math.round(y), 1, s.len);
                        } else if (F.dir === "flow") {
                            const y = (s.y + s.speed * t) % z.h;
                            waterCtx.fillRect(z.x + Math.round(s.x), z.y + Math.round(y), s.len, 1);
                        } else {
                            if (Math.sin(t * 1.6 + s.phase) < -0.2) continue; // twinkle: off for a moment
                            const x = ((s.x + s.speed * t) % (z.w + s.len)) - s.len;
                            waterCtx.fillRect(z.x + Math.round(x), z.y + Math.round(s.y), s.len, 1);
                        }
                    }
                    waterCtx.restore();
                });
                waterCtx.globalCompositeOperation = "destination-in"; // keep them on water pixels only
                waterCtx.drawImage(mask, 0, 0);
                waterCtx.globalCompositeOperation = "source-over";
            }
            ctx.drawImage(waterCanvas, 0, 0);
        }

        // The samurai at his PSD spot, meditating. On the out-breath the rows above
        // HOME_BREATH_SPLIT are drawn HOME_BREATH_PX lower, over the top row below them:
        // whole rows moved by whole pixels, nothing is ever resampled. eyeOpen draws
        // eye.png on him — it follows the breath, it is part of his head. alertT = how long
        // he has been looking at the gummy (s): the "!!" pop up next to his head.
        function drawHomeSamurai(eyeOpen, alertT) {
            const img = assets["samuraï"];
            if (!img) return;
            const { x, y } = HOME_SAMURAI, s = HOME_BREATH_SPLIT;
            const out = Math.sin(homeSceneTime * Math.PI * 2 / HOME_BREATH_PERIOD) > 0 ? HOME_BREATH_PX : 0;
            ctx.drawImage(img, 0, s, img.width, img.height - s, x, y + s, img.width, img.height - s);
            ctx.drawImage(img, 0, 0, img.width, s, x, y + out, img.width, s);
            if (eyeOpen) drawNative("eye", HOME_EYE.x, HOME_EYE.y + out);
            if (alertT >= 0) {
                // the first "!" pops, then the second one a beat later, each with a 2px hop
                for (let i = 0; i < 2; i++) {
                    const t = alertT - i * 0.08;
                    if (t < 0) continue;
                    const hop = t < 0.1 ? 2 : 0;
                    drawAlertMark(HOME_ALERT.x + i * 10, HOME_ALERT.y - i * 4 + out - hop);
                }
            }
        }
        // One "!", pixel art on a 2px grid: a bar and a dot in HOME_ALERT_COLOR, outlined
        const ALERT_MARK = ["##", "##", "##", "##", "##", "..", "##", "##"];
        function drawAlertMark(x, y) {
            const px = 2, rows = ALERT_MARK.length, cols = ALERT_MARK[0].length;
            const on = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols && ALERT_MARK[r][c] === "#";
            x = Math.round(x);
            y = Math.round(y);
            ctx.fillStyle = HOME_ALERT_OUTLINE;
            for (let r = -1; r <= rows; r++)
                for (let c = -1; c <= cols; c++)
                    if (!on(r, c) && [-1, 0, 1].some(dr => [-1, 0, 1].some(dc => on(r + dr, c + dc))))
                        ctx.fillRect(x + (c + 1) * px, y + (r + 1) * px, px, px);
            ctx.fillStyle = HOME_ALERT_COLOR;
            for (let r = 0; r < rows; r++)
                for (let c = 0; c < cols; c++)
                    if (on(r, c)) ctx.fillRect(x + (c + 1) * px, y + (r + 1) * px, px, px);
        }

        // A splash where the tancho breaks the water at x: its droplets are drawn once, at
        // random, when it starts. entry = diving back in (a little bigger).
        function makeSplash(x, entry) {
            const k = entry ? 1.2 : 1;
            const drops = Array.from({ length: Math.round(HOME_SPLASH_DROPS * k) }, () => {
                const a = Math.PI * rand(0.12, 0.88), v = randIn(HOME_SPLASH_SPEED) * k; // a crown, mostly upward
                return {
                    x: rand(-14, 14), vx: Math.cos(a) * v, vy: -Math.sin(a) * v,
                    size: Math.random() < 0.3 ? 3 : 2,
                    color: HOME_SPLASH_COLORS[Math.floor(Math.random() * HOME_SPLASH_COLORS.length)]
                };
            });
            return { x, t: 0, k, drops };
        }
        // The rings and the foam are drawn on their own canvas and cut to water_mask (like
        // the water), so they never spill over a rock; the droplets are in the air.
        const splashCanvas = document.createElement("canvas");
        splashCanvas.width = W;
        splashCanvas.height = H;
        function drawSplashes() {
            if (!splashes.length) return;
            const Y = HOME_KOI_WATER_Y, mask = assets["water_mask"];
            const sctx = splashCanvas.getContext("2d");
            sctx.clearRect(0, 0, W, H);
            for (const s of splashes) {
                const p = s.t / HOME_SPLASH_T;
                // ripple rings: flat ellipses of whole pixels, spreading and fading out
                for (const lag of [0, 0.22]) {
                    const q = (p - lag) / (1 - lag);
                    if (q <= 0) continue;
                    const rx = (HOME_SPLASH_RING[0] + (HOME_SPLASH_RING[1] - HOME_SPLASH_RING[0]) * Math.sqrt(q)) * s.k;
                    const ry = Math.max(2, rx * 0.16);
                    sctx.globalAlpha = 0.7 * (1 - q);
                    sctx.fillStyle = HOME_SPLASH_COLORS[1];
                    for (let a = 0; a < Math.PI * 2; a += 2 / rx)
                        sctx.fillRect(Math.round(s.x + Math.cos(a) * rx), Math.round(Y + 2 + Math.sin(a) * ry), 2, 1);
                }
                // foam: a white burst on the water line that shrinks away
                if (p < 0.45) {
                    const fw = Math.round(34 * s.k * (1 - p / 0.45)), fh = Math.max(1, Math.round(6 * (1 - p / 0.45)));
                    sctx.globalAlpha = 0.9;
                    sctx.fillStyle = "#ffffff";
                    sctx.fillRect(Math.round(s.x - fw / 2), Y - fh + 2, fw, fh);
                    sctx.fillStyle = HOME_SPLASH_COLORS[2];
                    sctx.fillRect(Math.round(s.x - fw / 2) - 3, Y + 1, fw + 6, 2);
                }
            }
            sctx.globalAlpha = 1;
            if (mask) {
                sctx.globalCompositeOperation = "destination-in"; // on water pixels only
                sctx.drawImage(mask, 0, 0);
                sctx.globalCompositeOperation = "source-over";
            }
            ctx.drawImage(splashCanvas, 0, 0);
            for (const s of splashes) {
                // droplets: thrown up, pulled back down, gone once they are back in the pond
                ctx.globalAlpha = 1;
                for (const d of s.drops) {
                    const dy = d.vy * s.t + HOME_SPLASH_GRAVITY * s.t * s.t / 2;
                    if (dy > 0 && s.t > 0.05) continue;
                    ctx.fillStyle = d.color;
                    ctx.fillRect(Math.round(s.x + d.x + d.vx * s.t), Math.round(Y + dy) - d.size, d.size, d.size);
                }
            }
            ctx.globalAlpha = 1;
        }

        // The pond: the swimmers (faded while they dive) under the floating flowers, then
        // the leaping tancho and its splashes
        function drawKois() {
            for (let i = 0; i < kois.length; i++) {
                const k = kois[i];
                if (k.alpha <= 0) continue;
                const bob = Math.round(Math.sin(homeSceneTime * 1.3 + i * 2)); // ±1px
                const back = k.dir < 0;                                       // swimming back: turned round
                ctx.globalAlpha = k.alpha;
                drawNative(k.slot, k.x + k.axis[0] * k.s, k.y + k.axis[1] * k.s + bob, back, back && k.turn === "rotate");
            }
            ctx.globalAlpha = 1;
            for (const f of floatersAt(homeSceneTime)) drawNative(f.slot, f.x, f.y);
            const leap = koiJump && tanchoAt(koiJump, koiJump.t);
            if (leap) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, HOME_KOI_WATER_Y); // nothing of it shows under the water line
                ctx.clip();
                drawTurned(HOME_KOI_JUMPER, leap.cx, leap.cy, leap.quarter, koiJump.dir < 0, HOME_KOI_JUMP_SCALE); // leaping left: mirrored
                ctx.restore();
            }
            drawSplashes();
        }

        // The leaves of one depth, each at its own whole-pixel size (nearest-neighbour,
        // like the rest of the pixel art), mirrored while it swings back to the left —
        // which reads as the leaf turning over.
        function drawLeaves(far) {
            for (const l of leaves) {
                if (l.far !== far || l.wait > 0) continue;
                const r = leafRect(l, 0);
                if (l.behind) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, W, GROUND_Y); // lands on the grass behind the samurai
                    ctx.clip();
                }
                drawNative(l.slot, r.x, r.y, Math.cos(l.phase) < 0, false, l.size);
                if (l.behind) ctx.restore();
            }
        }

        // The whole title-screen scene, in the PSD's order: the backdrop (with the far
        // leaves inside it, behind the forest), the front leaves, the koi, the title,
        // the katana, the samurai. actors() draws the START sequence's portals and
        // gummy last, so the gummy runs in front of the samurai. eyeOpen / alertT: see drawHomeSamurai.
        function drawHomeScene(actors, eyeOpen, alertT) {
            drawHomeBackdrop();
            drawLeaves(false);
            drawKois();
            drawHomeTitle();
            drawNative("katana", 0, 0);
            drawHomeSamurai(eyeOpen || HOME_EYE_ALWAYS, eyeOpen ? alertT : -1);
            if (actors) actors();
        }

        // --- Standing sprites (the koala of the death sequence) ---
        // fill = how much of its frame height the artwork covers, bottom = the
        // transparent padding under it: enough to stand it on the ground at a
        // given character height, whatever its frame looks like.
        const STANDING_ART = { "koala_running": { fill: 0.979, bottom: 0.021 } };
        const KOALA_BASE = "koala_running";
        const KOALA_FRAMES = 2;

        // Draws a sprite so that its CHARACTER stands charH tall with its feet on
        // groundY; flip mirrors it horizontally around its own center.
        function drawStandingSprite(name, cx, groundY, charH, flip) {
            const img = assets[name];
            const a = STANDING_ART[name.replace(/_\d+$/, "")] || { fill: 1, bottom: 0 };
            if (!img) {
                // Placeholder block, same footprint as the real character would have
                const w = charH * 0.55;
                ctx.fillStyle = "#c03030";
                ctx.fillRect(cx - w / 2, groundY - charH, w, charH);
                return false;
            }
            const frameH = charH / a.fill;                 // the full frame, padding included
            const frameW = frameH * (img.width / img.height);
            const top = groundY - frameH * (1 - a.bottom); // put the ARTWORK's base on groundY
            if (flip) {
                ctx.save();
                ctx.translate(cx, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(img, -frameW / 2, top, frameW, frameH);
                ctx.restore();
            } else {
                ctx.drawImage(img, cx - frameW / 2, top, frameW, frameH);
            }
            return true;
        }

        // Picks the current frame of a numbered loop (koala_running_1..2, etc.)
        function loopFrame(base, count, fps, t) {
            return base + "_" + (Math.floor(t * fps) % count + 1);
        }

        // The FULL SEND title (title.png, full canvas): already in place at its PSD spot,
        // bobbing gently (whole pixels)
        function drawHomeTitle() {
            const bob = Math.sin(performance.now() / 1000 * HOME_LOGO_BOUNCE_SPEED) * HOME_LOGO_BOUNCE_PX;
            const dy = HOME_TITLE_SHIFT.y + bob;
            if (!drawNative("title", HOME_TITLE_SHIFT.x, dy)) {
                drawPixelText("FULL SEND", W / 2 + 5, 240 + dy + 5, 16, 5, MENU_SHADOW);
                drawPixelText("FULL SEND", W / 2, 240 + dy, 16, 5, "#ffffff");
            }
        }
        // LOADING progress, 0..1: the real image loading, but never faster than
        // LOADING_MIN_T so the screen doesn't just blink past
        function loadingProgress() {
            return Math.min(1, bootTime / LOADING_MIN_T, assetsSettled / ASSET_SLOTS.length);
        }

        // LOADING screen: web-blue gradient, faint grid, LOADING... / PLEASE WAIT...
        // and a segmented progress bar following the real asset loading
        function drawBoot() {
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, "#00008c");
            bg.addColorStop(1, "#0000EE");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "rgba(255,255,255,0.07)"; // graph-paper grid
            for (let x = 0; x < W; x += 36) ctx.fillRect(x, 0, 1, H);
            for (let y = 0; y < H; y += 36) ctx.fillRect(0, y, W, 1);

            const p = loadingProgress();
            // Optical centering: the WORDS sit on the center line and the dots hang off
            // to the right (centering "LOADING..." as a whole pushes the word visibly left)
            ctx.textAlign = "left";
            ctx.font = "bold 46px monospace";
            ctx.fillStyle = "#ffffff";
            const dots = ".".repeat(Math.floor(performance.now() / 350) % 4);
            ctx.fillText("LOADING" + dots, W / 2 - ctx.measureText("LOADING").width / 2, H / 2 - 26);
            ctx.font = "bold 22px monospace";
            ctx.fillStyle = "#7fe3ff";
            ctx.fillText("PLEASE WAIT...", W / 2 - ctx.measureText("PLEASE WAIT").width / 2, H / 2 + 14);

            // Segmented progress bar
            const SEG = 24, segW = 14, gap = 4, bh = 18;
            const bw = SEG * segW + (SEG - 1) * gap;
            const bx = W / 2 - bw / 2, by = H / 2 + 50;
            ctx.strokeStyle = "#7fe3ff";
            ctx.lineWidth = 2;
            ctx.strokeRect(bx - 6, by - 6, bw + 12, bh + 12);
            const lit = Math.floor(p * SEG);
            for (let i = 0; i < SEG; i++) {
                ctx.fillStyle = i < lit ? "#39ff9e" : "rgba(127,227,255,0.15)";
                ctx.fillRect(bx + i * (segW + gap), by, segW, bh);
            }
            ctx.font = "bold 14px monospace";
            ctx.textAlign = "center";
            ctx.fillStyle = "#7fe3ff";
            ctx.fillText(Math.floor(p * 100) + "%", W / 2, by + bh + 34);
        }

        // Title screen. PRESS START only shows up once everything else is in place (see
        // homeReady), and fades in over HOME_MENU_FADE_T.
        function drawHome() {
            drawHomeScene(null);

            if (homeReady()) {
                const P = HOME_PRESS_START;
                ctx.globalAlpha = Math.min(1, homeMenuTime / HOME_MENU_FADE_T);
                ctx.font = P.font;
                ctx.textAlign = "left";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = P.color;
                ctx.fillText(P.text, P.x, P.y);
                ctx.globalAlpha = 1;
            }

            drawControlsHint(H - 34, "#ffffff");
        }

        // Shared menu renderer: highlights the selected row. shadow (optional) puts a
        // drop shadow under every label, for text sitting on busy art.
        function drawMenu(items, rowsY, selected, color, shadow) {
            ctx.textAlign = "center";
            for (let i = 0; i < items.length; i++) {
                const isSel = i === selected;
                ctx.font = isSel ? "bold 30px monospace" : "24px monospace";
                const tw = ctx.measureText(items[i]).width;
                const row = (d, fill) => {
                    ctx.fillStyle = fill;
                    ctx.fillText(items[i], W / 2 + d, rowsY[i] + d); // the label itself stays perfectly centered
                    // selection arrow drawn separately so it doesn't shift the label
                    if (isSel) ctx.fillText(">", W / 2 - tw / 2 - 26 + d, rowsY[i] + d);
                };
                if (shadow) row(2, shadow);
                row(0, isSel ? "#ff3020" : color);
            }
        }

        // Draws one keyboard key cap: gray body, darker label for contrast
        function drawKeyCap(x, y, w, h, label) {
            ctx.fillStyle = "#909090";                 // key body
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "#5a5a5a";                 // pressed edge at the bottom
            ctx.fillRect(x, y + h - 3, w, 3);
            ctx.fillStyle = "#2e2e2e";                 // label, darker gray/black
            ctx.font = "bold 12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(label, x + w / 2, y + h / 2 + 4);
        }

        // Controls reminder at the very bottom (home + in game): "JUMP =" + SPACE key cap
        function drawControlsHint(cy, captionColor) {
            ctx.globalAlpha = 0.85;
            ctx.font = "bold 12px monospace";
            const label = "JUMP =", keyW = 80, gap = 8;
            const tw = ctx.measureText(label).width;
            const x = W / 2 - (tw + gap + keyW) / 2; // the pair is centered as one block
            ctx.fillStyle = captionColor;
            ctx.textAlign = "left";
            ctx.fillText(label, x, cy + 14);
            drawKeyCap(x + tw + gap, cy, keyW, 20, "SPACE");
            ctx.globalAlpha = 1;
        }

        /* ---------------------------------------------------------------------
           START SEQUENCE — same forest, the menu gone. A portal opens on the left,
           the gummy runs out of it, in front of the meditating samurai, into the
           portal on the right; both close, fade to black, the run starts.
           The gummy is clipped to the space BETWEEN the two portal centers: that
           is what makes him come out of the first one and vanish into the second.
           --------------------------------------------------------------------- */

        function gummyWidth() { return slotW(playerSpritePrefix() + "_run_1", 74); }
        function gummyRunSlot(t) { return playerSpritePrefix() + "_run_" + (Math.floor(t * RUN_FPS) % runFrameCount() + 1); }

        // 0..1 size of a portal: opens from openAt, closes from closeAt
        function portalScale(t, openAt, closeAt) {
            const open = (t - openAt) / PORTAL_OPEN_T;
            const close = 1 - (t - closeAt) / PORTAL_OPEN_T;
            return Math.max(0, Math.min(1, open, close));
        }

        // Portal frames actually delivered (the swirl loops over what exists)
        function portalFrameCount() {
            let n = 0;
            while (n < PORTAL_FRAME_COUNT && assets["Portal/portal_" + (n + 1)]) n++;
            return n;
        }

        // A portal — the swirl's frame for time t — centered on (cx, PORTAL_CENTER_Y):
        // native size once open, scaled around its center while it opens / closes (no
        // smoothing, so it stays pixelated); flip mirrors it (see PORTAL_*_FLIP)
        function drawPortal(cx, s, flip, t) {
            if (s <= 0) return;
            const n = portalFrameCount();
            const img = n ? assets["Portal/portal_" + (Math.floor(t * PORTAL_FPS) % n + 1)] : null;
            const pw = img ? img.width : 100, ph = img ? img.height : 156;
            const cy = PORTAL_CENTER_Y;
            if (!img) {
                ctx.fillStyle = "#5a2ab0"; // placeholder: a purple oval
                ctx.beginPath();
                ctx.ellipse(cx, cy, pw / 2 * s, ph / 2 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                return;
            }
            const w = Math.round(pw * s), h = Math.round(ph * s);
            const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
            ctx.save();
            ctx.translate(flip ? x + w : x, y);
            if (flip) ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, w, h);
            ctx.restore();
        }

        function drawIntro() {
            const tl = introTimeline();
            const t = introTime;
            const rt = t - tl.run;                                           // time since the gummy set off
            const x = PORTAL_LEFT_X - gummyWidth() + INTRO_GUMMY_SPEED * rt; // its left edge
            const running = t >= tl.run && t < tl.arrive;
            // The samurai opens an eye while the gummy runs past him
            const gcx = x + gummyWidth() / 2;
            const peek = running && gcx >= HOME_EYE_RANGE[0] && gcx <= HOME_EYE_RANGE[1];
            const alertT = (gcx - HOME_EYE_RANGE[0]) / INTRO_GUMMY_SPEED; // since he opened his eye (s)

            drawHomeScene(() => {
                drawPortal(PORTAL_LEFT_X, portalScale(t, 0, tl.leftClose), PORTAL_LEFT_FLIP, t);
                drawPortal(PORTAL_RIGHT_X, portalScale(t, tl.rightOpen, tl.arrive), PORTAL_RIGHT_FLIP, t);
                if (!running) return;
                const slot = gummyRunSlot(rt);
                // Only one run frame so far: a little hop stands in for the legs
                const hop = runFrameCount() === 1
                    ? Math.round(Math.abs(Math.sin(rt * Math.PI * INTRO_GUMMY_HOP_HZ)) * INTRO_GUMMY_HOP_PX) : 0;
                ctx.save();
                ctx.beginPath();
                ctx.rect(PORTAL_LEFT_X, 0, PORTAL_RIGHT_X - PORTAL_LEFT_X, H);
                ctx.clip();
                if (!drawNative(slot, x, GROUND_Y - slotH(slot, 0) - hop)) {
                    ctx.fillStyle = "#e01010"; // placeholder gummy
                    ctx.fillRect(Math.round(x), GROUND_Y - PLAYER_H - hop, PLAYER_W, PLAYER_H);
                }
                ctx.restore();
            }, peek, alertT);

            ctx.textAlign = "center";
            ctx.font = "14px monospace";
            ctx.fillStyle = MENU_SHADOW;
            ctx.fillText("press to skip", W / 2 + 1, H - 15);
            ctx.fillStyle = "#ffffff";
            ctx.fillText("press to skip", W / 2, H - 16);

            // Fade to black once both portals have closed
            if (t >= tl.fade) {
                ctx.globalAlpha = Math.min(1, (t - tl.fade) / INTRO_FADE_T);
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }
        }
        // Death sequence, in two beats:
        //
        //   beat 1  (0 -> DEATH_CATCH_FRAC)
        //     The runner is already in his player_hurt pose — die() switches him the
        //     instant the collision lands — and he stays frozen in it. A koala sprints
        //     in from the LEFT to catch him. The koala artwork faces left by default,
        //     but here he is running right, so THIS is where the mirror belongs.
        //
        //   beat 2  (DEATH_CATCH_FRAC -> 1)
        //     The koala reaches him: both vanish on the spot, and gameover_player_1..7
        //     plays through once while GAME OVER drops down the screen.
        //
        // The gameover frames share a 1888x1436 canvas, so they are drawn as FULL frames
        // at one fixed size: no trimming, no jitter between them.
        function drawDeathSequence() {
            const p = 1 - deathTimer / DEATH_SEQUENCE_DURATION; // 0 -> 1
            const elapsed = DEATH_SEQUENCE_DURATION * p;

            // Light veil only
            ctx.fillStyle = `rgba(10,5,8,${0.35 * p})`;
            ctx.fillRect(0, 0, W, H);

            // A fall into the void leaves player.y far below the screen, so the feet line
            // is clamped to the ground: the sequence must stay visible whatever killed us.
            const cx = player.x + PLAYER_W / 2;
            const feetY = Math.min(player.y + PLAYER_H, GROUND_Y);

            if (p < DEATH_CATCH_FRAC) {
                // ---- Beat 1: the runner lies there, the koala closes in from the left ----
                const kp = p / DEATH_CATCH_FRAC;
                const kEase = kp * (0.75 + 0.25 * kp);       // steady charge, closing a little faster
                const koalaX = W * DEATH_KOALA_FROM + (cx - W * DEATH_KOALA_FROM) * kEase;
                const koalaSlot = loopFrame(KOALA_BASE, KOALA_FRAMES, DEATH_KOALA_FPS, elapsed);
                // Running RIGHT, against the artwork's own facing => mirrored
                drawStandingSprite(koalaSlot, koalaX, GROUND_Y, DEATH_KOALA_H, true);

                // The runner, thrown and motionless: gummy_hurt hangs off the hitbox
                // CENTER rather than off the feet.
                const hurt = assets[playerSpritePrefix() + "_hurt"];
                if (hurt) {
                    const h = hurt.height, w = hurt.width;
                    ctx.drawImage(hurt, cx - w / 2, feetY - PLAYER_H / 2 - h / 2, w, h);
                } else {
                    ctx.fillStyle = "#c03030";
                    ctx.fillRect(cx - PLAYER_W / 2, feetY - PLAYER_H, PLAYER_W, PLAYER_H);
                }
                return; // GAME OVER only starts dropping once he has been caught
            }

            // ---- Beat 2: both are gone, the game-over animation takes over ----
            const tail = (p - DEATH_CATCH_FRAC) / (1 - DEATH_CATCH_FRAC); // 0 -> 1
            const tailElapsed = elapsed - DEATH_SEQUENCE_DURATION * DEATH_CATCH_FRAC;

            // Frames 1..7 play through once, then the last one holds
            const f = Math.min(GAMEOVER_FRAME_COUNT,
                Math.floor(tailElapsed / GAMEOVER_BEAT_FRAME_T) + 1);
            const dieImg = assets["gameover_player_" + f];
            if (dieImg) {
                // Same fixed height for every frame, anchored on the player's feet line
                const h = GAMEOVER_FRAME_H, w = h * (dieImg.width / dieImg.height);
                ctx.drawImage(dieImg, cx - w / 2, feetY - h, w, h);
            } else {
                const size = PLAYER_W * (1 + Math.sin(tail * Math.PI * 6) * 0.15);
                ctx.save();
                ctx.translate(cx, feetY - PLAYER_H / 2);
                ctx.rotate(tail * Math.PI * 2);
                ctx.fillStyle = "#2a2a2a";
                ctx.fillRect(-size / 2, -size / 2, size, size);
                ctx.restore();
            }

            // GAME OVER slides from above down to the center over this second beat
            const ease = 1 - (1 - tail) * (1 - tail); // settles gently at the end
            const goY = -80 + ease * (H / 2 + 80);
            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 92px monospace";
            ctx.fillText("GAME OVER", W / 2, goY);
            ctx.fillStyle = "#f0e0d0";
            ctx.font = "17px monospace";
            ctx.fillText("(" + deathCause + ")", W / 2, goY + 44);
        }

        // NOTE: currently unused — the flow now goes dying -> leaderboard directly.
        // Kept around in case we bring a game-over menu back later.
        function drawGameOverScreen() {
            ctx.fillStyle = "rgba(10,5,8,0.85)";
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 54px monospace";
            ctx.fillText("demon got me", W / 2, 170);
            ctx.fillStyle = "#f0e0d0";
            ctx.font = "14px monospace";
            ctx.fillText("(" + deathCause + ")", W / 2, 200);
            ctx.font = "bold 26px monospace";
            ctx.fillText("SCORE " + Math.floor(score), W / 2, 260);
            ctx.font = "18px monospace";
            ctx.fillText("BEST  " + bestScore, W / 2, 292);
            // Menu appears once the short restart lock has passed (avoids accidental restarts)
            if (performance.now() - gameOverTime > RESTART_LOCK * 1000) {
                drawMenu(["RUN AGAIN", "LEADERBOARD"], GAMEOVER_MENU_Y, menuIndexGameOver, "#f0e0d0");
            }
        }

        /* =====================================================================
           LEADERBOARD (local only — placeholder names + the player's real best)
           ===================================================================== */

        const DEFAULT_LEADERBOARD = [
            { name: "D3M0N", score: 6660 },
            { name: "MOON", score: 4200 },
            { name: "DGMAX", score: 3333 },
            { name: "HODL3R", score: 2500 },
            { name: "W4GMI", score: 1999 },
            { name: "PEPE404", score: 1337 },
            { name: "RUGPULL", score: 999 },
            { name: "TOUCHGRASS", score: 777 },
            { name: "C0PE", score: 420 },
            { name: "NGMI", score: 69 }
        ];

        // Merges the player's saved best score into the fake board (top 10 kept)
        function getLeaderboardRows() {
            const rows = DEFAULT_LEADERBOARD.map(r => ({ ...r }));
            if (bestScore > 0) rows.push({ name: "YOU", score: bestScore, you: true });
            rows.sort((a, b) => b.score - a.score);
            return rows.slice(0, 10);
        }

        function drawLeaderboard() {
            if (!drawSlot("leaderboard_bg", 0, 0, W, H)) {
                ctx.fillStyle = "#14090e";
                ctx.fillRect(0, 0, W, H);
            }

            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 40px monospace";
            ctx.fillText("LEADERBOARD", W / 2, 81);

            // Score of the run that just ended (the flow lands here right after a death)
            if (score > 0) {
                ctx.fillStyle = "#f0e0d0";
                ctx.font = "bold 19px monospace";
                ctx.fillText("LAST RUN  " + Math.floor(score), W / 2, 115);
            }

            // 10 rows: rank, name, score (the player's row is highlighted).
            // Signed-in players with loaded data see the GLOBAL top 10 (@handles);
            // everyone else keeps the offline lore board — no network dependency.
            let rows;
            if (sbUser && onlineTop10 && onlineTop10.length) {
                const myHandle = sbUser.user_metadata && sbUser.user_metadata.user_name;
                rows = onlineTop10.map(r => ({ name: "@" + r.handle, score: r.best_score, you: r.handle === myHandle }));
            } else {
                rows = getLeaderboardRows();
            }
            ctx.font = "23px monospace";
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                const y = 152 + i * 45;
                ctx.fillStyle = r.you ? "#ffd040" : "#f0e0d0";
                ctx.textAlign = "left";
                ctx.fillText(String(i + 1).padStart(2, " ") + ".", 303, y);
                ctx.fillText(r.name, 378, y);
                ctx.textAlign = "right";
                ctx.fillText(String(r.score).padStart(6, " "), 834, y);
            }

            // Character on the right, picked from the player's rank on the board:
            // rank 1 -> _4, rank 2 -> _3, ranks 3-4 -> _2, ranks 5-10 -> _1,
            // not ranked -> the crying leaderboard_player (or its placeholder).
            const youRank = rows.findIndex(r => r.you) + 1; // 0 = not on the board
            let tierName = "leaderboard_player";
            if (youRank === 1) tierName = "leaderboard_player_4";
            else if (youRank === 2) tierName = "leaderboard_player_3";
            else if (youRank === 3 || youRank === 4) tierName = "leaderboard_player_2";
            else if (youRank >= 5) tierName = "leaderboard_player_1";

            const t = performance.now() / 1000;
            const cx = W * 0.82, cy = 394;
            const chH = 213, chW = chH * slotAspect(tierName);
