        // Used as an even-odd hole so the cabinet can be drawn over the game.
        function screenOpeningPath() {
            const x = SCREEN_X + SCREEN_INSET, y = SCREEN_Y + SCREEN_INSET;
            const w = SCREEN_W - SCREEN_INSET * 2, h = SCREEN_H - SCREEN_INSET * 2;
            const r = Math.min(SCREEN_RADIUS, w / 2, h / 2);
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // A soft shadow along the inside edges of the opening, as if the picture were
        // set back inside the console shell. Drawn in screen space (0..W x 0..H).
        function drawScreenInnerShadow() {
            const d = SCREEN_INNER_SHADOW;
            if (d <= 0) return;
            const edge = (x0, y0, x1, y1, alpha, rx, ry, rw, rh) => {
                const g = ctx.createLinearGradient(x0, y0, x1, y1);
                g.addColorStop(0, `rgba(0,0,0,${alpha})`);
                g.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = g;
                ctx.fillRect(rx, ry, rw, rh);
            };
            edge(0, 0, 0, d, 0.32, 0, 0, W, d);              // top — deepest, light falls from above
            edge(0, 0, d, 0, 0.24, 0, 0, d, H);              // left
            edge(0, H, 0, H - d, 0.17, 0, H - d, W, d);      // bottom
            edge(W, 0, W - d, 0, 0.17, W - d, 0, d, H);      // right
        }

        function draw() {
            // Layer 1 — flat blue behind everything (no background image any more).
            ctx.fillStyle = CANVAS_BG;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Layer 2 — the GAME goes down first, so the console can be laid over it.
            // A black backing sits under it in case a screen ever leaves a gap.
            ctx.fillStyle = "#000";
            ctx.fillRect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H);
            ctx.save();
            ctx.translate(SCREEN_X, SCREEN_Y);
            // From here on the context is in GAME coordinates (0..W x 0..H): the virtual
            // playfield is squeezed into the opening, so drawScreen() never has to know
            // how big the console art happens to be.
            ctx.scale(SCREEN_SCALE, SCREEN_SCALE);
            ctx.beginPath();
            ctx.rect(0, 0, W, H);
            ctx.clip();
            drawScreen();
            drawScreenInnerShadow();
            ctx.restore();

            // Layer 3 — the console ON TOP, with the screen opening punched out of it.
            // The path is the full canvas PLUS the opening, filled even-odd: the opening
            // becomes a hole, so the cabinet's bezel and rounded corners overlap the
            // game rather than the game covering the art.
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, CANVAS_W, CANVAS_H);
            screenOpeningPath();
            ctx.clip("evenodd");
            if (!drawSlot("frame_cabinet", 0, 0, CANVAS_W, CANVAS_H)) {
                ctx.fillStyle = "#191114"; // fallback bezel; the hole keeps the game visible
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            }
            ctx.restore();
        }

        // One game screen, drawn in coordinates 0..W x 0..H (the console's window)
        function drawScreen() {
            if (state === "boot") { drawBoot(); return; }
            if (state === "home") { drawHome(); return; }
            if (state === "intro") { drawIntro(); return; }
            if (state === "leaderboard") { drawLeaderboard(); return; }

            // --- Below: the game world (states "playing", "dying" and "gameover") ---
            ctx.save();

            // Screen shake offset (+ a constant rumble while the jetpack fires)
            let s = shakeTimer > 0 ? shakePower * (shakeTimer / SHAKE_DURATION) : 0;
            if (state === "playing" && player.jetting) s = Math.max(s, 1.6);
            if (s > 0) ctx.translate(rand(-s, s), rand(-s, s));

            // --- Backdrop: sky, sun, clouds, skylines, birds, bridge, train ---
            drawRunBackdrop();
            // Jetpack boost: speed streaks rushing past, behind the street
            drawSpeedLines();
            // --- The street: the sidewalk, then the road the player runs on ---
            drawRunGround();

            // --- Holes cut into the road (drawn over it, image or not) ---
            const holeTop = assets["road"] ? runLayout().roadTop : GROUND_Y - 3;
            ctx.fillStyle = "#1c1c1c";
            for (const g of gaps) ctx.fillRect(g.x, holeTop, g.w, H - holeTop);

            // --- Obstacles: the animated koala / pigeon, drawn as FULL frames.
            // The frames share a canvas, so drawing them untrimmed is what keeps the
            // creature from sliding around between frames. ---
            for (const o of obstacles) {
                const f = obstacleFrameRect(o);
                const slot = obstacleFrameSlot(o);
                if (slot && drawSlot(slot, f.x, f.y, f.w, f.h)) continue;
                ctx.fillStyle = "#2a2a2a"; // placeholder rect on the hitbox itself
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }

            // --- Collectibles: drawn rect = pickup hitbox = the visible artwork ---
            for (const c of collectibles) {
                const box = collectibleBox(c);
                if (drawSlot(collectibleSlotName(c.kind), box.x, box.y, box.w, box.h)) continue;
                if (c.kind === "heart") { drawHeart(c.x, c.y, c.r * 2, "#ff3050"); continue; }
                // Circle fallback, one color per kind so they stay readable
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = c.kind === "jetpack" ? "#30c060" : "#909090";
                ctx.fill();
                ctx.beginPath(); // small inner dot for readability
                ctx.arc(c.x, c.y, c.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = "#f7f7f7";
                ctx.fill();
            }

            // --- Player (the death sequence draws its own character instead) ---
            if (state === "playing") {
                // Blinking right after losing a heart: he can't be hit during it
                if (invincibleTimer > 0 && Math.floor(invincibleTimer * 12) % 2 === 0) ctx.globalAlpha = 0.3;
                drawPlayer();
                ctx.globalAlpha = 1;
            }

            // Debug overlay: green boxes = the REAL collision rects of everything
            // (player, obstacles, collectibles). Obstacles also get their sprite FRAME
            // outlined in faint blue, so the gap between art and hitbox is visible.
            // Toggle with DEBUG_HITBOX; switch HITBOX_MODE to compare the two schemes.
            if (DEBUG_HITBOX && state === "playing") {
                drawHitboxDebug(); // player box
                ctx.lineWidth = 2;
                for (const o of obstacles) {
                    const f = obstacleFrameRect(o);
                    ctx.strokeStyle = "rgba(60,140,255,0.45)";
                    ctx.strokeRect(f.x, f.y, f.w, f.h);
                    const hb = obstacleHitbox(o);
                    ctx.strokeStyle = "#00e050";
                    ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
                }
                ctx.strokeStyle = "#00e050";
                for (const c of collectibles) { const b = collectibleBox(c); ctx.strokeRect(b.x, b.y, b.w, b.h); }
                ctx.fillStyle = "#00e050";
                ctx.font = "bold 13px monospace";
                ctx.textAlign = "right"; // bottom right, in the ground strip: clear of the runner
                ctx.fillText("HITBOX: " + HITBOX_MODE, W - HUD_INSET_X, H - 20);
            }

            // --- Particles ---
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / 0.7);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // --- Floating score popups ---
            for (const p of popups) {
                ctx.globalAlpha = Math.max(0, p.life / 0.8);
                ctx.fillStyle = p.color;
                ctx.font = "bold 18px monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;

            // --- HUD ---
            // No backdrop panels; the HUD simply sits away from the screen edges.
            const hudColor = "#2a2a2a";
            ctx.fillStyle = hudColor;
            ctx.font = "bold 30px monospace";
            ctx.textAlign = "right";
            ctx.fillText(String(Math.floor(score)).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 12);
            ctx.font = "18px monospace";
            ctx.fillText("HI " + String(bestScore).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 40);

            // Jetpack fuel gauge, top left, and the hearts (lives) right under it
            drawFuelGauge(HUD_INSET_X, HUD_INSET_Y + 7, hudColor);
            drawLives(HUD_INSET_X, HUD_INSET_Y + 40);

            // Controls reminder, always visible during the run
            if (state === "playing") drawControlsHint(H - 34, "#f0f0f0"); // light: it sits on the road

            ctx.restore();

            // --- Screen flash (drawn on top, ignores shake) ---
            if (flashTimer > 0) {
                ctx.globalAlpha = Math.min(0.5, flashTimer / FLASH_DURATION * 0.5);
                ctx.fillStyle = flashColor;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }

            // --- Overlays on top of the (frozen) world ---
            if (state === "dying") drawDeathSequence();
            if (state === "gameover") drawGameOverScreen();

            // --- Pause overlay (P) on top of everything in the window ---
            if (paused && state === "playing") drawPauseOverlay();
        }

        // Draws text in a chunky PIXELATED style: rendered small on an offscreen
        // canvas, then blown up with image smoothing disabled.
        const pixelCanvas = document.createElement("canvas");
        const pixelCtx = pixelCanvas.getContext("2d");
        function drawPixelText(text, cx, cy, smallPx, scaleFactor, color) {
            pixelCtx.font = "bold " + smallPx + "px monospace";
            const tw = Math.ceil(pixelCtx.measureText(text).width) + 4;
            const th = smallPx + 6;
            pixelCanvas.width = tw;  // resizing also clears the offscreen canvas
            pixelCanvas.height = th;
            pixelCtx.font = "bold " + smallPx + "px monospace"; // re-set after the resize
            pixelCtx.textAlign = "left";
            pixelCtx.textBaseline = "top";
            pixelCtx.fillStyle = color;
            pixelCtx.fillText(text, 2, 2);
            ctx.save();
            ctx.imageSmoothingEnabled = false; // this is what makes the pixels chunky
            ctx.drawImage(pixelCanvas, cx - (tw * scaleFactor) / 2, cy - (th * scaleFactor) / 2, tw * scaleFactor, th * scaleFactor);
            ctx.restore();
        }

        // Jetpack icon: two red capsule tanks on a dark backplate, a flared nozzle under
        // each — and little flames coming out of them while the jetpack actually fires.
        // Drawn on a 20x20 grid, scaled up, vertically centered on the fuel cells.
        function drawJetpackIcon(x, y, color) {
            ctx.save();
            ctx.translate(x, y - 4);
            ctx.scale(1.25, 1.25);
            ctx.fillStyle = color;
            ctx.fillRect(6, 1, 8, 15);                       // backplate between the tanks
            ctx.fillStyle = "#e0352b";
            for (const tx of [0, 12]) {
                ctx.beginPath();
                ctx.arc(tx + 4, 3, 4, Math.PI, 0);           // rounded top
                ctx.lineTo(tx + 8, 13);
                ctx.arc(tx + 4, 13, 4, 0, Math.PI);          // rounded bottom
                ctx.closePath();
                ctx.fill();
            }
            ctx.fillStyle = "rgba(255,255,255,0.6)";         // shine on each tank
            for (const tx of [0, 12]) ctx.fillRect(tx + 1.5, 2, 1.5, 9);
            ctx.fillStyle = color;                           // flared nozzles
            for (const tx of [0, 12]) {
                ctx.beginPath();
                ctx.moveTo(tx + 2.5, 16);
                ctx.lineTo(tx + 5.5, 16);
                ctx.lineTo(tx + 7, 20);
                ctx.lineTo(tx + 1, 20);
                ctx.fill();
            }
            if (state === "playing" && player.jetting) {
                ctx.fillStyle = "#ff9a20";
                for (const tx of [0, 12]) {
                    ctx.beginPath();
                    ctx.moveTo(tx + 1, 20);
                    ctx.lineTo(tx + 7, 20);
                    ctx.lineTo(tx + 4, 24 + Math.random() * 4);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // Jetpack fuel gauge: the jetpack icon, then 10 cells that fill bottom-up like
        // a tank; the color drops green -> amber -> red, and the cells blink when low.
        function drawFuelGauge(x, y, color) {
            const SEG = 10, segW = 14, segGap = 3, h = 17;
            const f = fuel / FUEL_MAX;
            const blinkOff = f < 0.25 && Math.floor(performance.now() / 180) % 2 === 0;
            const fillColor = f > 0.5 ? "#30c060" : f > 0.25 ? "#f0a020" : "#ff3020";

            drawJetpackIcon(x, y, color);
            const gx = x + 33;
            for (let i = 0; i < SEG; i++) {
                const sx = gx + i * (segW + segGap);
                ctx.fillStyle = "rgba(0,0,0,0.15)";
                ctx.fillRect(sx, y, segW, h);
                const cell = Math.max(0, Math.min(1, f * SEG - i)); // how full THIS cell is
                if (cell > 0 && !blinkOff) {
                    ctx.fillStyle = fillColor;
                    ctx.fillRect(sx, y + h * (1 - cell), segW, h * cell);
                }
            }
        }

        // A heart centered on (cx, cy), size = its width
        function drawHeart(cx, cy, size, color) {
            const s = size / 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx, cy + s * 0.9); // bottom tip
            ctx.bezierCurveTo(cx - s * 1.2, cy + s * 0.1, cx - s * 0.9, cy - s * 0.9, cx, cy - s * 0.35);
            ctx.bezierCurveTo(cx + s * 0.9, cy - s * 0.9, cx + s * 1.2, cy + s * 0.1, cx, cy + s * 0.9);
            ctx.fill();
        }

        // Lives: one small heart per life left, under the fuel gauge
        function drawLives(x, y) {
            for (let i = 0; i < lives; i++) drawHeart(x + 9 + i * 22, y + 8, 18, "#ff3050");
        }

        // Pause: just the word, nothing else
        function drawPauseOverlay() {
            ctx.textAlign = "center";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 52px monospace";
            ctx.fillText("PAUSE", W / 2, H / 2 + 18);
        }

        function drawPlayer() {
            const px = player.x;
            const py = player.y;

            drawJetFlame(); // behind the runner

            // --- Sprite path (visuals only — the collision hitbox NEVER changes) ---
            const img = assets[playerSpriteName()];
            if (img) {
                drawSpriteAnchored(img, playerSpriteName());
                return;
            }

            // --- Placeholder path: a plain dark runner, used while a frame is missing ---
            // Squash is VISUAL ONLY: we scale the drawing around the feet,
            // the collision hitbox stays exactly PLAYER_W x PLAYER_H.
            const drawH = PLAYER_H * squash;
            const drawW = PLAYER_W * (2 - squash); // conserve area: squash down = widen
            const ox = px + (PLAYER_W - drawW) / 2;
            const oy = py + (PLAYER_H - drawH);

            ctx.fillStyle = "#2a2a2a";
            ctx.fillRect(ox, oy, drawW, drawH);
            ctx.fillStyle = "#f7f7f7"; // eye
            ctx.fillRect(ox + drawW - 13, oy + 9, 6, 6);

            // Little legs while running on the ground (simple 2-frame animation)
            if (player.grounded) {
                const legPhase = Math.floor(worldX / 30) % 2;
                ctx.fillStyle = "#2a2a2a";
                if (legPhase === 0) {
                    ctx.fillRect(ox + 5, GROUND_Y - 5, 7, 5);
                    ctx.fillRect(ox + drawW - 12, GROUND_Y - 9, 7, 9);
                } else {
                    ctx.fillRect(ox + 5, GROUND_Y - 9, 7, 9);
                    ctx.fillRect(ox + drawW - 12, GROUND_Y - 5, 7, 5);
                }
            }
        }

        // The player's sprite set. Only one set now that phase 2 is gone.
        function playerSpritePrefix() {
            return "player";
        }

        // Picks the sprite frame matching the current player state
        function playerSpriteName() {
            const pre = playerSpritePrefix();
            if (!player.grounded) {
                // Hold frames only show while the jetpack is ACTUALLY firing
                if (player.jetting) {
                    const f = Math.floor(runTime * ANIM_FPS) % HOLD_FRAME_COUNT + 1;
                    return pre + "_hold_" + f;
                }
                if (player.jumpsUsed >= 2) return pre + "_doublejump"; // after the 2nd jump
                return pre + "_jump";                                  // first jump / simple fall
            }
            const f = Math.floor(runTime * ANIM_FPS) % runFrameCount() + 1;
            return pre + "_run_" + f; // running on the ground
        }

        // Run frames actually delivered. A loop with fewer frames than RUN_FRAME_COUNT
        // (the test art has ONE) simply cycles over what exists; none = placeholder.
        function runFrameCount() {
            let n = 0;
            while (n < RUN_FRAME_COUNT && assets["player_run_" + (n + 1)]) n++;
            return n || RUN_FRAME_COUNT;
        }

        // Draws a player sprite. Every frame shares ONE 915x915 square with the artwork
        // already aligned inside it, so the whole square is drawn UNTRIMMED at the same
        // fixed height (PLAYER_SPRITE_H) and the character never shifts or resizes
        // between the run, jump, doublejump and hold states.
        //
        // One exception: player_hurt holds a character thrown through the air, drawn
        // vertically CENTERED in its square rather than standing on the bottom edge —
        // so it is anchored on the hitbox's CENTER instead of on its feet line.
        function drawSpriteAnchored(img, name) {
            // squash is the takeoff/landing juice — visual only, hitbox untouched
            // A 915x915 square carries padding (the character fills 96.6% of it); a
            // non-square frame is the character alone, trimmed, so it is drawn at the
            // character's own height instead — both come out the same size.
            const baseH = img.width === img.height ? PLAYER_SPRITE_H : PLAYER_CHAR_H;
            const h = baseH * squash;
            const w = baseH * (img.width / img.height) * (2 - squash);
            const anchorX = player.x + PLAYER_W / 2; // horizontal center of the hitbox
            if (name && name.endsWith("_hurt")) {
                const anchorY = player.y + PLAYER_H / 2; // CENTER anchor: he is airborne
                ctx.drawImage(img, anchorX - w / 2, anchorY - h / 2, w, h);
                return;
            }
            const anchorY = player.y + PLAYER_H;      // feet line of the hitbox (= ground contact)
            ctx.drawImage(img, anchorX - w / 2, anchorY - h, w, h);
        }

        // Debug: draws the REAL collision box (with its forgiveness padding) over the sprite
        function drawHitboxDebug() {
            const hb = playerHitbox();
            ctx.strokeStyle = "#00e050";
            ctx.lineWidth = 2;
            ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
        }

        // Jetpack flame: a flickering fire cone blasting down and back from the nozzle
        function drawJetFlame() {
            if (!player.jetting) return;
            const n = jetNozzle();
            const len = (48 + Math.random() * 26) * Math.min(1, jetPower * 2); // grows on ignition
            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(Math.PI * 0.72); // pointing down-left, behind the runner
            const g = ctx.createLinearGradient(0, 0, len, 0);
            g.addColorStop(0, "rgba(255,245,200,0.95)");
            g.addColorStop(0.35, "rgba(255,170,40,0.9)");
            g.addColorStop(1, "rgba(255,60,20,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(0, -11);
            ctx.quadraticCurveTo(len * 0.5, -9, len, 0);
            ctx.quadraticCurveTo(len * 0.5, 9, 0, 11);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.85)"; // white-hot core
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.quadraticCurveTo(len * 0.25, -4, len * 0.45, 0);
            ctx.quadraticCurveTo(len * 0.25, 4, 0, 5);
            ctx.fill();
            ctx.restore();
        }

        // Jetpack boost: horizontal streaks rushing past faster than the world
        function drawSpeedLines() {
            if (state !== "playing" || jetPower < 0.05) return;
            const span = W + 200;
            ctx.strokeStyle = `rgba(42,42,42,${0.28 * jetPower})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 14; i++) {
                const len = (60 + (i * 37) % 90) * jetPower;
                const x = span - ((i * 263 + worldX * 1.6) % span) - 100;
                const y = 40 + (i * 97) % (GROUND_Y - 60);
                ctx.moveTo(x, y);
                ctx.lineTo(x + len, y);
            }
            ctx.stroke();
        }

        // FALLBACK only, while no cloud_run_* PNG is in assets/ (see RUN_CLOUD_LAYERS).
        // Soft fluffy clouds drifting slower than the ground (cheap parallax feel).
        // Overlapping circles + a flat belly = classic cartoon cloud silhouette.
        // RULE: nothing overlaps — the clouds are evenly spaced (one per slot, wider
        // than any cloud) and kept in a sky band ABOVE the highest point a pigeon can
        // reach (~y 186), so they never touch a bird, a collectible or each other.
        const CLOUD_COUNT = 4;
        function drawClouds() {
            ctx.fillStyle = "rgba(200,200,200,0.65)";
            const span = W + 240;
            for (let i = 0; i < CLOUD_COUNT; i++) {
                const cxp = (W + 160) - ((i * span / CLOUD_COUNT + worldX * 0.35) % span);
                const cyp = 60 + (i * 47) % 80;   // 60..121: cloud bottoms stay above y ~135
                const r = 10 + (i % 3) * 4; // size variety between clouds
                ctx.beginPath();
                ctx.arc(cxp, cyp, r, 0, Math.PI * 2);
                ctx.arc(cxp + r * 1.1, cyp - r * 0.75, r * 1.3, 0, Math.PI * 2);
                ctx.arc(cxp + r * 2.5, cyp - r * 0.55, r * 1.15, 0, Math.PI * 2);
                ctx.arc(cxp + r * 3.5, cyp, r * 0.95, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(cxp - r * 0.7, cyp - r * 0.15, r * 4.8, r * 1.1); // flat belly
            }
        }

        /* =====================================================================
           RUN BACKDROP (test art)
           Everything that scrolls is one of two shapes: a single sprite repeated
           along an endless strip (drawStrip: clouds, sun), or a texture tiled
           edge to edge (drawTiled: skylines, bridge, sidewalk, road). The
           parallax is just the offset handed to them.
           ===================================================================== */

        function nativeH(slot) { return assets[slot] ? assets[slot].height : 0; }

        // Vertical layout of the street, all derived from GROUND_Y (the feet):
        //   roadTop      road.png, ROAD_ABOVE_FEET above the feet, down to the bottom
        //   sidewalkTop  sidewalk.png, stacked right on top of the road
        //   railTop      the bridge, its pillars standing on the sidewalk
        //   deckTop      the bridge deck, where the train's wheels go
        function runLayout() {
            const roadTop = GROUND_Y - ROAD_ABOVE_FEET;
            const sidewalkTop = roadTop - SIDEWALK_H;
            const railTop = sidewalkTop + RAIL_SINK - nativeH("rail");
            return { roadTop, sidewalkTop, railTop, deckTop: railTop + RAIL_DECK_Y };
        }

        // Repeats ONE sprite along an endless horizontal strip.
        //   offset how far the strip has travelled, in px (any sign, any size)
        //   h      on-screen height; the width follows the artwork
        //   y      top edge
        //   gap    empty space left between two copies
        // Returns false when the image never loaded (nothing is drawn).
        function drawStrip(slot, offset, h, y, gap) {
            if (!assets[slot]) return false;
            const w = h * slotAspect(slot);
            const period = w + gap;
            // Modulo that stays negative-safe, so the strip never jumps at offset 0
            const start = -(((offset % period) + period) % period) - w;
            for (let x = start; x < W + w; x += period) drawSlot(slot, x, y, w, h);
            return true;
        }

        // Tiles a texture edge to edge (no gap), its width derived from the height it
        // is drawn at, so nothing is stretched. Each tile is snapped to whole pixels
        // and stretched ONE pixel under its neighbour: antialiased fractional edges
        // would otherwise leave a hairline of whatever is behind at every seam.
        function drawTiled(slot, offset, y, h) {
            if (!assets[slot]) return false;
            const w = h * slotAspect(slot);
            const start = -(((offset % w) + w) % w);
            for (let x = start - w; x < W + w; x += w) {
                const x0 = Math.round(x), x1 = Math.round(x + w);
                drawSlot(slot, x0, y, x1 - x0 + 1, h);
            }
            return true;
        }

        // The cloud layers, each moving at its own speed — that difference is what
        // reads as depth. Returns false when not a single cloud image loaded.
        function drawCloudLayers(layers, offsets) {
            let drawn = false;
            for (let i = 0; i < layers.length; i++) {
                const L = layers[i];
                if (drawStrip(L.slot, offsets[i] + (L.phase || 0), L.h, L.y, L.gap)) drawn = true;
            }
            return drawn;
        }

        // The flock, crossing right to left (its position is moved in update())
        function drawBirds() {
            const img = assets["birds"];
            if (!img) return;
            const bob = Math.sin(runTime * 3) * BIRDS_BOB_PX;
            ctx.drawImage(img, birds.x, birds.y + bob, img.width, img.height);
        }

        // The train, riding the bridge deck. Its screen position is how far it has
        // pulled ahead of the camera, at the bridge's parallax, wrapped around a loop
        // of [off-screen left + TRAIN_GAP .. right edge] — so it leaves on the right,
        // and comes back in from the left (or the other way round under a boost).
        function drawTrain(deckTop) {
            const img = assets["train"];
            if (!img) return;
            const lo = -img.width - TRAIN_GAP;
            const period = W - lo;
            const ahead = TRAIN_START_X + (trainOdo - worldX) * RAIL_PAR;
            const x = lo + ((((ahead - lo) % period) + period) % period);
            ctx.drawImage(img, x, deckTop + TRAIN_SINK - TRAIN_WHEELS_Y, img.width, img.height);
        }

        // Everything behind the street, back to front
        function drawRunBackdrop() {
            const L = runLayout();

            // Sky: the gradient, oversized so a screen shake never uncovers an edge
            if (!drawSlot("bg", -20, -20, W + 40, H + 40)) {
                ctx.fillStyle = "#f7f7f7";
                ctx.fillRect(-20, -20, W + 40, H + 40);
            }

            // The sun, in the mirador's old part: SUN_PAR is negative, so this offset
            // counts DOWN and it drifts right — with the player — barely moving
            drawStrip("sun", sunX * SUN_PAR + SUN_PHASE, nativeH("sun"), SUN_Y, SUN_GAP);

            // Clouds, three layers, each on its own fraction of the world speed
            if (!drawCloudLayers(RUN_CLOUD_LAYERS, RUN_CLOUD_LAYERS.map(c => worldX * c.par))) drawClouds();

            // The two skylines, feet on the sidewalk's top edge, behind the bridge
            const farH = nativeH("skyline_far"), nearH = nativeH("skyline_near");
            drawTiled("skyline_far", worldX * SKYLINE_FAR_PAR, L.sidewalkTop - farH, farH);
            drawTiled("skyline_near", worldX * SKYLINE_NEAR_PAR, L.sidewalkTop - nearH, nearH);

            drawBirds();
            drawTiled("rail", worldX * RAIL_PAR, L.railTop, nativeH("rail"));
            drawTrain(L.deckTop);
        }

        // The street: the sidewalk (scenery, above the ground line), then the road
        // the player actually runs on — it starts a little above his feet, which is
        // what puts him ON the road rather than in front of it.
        function drawRunGround() {
            const L = runLayout();
            drawTiled("sidewalk", worldX, L.sidewalkTop, SIDEWALK_H);
            if (drawTiled("road", worldX, L.roadTop, H - L.roadTop)) return;
            // Placeholder: the old dino-style line plus scrolling speed marks
            ctx.fillStyle = "#2a2a2a";
            ctx.fillRect(-20, GROUND_Y, W + 40, 3);
            ctx.fillStyle = "#b5b5b5";
            for (let i = 0; i < 22; i++) {
                const mx = ((i * 104) - (worldX % 104));
                ctx.fillRect(mx, GROUND_Y + 5 + (i % 3) * 4, 17, 2); // kept above the JUMP = SPACE hint
            }
        }

        /* =====================================================================
           HOME SCREEN DECOR
           clouds_1/2, bg_prison all share ONE 1060x618 canvas, so they
           stack pixel-on-pixel. Draw order: clouds (opaque sky, scrolling) then the
           prison (its sky is transparent, which is what lets the clouds show), then
           the characters and the logo.
           ===================================================================== */

        const HOME_DECOR_W = 1060, HOME_DECOR_H = 618;

        // The rect the decor covers on screen: matched on WIDTH and anchored on the
        // BOTTOM, so the few overflowing pixels are cut off the transparent sky at the
        // top rather than off the road at the bottom.
        function homeDecorRect() {
            const w = W;
            const h = w * HOME_DECOR_H / HOME_DECOR_W;
            return { x: 0, y: H - h, w, h };
        }

        // Where the home characters' feet rest
        function homeGroundY() {
            const d = homeDecorRect();
            return d.y + d.h * HOME_GROUND_FRAC;
        }

        // Vertical metrics of each home sprite, as fractions of its own frame:
        //   fill   = how much of the frame height the artwork actually covers
        //   bottom = transparent padding below the artwork
        // These let us size every sprite by its CHARACTER height and land its feet on
        // the ground line, even though the frames have wildly different proportions
        // (the idle frames are 592x1113, the run frames are 915x915 squares).
        const HOME_ART = {
            "idle": { fill: 1.000, bottom: 0.000 },
            "scared": { fill: 1.000, bottom: 0.000 },
            "koala_standing": { fill: 0.971, bottom: 0.029 },
            "car": { fill: 0.547, bottom: 0.227 },
            "player_run": { fill: 0.966, bottom: 0.000 }, // = the home run loop
            "koala_running": { fill: 0.979, bottom: 0.021 }  // = the walking koala
        };

        // The home screen reuses in-game artwork rather than carrying its own copies:
        // the old home_run_* and home_koala_run_* files were byte-identical duplicates
        // and are gone, so these two bases point straight at the originals.
        const HOME_RUN_BASE = "player_run";
        const HOME_KOALA_BASE = "koala_running";
        const HOME_KOALA_FRAMES = 2;

        // The police light bar blinks off a wall clock, so it keeps flashing without
        // interruption across the home screen AND the whole intro sequence.
        function homeCarSlot() {
            return "car_" + (Math.floor(performance.now() / 1000 * HOME_CAR_BLINK_FPS) % 2 + 1);
        }

        // Looks up the metrics for a slot name, stripping any trailing frame number
        function homeArt(name) {
            return HOME_ART[name.replace(/_\d+$/, "")] || { fill: 1, bottom: 0 };
        }

        // Draws a home sprite so that its CHARACTER stands charH tall with its feet on
        // groundY, whatever padding its own frame carries. flip mirrors it horizontally
        // (used for the koala closing in on the player at the end of a run).
        function drawHomeSprite(name, cx, groundY, charH, flip) {
            const img = assets[name];
            const a = homeArt(name);
            if (!img) {
                // Placeholder block, same footprint as the real character would have
                const w = charH * 0.55;
                ctx.fillStyle = "#c03030";
                ctx.fillRect(cx - w / 2, groundY - charH, w, charH);
                return false;
            }
            const frameH = charH / a.fill;                 // the full frame, padding included
            const frameW = frameH * (img.width / img.height);
            const top = groundY - frameH * (1 - a.bottom); // put the ARTWORK's base on groundY
            if (flip) {
                ctx.save();
                ctx.translate(cx, 0);
                ctx.scale(-1, 1);                            // mirror around the sprite's own center
                ctx.drawImage(img, -frameW / 2, top, frameW, frameH);
                ctx.restore();
            } else {
                ctx.drawImage(img, cx - frameW / 2, top, frameW, frameH);
            }
            return true;
        }

        // Picks the current frame of a numbered home loop (idle_1..4, etc.)
        function homeLoopFrame(base, count, fps, t) {
            return base + "_" + (Math.floor(t * fps) % count + 1);
        }

        // The endless cloud strip: the two tiles are opaque sky and seam perfectly in
        // either order, so they alternate 1,2,1,2... and scroll as one strip.
        function drawHomeClouds() {
            const d = homeDecorRect();
            const period = d.w * 2;
            const off = -(((cloudScroll % period) + period) % period);
            let i = 0;
            for (let x = off; x < W; x += d.w, i++) {
                const slot = (i % 2 === 0) ? "clouds_1" : "clouds_2";
                if (!drawSlot(slot, x, d.y, d.w, d.h)) {
                    ctx.fillStyle = "#bfe2f5"; // placeholder sky
                    ctx.fillRect(x, d.y, d.w, d.h);
                }
            }
        }

        // Clouds + prison, the static part of the home screen
        function drawHomeBackdrop() {
            drawHomeClouds();
            const d = homeDecorRect();
            if (!drawSlot("bg_prison", d.x, d.y, d.w, d.h)) {
                ctx.fillStyle = "#9a9a94"; // placeholder wall
                ctx.fillRect(d.x, d.y + d.h * 0.25, d.w, d.h * 0.75);
            }
        }

        // The FULL SEND logo: slides down from above on arrival, then bobs gently in
        // place for as long as we sit on the title screen.
        function drawHomeLogo() {
            const slide = Math.min(1, homeTime / TITLE_SLIDE_DURATION);
            const ease = 1 - (1 - slide) * (1 - slide);
            // The bob fades in with the slide, so it never yanks the logo on arrival
            const t = performance.now() / 1000;
            const bob = Math.sin(t * HOME_LOGO_BOUNCE_SPEED) * HOME_LOGO_BOUNCE_PX * slide;
            const cy = -HOME_LOGO_H + ease * (HOME_LOGO_Y + HOME_LOGO_H) + bob;
            const h = HOME_LOGO_H, w = h * slotAspect("logo");
            if (!drawSlot("logo", W / 2 - w / 2, cy - h / 2, w, h)) {
                ctx.textAlign = "center";
                ctx.fillStyle = "#2a2a2a";
                ctx.font = "bold 52px monospace";
                ctx.fillText("FULL SEND", W / 2, cy + 16);
            }
        }

        // LOADING progress, 0..1: the real image loading, but never faster than
        // LOADING_MIN_T so the screen doesn't just blink past
        function loadingProgress() {
            return Math.min(1, bootTime / LOADING_MIN_T, assetsSettled / ASSET_SLOTS.length);
        }

        // LOADING screen: web-blue gradient, faint grid, LOADING... / PLEASE WAIT...
        // and a segmented progress bar following the real asset loading
        function drawBoot() {
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, "#00008c");
            bg.addColorStop(1, "#0000EE");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "rgba(255,255,255,0.07)"; // graph-paper grid
            for (let x = 0; x < W; x += 36) ctx.fillRect(x, 0, 1, H);
            for (let y = 0; y < H; y += 36) ctx.fillRect(0, y, W, 1);

            const p = loadingProgress();
            // Optical centering: the WORDS sit on the center line and the dots hang off
            // to the right (centering "LOADING..." as a whole pushes the word visibly left)
            ctx.textAlign = "left";
            ctx.font = "bold 46px monospace";
            ctx.fillStyle = "#ffffff";
            const dots = ".".repeat(Math.floor(performance.now() / 350) % 4);
            ctx.fillText("LOADING" + dots, W / 2 - ctx.measureText("LOADING").width / 2, H / 2 - 26);
            ctx.font = "bold 22px monospace";
            ctx.fillStyle = "#7fe3ff";
            ctx.fillText("PLEASE WAIT...", W / 2 - ctx.measureText("PLEASE WAIT").width / 2, H / 2 + 14);

            // Segmented progress bar
            const SEG = 24, segW = 14, gap = 4, bh = 18;
            const bw = SEG * segW + (SEG - 1) * gap;
            const bx = W / 2 - bw / 2, by = H / 2 + 50;
            ctx.strokeStyle = "#7fe3ff";
            ctx.lineWidth = 2;
            ctx.strokeRect(bx - 6, by - 6, bw + 12, bh + 12);
            const lit = Math.floor(p * SEG);
            for (let i = 0; i < SEG; i++) {
                ctx.fillStyle = i < lit ? "#39ff9e" : "rgba(127,227,255,0.15)";
                ctx.fillRect(bx + i * (segW + gap), by, segW, bh);
            }
            ctx.font = "bold 14px monospace";
            ctx.textAlign = "center";
            ctx.fillStyle = "#7fe3ff";
            ctx.fillText(Math.floor(p * 100) + "%", W / 2, by + bh + 34);
        }

        // Title screen. BEST + START / LEADERBOARD only show up once everything else
        // is in place (see homeReady), and fade in over HOME_MENU_FADE_T.
        function drawHome() {
            drawHomeBackdrop();
            drawHomeLogo();

            // The police car is already parked when the title screen comes up, and its
            // light bar blinks continuously — it keeps blinking right through the intro
            // sequence and up to the moment the run actually starts.
            drawHomeSprite(homeCarSlot(), W * HOME_CAR_FRAC, homeGroundY(), HOME_CAR_H, false);

            // The red character, idle: he holds his wads of cash and glances around.
            // idle_1..4 is a slow 4-frame loop.
            drawHomeSprite(
                homeLoopFrame("idle", 4, HOME_IDLE_FPS, homeTime),
                W * HOME_CHAR_FRAC, homeGroundY(), HOME_CHAR_H, false
            );

            if (homeReady()) {
                ctx.globalAlpha = Math.min(1, homeMenuTime / HOME_MENU_FADE_T);
                ctx.fillStyle = "#404040";
                ctx.font = "15px monospace";
                ctx.textAlign = "center";
                ctx.fillText("BEST " + String(bestScore).padStart(5, "0"), W / 2, HOME_MENU_Y[0] - 36);
                drawMenu(["START GAME", "LEADERBOARD"], HOME_MENU_Y, menuIndexHome, "#2a2a2a");
                ctx.globalAlpha = 1;
            }

            drawControlsHint(H - 34, "#909090");
        }

        // Shared menu renderer: highlights the selected row
        function drawMenu(items, rowsY, selected, color) {
            ctx.textAlign = "center";
            for (let i = 0; i < items.length; i++) {
                const isSel = i === selected;
                ctx.font = isSel ? "bold 30px monospace" : "24px monospace";
                ctx.fillStyle = isSel ? "#ff3020" : color;
                ctx.fillText(items[i], W / 2, rowsY[i]); // the label itself stays perfectly centered
                if (isSel) {
                    // selection arrow drawn separately so it doesn't shift the label
                    const tw = ctx.measureText(items[i]).width;
                    ctx.fillText(">", W / 2 - tw / 2 - 26, rowsY[i]);
                }
            }
        }

        // Draws one keyboard key cap: gray body, darker label for contrast
        function drawKeyCap(x, y, w, h, label) {
            ctx.fillStyle = "#909090";                 // key body
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "#5a5a5a";                 // pressed edge at the bottom
            ctx.fillRect(x, y + h - 3, w, 3);
            ctx.fillStyle = "#2e2e2e";                 // label, darker gray/black
            ctx.font = "bold 12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(label, x + w / 2, y + h / 2 + 4);
        }

        // Controls reminder at the very bottom (home + in game): "JUMP =" + SPACE key cap
        function drawControlsHint(cy, captionColor) {
            ctx.globalAlpha = 0.85;
            ctx.font = "bold 12px monospace";
            const label = "JUMP =", keyW = 80, gap = 8;
            const tw = ctx.measureText(label).width;
            const x = W / 2 - (tw + gap + keyW) / 2; // the pair is centered as one block
            ctx.fillStyle = captionColor;
            ctx.textAlign = "left";
            ctx.fillText(label, x, cy + 14);
            drawKeyCap(x + tw + gap, cy, keyW, 20, "SPACE");
            ctx.globalAlpha = 1;
        }

        // INTRO cinematic: the character walks in with his gear, bumps the cactus,
        // loses everything (that's why the in-game runner is bare), sprints off, and
        // a black wipe brings the actual run in. Press = skip.
        // The scripted home sequence. Same page as HOME (clouds, prison, logo), only
        // the menu is gone:
        //   1. the koala cop rolls in from the right, the runner still idles
        //   2. the koala plants himself and stands there
        //   3. the runner panics (scared)
        //   4. he bolts off to the right, a black wipe closes, the run begins
        function drawIntro() {
            const tl = introTimeline();
            const t = introTime;
            const groundY = homeGroundY();

            drawHomeBackdrop();
            drawHomeLogo();

            // The parked police car, still blinking on the same wall clock as on the title
            // screen, so the light bar never stutters when the sequence takes over.
            drawHomeSprite(homeCarSlot(), W * HOME_CAR_FRAC, groundY, HOME_CAR_H, false);

            // --- The koala cop: he walks RIGHT to LEFT and stops roughly facing the
            // runner, well clear of the car. The artwork already faces left, which is his
            // direction of travel, so it is drawn as-is — no mirroring here. ---
            const koalaFrom = W * HOME_KOALA_START_FRAC;
            const koalaTo = W * HOME_KOALA_STOP_FRAC;
            let koalaX, koalaSlot;
            if (t < tl.koalaIn) {
                const p = t / tl.koalaIn;
                const ease = 1 - (1 - p) * (1 - p);            // decelerating arrival
                koalaX = koalaFrom + (koalaTo - koalaFrom) * ease;
                koalaSlot = homeLoopFrame(HOME_KOALA_BASE, HOME_KOALA_FRAMES, HOME_KOALA_FPS, t);
            } else {
                // Planted in front of him, holding up his warrant
                koalaX = koalaTo;
                koalaSlot = "koala_standing";
            }
            drawHomeSprite(koalaSlot, koalaX, groundY, HOME_KOALA_H, false);

            // --- The red character ---
            const charX0 = W * HOME_CHAR_FRAC;
            if (t < tl.koalaStop) {
                // Still idling, unaware
                drawHomeSprite(homeLoopFrame("idle", 4, HOME_IDLE_FPS, homeTime + t),
                    charX0, groundY, HOME_CHAR_H, false);
            } else if (t < tl.scared) {
                // Frozen in panic
                drawHomeSprite("scared", charX0, groundY, HOME_CHAR_H, false);
            } else {
                // Sprinting off to the right, at the SAME size he will have in game
                const rt = t - tl.scared;
                const x = charX0 + HOME_RUNOUT_SPEED * rt;
                drawHomeSprite(homeLoopFrame(HOME_RUN_BASE, runFrameCount(), HOME_RUN_FPS, rt),
                    x, groundY, HOME_CHAR_H, false);
            }

            ctx.fillStyle = "#404040";
            ctx.font = "14px monospace";
            ctx.textAlign = "center";
            ctx.fillText("press to skip", W / 2, H - 16);

            // Black wipe sliding in from the right just before the game starts
            if (t >= tl.wipe) {
                const p = Math.min(1, (t - tl.wipe) / HOME_WIPE_T);
                ctx.fillStyle = "#000";
                ctx.fillRect(W - p * W, 0, p * W, H);
            }
        }

        // Death sequence, in two beats:
        //
        //   beat 1  (0 -> DEATH_CATCH_FRAC)
        //     The runner is already in his player_hurt pose — die() switches him the
        //     instant the collision lands — and he stays frozen in it. A koala sprints
        //     in from the LEFT to catch him. The koala artwork faces left by default,
        //     but here he is running right, so THIS is where the mirror belongs.
        //
        //   beat 2  (DEATH_CATCH_FRAC -> 1)
        //     The koala reaches him: both vanish on the spot, and gameover_player_1..7
        //     plays through once while GAME OVER drops down the screen.
        //
        // The gameover frames share a 1888x1436 canvas, so they are drawn as FULL frames
        // at one fixed size: no trimming, no jitter between them.
        function drawDeathSequence() {
            const p = 1 - deathTimer / DEATH_SEQUENCE_DURATION; // 0 -> 1
            const elapsed = DEATH_SEQUENCE_DURATION * p;

            // Light veil only
            ctx.fillStyle = `rgba(10,5,8,${0.35 * p})`;
            ctx.fillRect(0, 0, W, H);

            // A fall into the void leaves player.y far below the screen, so the feet line
            // is clamped to the ground: the sequence must stay visible whatever killed us.
            const cx = player.x + PLAYER_W / 2;
            const feetY = Math.min(player.y + PLAYER_H, GROUND_Y);

            if (p < DEATH_CATCH_FRAC) {
                // ---- Beat 1: the runner lies there, the koala closes in from the left ----
                const kp = p / DEATH_CATCH_FRAC;
                const kEase = kp * (0.75 + 0.25 * kp);       // steady charge, closing a little faster
                const koalaX = W * DEATH_KOALA_FROM + (cx - W * DEATH_KOALA_FROM) * kEase;
                const koalaSlot = homeLoopFrame(HOME_KOALA_BASE, HOME_KOALA_FRAMES, HOME_KOALA_FPS, elapsed);
                // Running RIGHT, against the artwork's own facing => mirrored
                drawHomeSprite(koalaSlot, koalaX, GROUND_Y, DEATH_KOALA_H, true);

                // The runner, thrown and motionless. player_hurt is centered in its
                // square, so it hangs off the hitbox CENTER rather than off the feet.
                const hurt = assets[playerSpritePrefix() + "_hurt"];
                if (hurt) {
                    const h = PLAYER_SPRITE_H, w = h * (hurt.width / hurt.height);
                    ctx.drawImage(hurt, cx - w / 2, feetY - PLAYER_H / 2 - h / 2, w, h);
                } else {
                    ctx.fillStyle = "#c03030";
                    ctx.fillRect(cx - PLAYER_W / 2, feetY - PLAYER_H, PLAYER_W, PLAYER_H);
                }
                return; // GAME OVER only starts dropping once he has been caught
            }

            // ---- Beat 2: both are gone, the game-over animation takes over ----
            const tail = (p - DEATH_CATCH_FRAC) / (1 - DEATH_CATCH_FRAC); // 0 -> 1
            const tailElapsed = elapsed - DEATH_SEQUENCE_DURATION * DEATH_CATCH_FRAC;

            // Frames 1..7 play through once, then the last one holds
            const f = Math.min(GAMEOVER_FRAME_COUNT,
                Math.floor(tailElapsed / GAMEOVER_BEAT_FRAME_T) + 1);
            const dieImg = assets["gameover_player_" + f];
            if (dieImg) {
                // Same fixed height for every frame, anchored on the player's feet line
                const h = PLAYER_SPRITE_H * 1.25, w = h * (dieImg.width / dieImg.height);
                ctx.drawImage(dieImg, cx - w / 2, feetY - h, w, h);
            } else {
                const size = PLAYER_W * (1 + Math.sin(tail * Math.PI * 6) * 0.15);
                ctx.save();
                ctx.translate(cx, feetY - PLAYER_H / 2);
                ctx.rotate(tail * Math.PI * 2);
                ctx.fillStyle = "#2a2a2a";
                ctx.fillRect(-size / 2, -size / 2, size, size);
                ctx.restore();
            }

            // GAME OVER slides from above down to the center over this second beat
            const ease = 1 - (1 - tail) * (1 - tail); // settles gently at the end
            const goY = -80 + ease * (H / 2 + 80);
            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 92px monospace";
            ctx.fillText("GAME OVER", W / 2, goY);
            ctx.fillStyle = "#f0e0d0";
            ctx.font = "17px monospace";
            ctx.fillText("(" + deathCause + ")", W / 2, goY + 44);
        }

        // NOTE: currently unused — the flow now goes dying -> leaderboard directly.
        // Kept around in case we bring a game-over menu back later.
        function drawGameOverScreen() {
            ctx.fillStyle = "rgba(10,5,8,0.85)";
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 54px monospace";
            ctx.fillText("demon got me", W / 2, 170);
            ctx.fillStyle = "#f0e0d0";
            ctx.font = "14px monospace";
            ctx.fillText("(" + deathCause + ")", W / 2, 200);
            ctx.font = "bold 26px monospace";
            ctx.fillText("SCORE " + Math.floor(score), W / 2, 260);
            ctx.font = "18px monospace";
            ctx.fillText("BEST  " + bestScore, W / 2, 292);
            // Menu appears once the short restart lock has passed (avoids accidental restarts)
            if (performance.now() - gameOverTime > RESTART_LOCK * 1000) {
                drawMenu(["RUN AGAIN", "LEADERBOARD"], GAMEOVER_MENU_Y, menuIndexGameOver, "#f0e0d0");
            }
        }

        /* =====================================================================
           LEADERBOARD (local only — placeholder names + the player's real best)
           ===================================================================== */

        const DEFAULT_LEADERBOARD = [
            { name: "D3M0N", score: 6660 },
            { name: "MOON", score: 4200 },
            { name: "DGMAX", score: 3333 },
            { name: "HODL3R", score: 2500 },
            { name: "W4GMI", score: 1999 },
            { name: "PEPE404", score: 1337 },
            { name: "RUGPULL", score: 999 },
            { name: "TOUCHGRASS", score: 777 },
            { name: "C0PE", score: 420 },
            { name: "NGMI", score: 69 }
        ];

        // Merges the player's saved best score into the fake board (top 10 kept)
        function getLeaderboardRows() {
            const rows = DEFAULT_LEADERBOARD.map(r => ({ ...r }));
            if (bestScore > 0) rows.push({ name: "YOU", score: bestScore, you: true });
            rows.sort((a, b) => b.score - a.score);
            return rows.slice(0, 10);
        }

        function drawLeaderboard() {
            if (!drawSlot("leaderboard_bg", 0, 0, W, H)) {
                ctx.fillStyle = "#14090e";
                ctx.fillRect(0, 0, W, H);
            }

            ctx.textAlign = "center";
            ctx.fillStyle = "#ff3020";
            ctx.font = "bold 40px monospace";
            ctx.fillText("LEADERBOARD", W / 2, 73);

            // Score of the run that just ended (the flow lands here right after a death)
            if (score > 0) {
                ctx.fillStyle = "#f0e0d0";
                ctx.font = "bold 19px monospace";
                ctx.fillText("LAST RUN  " + Math.floor(score), W / 2, 104);
            }

            // 10 rows: rank, name, score (the player's row is highlighted).
            // Signed-in players with loaded data see the GLOBAL top 10 (@handles);
            // everyone else keeps the offline lore board — no network dependency.
            let rows;
            if (sbUser && onlineTop10 && onlineTop10.length) {
                const myHandle = sbUser.user_metadata && sbUser.user_metadata.user_name;
                rows = onlineTop10.map(r => ({ name: "@" + r.handle, score: r.best_score, you: r.handle === myHandle }));
            } else {
                rows = getLeaderboardRows();
            }
            ctx.font = "23px monospace";
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                const y = 137 + i * 41;
                ctx.fillStyle = r.you ? "#ffd040" : "#f0e0d0";
                ctx.textAlign = "left";
                ctx.fillText(String(i + 1).padStart(2, " ") + ".", 264, y);
                ctx.fillText(r.name, 330, y);
                ctx.textAlign = "right";
                ctx.fillText(String(r.score).padStart(6, " "), 727, y);
            }

            // Character on the right, picked from the player's rank on the board:
            // rank 1 -> _4, rank 2 -> _3, ranks 3-4 -> _2, ranks 5-10 -> _1,
            // not ranked -> the crying leaderboard_player (or its placeholder).
            const youRank = rows.findIndex(r => r.you) + 1; // 0 = not on the board
            let tierName = "leaderboard_player";
            if (youRank === 1) tierName = "leaderboard_player_4";
            else if (youRank === 2) tierName = "leaderboard_player_3";
            else if (youRank === 3 || youRank === 4) tierName = "leaderboard_player_2";
            else if (youRank >= 5) tierName = "leaderboard_player_1";

            const t = performance.now() / 1000;
            const cx = W * 0.82, cy = 355;
            const chH = 213, chW = chH * slotAspect(tierName);
            // Animations by tier: _1 and _3 bob up and down (like the home idle);
            // _2 and _4 "dance" by mirroring left<->right at least every second.
            const bobbing = tierName === "leaderboard_player_1" || tierName === "leaderboard_player_3";
            const dancing = tierName === "leaderboard_player_2" || tierName === "leaderboard_player_4";
            const bobOff = bobbing ? Math.sin(t * 3) * 7 : 0;
            const flipped = dancing && Math.floor(t / 1.0) % 2 === 1;
            ctx.save();
            if (flipped) { // mirror the drawing around the character's center
                ctx.translate(cx, 0);
                ctx.scale(-1, 1);
                ctx.translate(-cx, 0);
            }
            const drawn = drawSlot(tierName, cx - chW / 2, cy - chH / 2 + bobOff, chW, chH);
            ctx.restore();
            if (!drawn) {
                ctx.fillStyle = "#d81f1f";
                ctx.fillRect(cx - 30, cy - 40, 60, 80);
                ctx.fillStyle = "#ffe040"; // eye
                ctx.fillRect(cx + 6, cy - 24, 9, 9);
                ctx.fillStyle = "#40a0ff"; // falling tears
                const tearY = (t * 60) % 50;
                ctx.fillRect(cx + 8, cy - 12 + tearY, 4, 7);
                ctx.fillRect(cx + 8, cy - 12 + ((tearY + 25) % 50), 3, 5);
            }

            // Personal position line — and BEFORE login, the hook line that gives the
            // JOIN button its meaning.
            {
                let msg = null;
                if (sbUser) msg = onlineStatus === "loading" ? "syncing..." : rankMessage();
                else if (db) msg = "Think you belong in the real Top 10? Log in!";
                if (msg) {
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#ffd040";
                    ctx.font = "bold 21px monospace";
                    ctx.fillText(msg, W / 2, 542);
                }
            }

            // Buttons: JOIN GLOBAL LEADERBOARD (CTA, hidden once signed in),
            // SHARE (discreet) and FOLLOW US ON X
            for (const b of leaderboardButtons()) {
                const isCta = b.id === "join";
                ctx.fillStyle = isCta ? "#ff3020" : "rgba(255,255,255,0.08)";
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = isCta ? "#ff3020" : "#909090";
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = isCta ? "#ffffff" : "#cfcfcf";
                ctx.font = "bold 14px monospace";
                ctx.textAlign = "center";
                ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
            }

            ctx.textAlign = "center";
            ctx.fillStyle = "#909090";
            ctx.font = "14px monospace";
            ctx.fillText("press to new game", W / 2, H - 12);
        }

        /* =====================================================================
           ONLINE LEADERBOARD (Supabase + X login)
           Entirely optional: if the library failed to load or the network is down,
           db stays null, every hook below is skipped, and the game runs exactly
           as before (local best score + lore leaderboard).
           ===================================================================== */

        const SUPABASE_URL = "https://ljofhdhkjxsqekhzyehz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqb2ZoZGhranhzcWVraHp5ZWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTE5MjEsImV4cCI6MjEwNDE4NzkyMX0.yuOmRLLSdgsoyO_F9k1lPc8pzFN-UQnG3g663X5NV80";
        const SITE_URL = "https://demongotme.com";           // the project website (Check out our website)
        const GAME_URL = "https://gillesmc.github.io/dgm-runner/"; // link to PLAY the game (used in SHARE posts)
        const X_FOLLOW_URL = "https://x.com/lovefordemons";  // FOLLOW US ON X target

        let db = null; // Supabase client, or null when running offline
        try {
            if (window.supabase) db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) { db = null; }

        let sbUser = null;         // signed-in Supabase user (null = not connected)
        let onlineTop10 = null;    // [{handle, best_score}] once loaded
        let onlineRank = null;     // my rank among ranked players
        let onlineCount = null;    // how many ranked players exist (display rules)
        let onlineStatus = "idle"; // "idle" | "loading" | "ready" | "error"

        /* ---- The 5 functions below are copied VERBATIM from test-login.html ---- */

        // Creates the player row on first login, updates the handle on later ones
        async function savePlayer(user) {
            const { data, error } = await db
                .from("players")
                .upsert(
                    {
                        user_id: user.id,
                        x_id: user.user_metadata.provider_id,
                        handle: user.user_metadata.user_name
                    },
                    { onConflict: "x_id" }
                )
                .select();

            console.log("savePlayer:", error || data);
        }

        // Sends a score, but only overwrites the stored best if it's higher
        async function submitScore(user, score) {
            const { data, error } = await db
                .from("players")
                .update({ best_score: score })
                .eq("user_id", user.id)
                .lt("best_score", score)
                .select();

            console.log("submitScore:", error || data);
        }

        // Top 10 players by best score
        async function loadTop10() {
            const { data, error } = await db
                .from("players")
                .select("handle, best_score")
                .order("best_score", { ascending: false })
                .limit(10);

            console.log("top10:", error || data);
            return data;
        }

        // Personal rank: how many players scored higher, plus one
        async function loadMyRank(score) {
            const { count, error } = await db
                .from("players")
                .select("*", { count: "exact", head: true })
                .gt("best_score", score);

            console.log("rank:", error || count + 1);
            return count + 1;
        }

        /* ---- End of the verbatim block ---- */

        // How many players have a score on the board at all (for the display rules)
        async function loadRankedCount() {
            const { count } = await db
                .from("players")
                .select("*", { count: "exact", head: true })
                .gt("best_score", 0);
            return count || 0;
        }

        // Refreshes top 10 + my rank + ranked-player count (never throws)
        async function refreshOnline() {
            if (!db || !sbUser) return;
            onlineStatus = "loading";
            try {
                onlineTop10 = await loadTop10();
                onlineRank = await loadMyRank(bestScore);
                onlineCount = await loadRankedCount();
                onlineStatus = "ready";
            } catch (e) {
                onlineStatus = "error"; // the lore board keeps being shown instead
            }
        }

        // Personal position line. Rules: never show a denominator, and never show a
        // percentile above 50% (a plain rank is shown instead).
        function rankMessage() {
            if (onlineRank == null || onlineCount == null) return null;
            if (onlineCount < 10) return "Think you belong in the real Top 10?";
            if (onlineCount < 50) return "RANK #" + onlineRank;
            const pct = Math.ceil((onlineRank / onlineCount) * 100);
            if (pct <= 50) return "TOP " + pct + "% OF RANKED PLAYERS";
            return "RANK #" + onlineRank;
        }

        // Buttons shown on the leaderboard screen (geometry shared by draw & click).
        // Each box is as wide as its label + the same padding, every gap is equal and
        // the whole row is centered — with or without the JOIN button.
        function leaderboardButtons() {
            const y = H - 85, h = 34, gap = 16, padX = 22;
            const btns = [
                { id: "follow", label: "FOLLOW US ON X" },
                { id: "website", label: "CHECK OUT OUR WEBSITE" }
            ];
            if (!sbUser && db) btns.push({ id: "join", label: "JOIN GLOBAL LEADERBOARD" });
            btns.push({ id: "share", label: "SHARE" });
            ctx.font = "bold 14px monospace"; // the font the labels are drawn with
            for (const b of btns) b.w = Math.ceil(ctx.measureText(b.label).width) + padX * 2;
            let x = W / 2 - (btns.reduce((sum, b) => sum + b.w, 0) + gap * (btns.length - 1)) / 2;
            for (const b of btns) { b.x = x; b.y = y; b.h = h; x += b.w + gap; }
            return btns;
        }

        function leaderboardButtonAction(id) {
            if (id === "join" && db) {
                // Exact same call as the validated test page — redirectTo must stay
                // origin + pathname or a leftover "#" breaks the session.
                db.auth.signInWithOAuth({
                    provider: "x",
                    options: { redirectTo: window.location.origin + window.location.pathname }
                });
            } else if (id === "share") {
                // Plain text + GAME link web intent — no assets, no generated images
                const msg = sbUser
                    ? "Demon Got Me... here is my best score on FULL SEND : " + bestScore + ". Can you do better? " + GAME_URL
                    : "Demon Got Me... can you do better than me? " + GAME_URL;
                window.open("https://x.com/intent/post?text=" + encodeURIComponent(msg), "_blank");
            } else if (id === "follow") {
                window.open(X_FOLLOW_URL, "_blank");
            } else if (id === "website") {
                window.open(SITE_URL, "_blank");
            }
        }

        // Runs once per signed-in user: ensure the player row exists, push the local
        // best (the DB keeps the higher of the two), then load the global board.
        function handleSignedIn(user) {
            if (!user || (sbUser && sbUser.id === user.id)) return;
            sbUser = user;
            savePlayer(user)
                .then(() => (bestScore > 0 ? submitScore(user, bestScore) : null))
                .then(refreshOnline)
                .catch(() => { });
        }

        // Restore an existing session on load, and catch the OAuth redirect return
        if (db) {
            db.auth.getSession().then(({ data }) => {
                if (data.session) handleSignedIn(data.session.user);
            }).catch(() => { });
            db.auth.onAuthStateChange((_event, session) => {
                if (session) handleSignedIn(session.user);
            });
        }

        /* =====================================================================
           MAIN LOOP
           ===================================================================== */

        let lastTime = performance.now();

        function loop(now) {
            // Delta time in seconds, clamped so a background tab doesn't teleport the game
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.05) dt = 0.05;

            // Blocked (phone / tablet / tiny window): the world is frozen and nothing is
            // drawn, so coming back to a big enough window resumes exactly where it was.
            if (!blocked) {
                update(dt);
                draw();
            }
            requestAnimationFrame(loop);
        }

        resetRun();          // so a valid world exists before the first run starts
        updateDesktopGate(); // decide up front whether this device gets the game at all
        requestAnimationFrame(loop);
    </script>
</body>
