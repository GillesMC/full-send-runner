                const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * DUST_SPREAD;
                dust.push({
                    x: x / CURSOR_PIXEL + Math.cos(a) * r, y: y / CURSOR_PIXEL + Math.sin(a) * r,
                    vx: randIn(DUST_SPEED_X) * (both && i % 2 ? -1 : 1), vy: randIn(DUST_SPEED_Y), t: 0, life: randIn(DUST_LIFE),
                    color: DUST_COLORS[Math.floor(Math.random() * DUST_COLORS.length)]
                });
            }
        }

        function dustTick(dt) {
            for (let i = dust.length - 1; i >= 0; i--) {
                const g = dust[i];
                if ((g.t += dt) >= g.life) { dust.splice(i, 1); continue; }
                g.vx += DUST_WIND[0] * dt; g.vy += DUST_WIND[1] * dt;
                g.x += g.vx * dt; g.y += g.vy * dt;
            }
            if (!dust.length && !slashShown) return;
            slashCtx.clearRect(0, 0, slashEl.width, slashEl.height);
            slashShown = dust.length > 0;
            for (const g of dust) {
                slashCtx.fillStyle = g.color;
                slashCtx.fillRect(Math.round(g.x), Math.round(g.y), 1, 1);
            }
        }

        // The pointing spot (the hand's fingertip, the katana's tip at rest, the shuriken's or tomoe's center) on the mouse
        function placeCursor(x, y) {
            let ox = 0, oy = 0;
            if (CURSOR_STYLE === "geta") {
                cursorEl.style.transform = "translate(" + Math.round(x - GETA_TIP.x * CURSOR_PIXEL) + "px," + Math.round(y - GETA_TIP.y * CURSOR_PIXEL) + "px)";
                return;
            }
            if (CURSOR_STYLE === "hand" || CURSOR_STYLE === "gauntlet") {
                cursorEl.style.transform = "translate(" + Math.round(x - HAND_TIP.x * CURSOR_PIXEL) + "px," + Math.round(y - HAND_TIP.y * CURSOR_PIXEL) + "px)";
                return;
            }
            if (CURSOR_STYLE === "katana") {
                const a = KATANA_REST * Math.PI / 180;
                ox = -Math.cos(a) * katanaTipR * CURSOR_PIXEL;
                oy = -Math.sin(a) * katanaTipR * CURSOR_PIXEL;
            }
            const half = CURSOR_SIZE * CURSOR_PIXEL / 2;
            cursorEl.style.transform = "translate(" + Math.round(x + ox - half) + "px," + Math.round(y + oy - half) + "px)";
        }

        window.addEventListener("pointermove", (e) => {
            if (e.pointerType === "touch") return;
            if (cursorLast) shurikenSpin = Math.min(SHURIKEN_SPIN_MAX, shurikenSpin + Math.hypot(e.clientX - cursorLast.x, e.clientY - cursorLast.y) * SHURIKEN_SPIN_PER_PX);
            cursorLast = { x: e.clientX, y: e.clientY };
            placeCursor(e.clientX, e.clientY);
            cursorEl.style.display = "block";
        });
        window.addEventListener("pointerdown", (e) => {
            if (e.pointerType === "touch") return;
            cursorClickT = 0;
            if (CURSOR_STYLE === "hand" && !blocked) { handDown = true; startSlash(e.clientX, e.clientY); }
            if ((CURSOR_STYLE === "gauntlet" || CURSOR_STYLE === "geta") && !blocked) dustAt = { x: e.clientX, y: e.clientY };
        }, true);
        window.addEventListener("pointerup", () => { handDown = false; }, true);
        window.addEventListener("blur", () => { handDown = false; });
        document.documentElement.addEventListener("mouseleave", () => { cursorEl.style.display = "none"; cursorLast = null; });

        // Every frame: moves it on, and redraws it if it changed
        function cursorTick(dt) {
            let key, draw;
            if (cursorClickT >= 0) cursorClickT += dt;
            if (CURSOR_STYLE === "hand") {
                if (cursorClickT >= HAND_PRESS_T) cursorClickT = -1;
                const pressed = handDown || cursorClickT >= 0;
                key = "hand" + pressed;
                draw = () => drawHand(pressed);
                slashTick(dt);
            } else if (CURSOR_STYLE === "gauntlet") {
                // the snap's timeline: turn to cocked, hold, snap, hold, turn back to pointing
                const t = cursorClickT, turn = GAUNTLET_TURN_T;
                const snapAt = 2 * turn + GAUNTLET_COCKED_T, backAt = snapAt + GAUNTLET_SNAPPED_T;
                if (dustAt && t >= snapAt) { startDust(dustAt.x, dustAt.y); stonesT = 0; dustAt = null; }
                if (t >= backAt + 2 * turn) cursorClickT = -1;
                let sprite = GAUNTLET_SPRITE, k = 1; // k: 0 = flat (mid-turn) .. 1 = open
                if (cursorClickT >= 0) {
                    if (t < turn) k = 1 - t / turn;
                    else if (t < snapAt) { sprite = GAUNTLET_COCKED; k = Math.min(1, (t - turn) / turn); }
                    else if (t < backAt) sprite = GAUNTLET_SNAPPED;
                    else if (t < backAt + turn) { sprite = GAUNTLET_SNAPPED; k = 1 - (t - backAt) / turn; }
                    else k = (t - backAt - turn) / turn;
                }
                const width = Math.round((GAUNTLET_TURN_THIN + (1 - GAUNTLET_TURN_THIN) * k) * 12) / 12;
                // its stones lit right now, one after the other
                let lit = "";
                if (stonesT >= 0) {
                    stonesT += dt;
                    for (let i = 0; i < GAUNTLET_STONES.length; i++) {
                        const t = stonesT - i * GAUNTLET_STONE_T;
                        if (t >= 0 && t < GAUNTLET_STONE_LIT_T) lit += GAUNTLET_STONES[i];
                    }
                    if (stonesT >= (GAUNTLET_STONES.length - 1) * GAUNTLET_STONE_T + GAUNTLET_STONE_LIT_T) stonesT = -1;
                }
                key = [GAUNTLET_SPRITE, GAUNTLET_COCKED, GAUNTLET_SNAPPED].indexOf(sprite) + "," + width + lit;
                draw = () => drawGauntlet(sprite, width, lit);
                dustTick(dt);
            } else if (CURSOR_STYLE === "geta") {
                // lifted, then clacked down (dust from under its teeth), then at rest
                const t = cursorClickT;
                if (dustAt && t >= GETA_LIFT_T) {
                    startDust(dustAt.x + (GETA_FEET.x - GETA_TIP.x) * CURSOR_PIXEL, dustAt.y + (GETA_FEET.y - GETA_TIP.y) * CURSOR_PIXEL, true);
                    dustAt = null;
                }
                if (t >= GETA_LIFT_T + GETA_CLACK_T) cursorClickT = -1;
                const lift = cursorClickT >= 0 && t < GETA_LIFT_T ? GETA_LIFT : 0;
                const clack = cursorClickT >= 0 && t >= GETA_LIFT_T;
                key = "geta" + lift + clack;
                draw = () => drawGeta(clack ? GETA_CLACK : GETA_SPRITE, lift);
                dustTick(dt);
            } else if (CURSOR_STYLE === "katana") {
                const end = KATANA_SWING[KATANA_SWING.length - 1][0];
                const t = cursorClickT, windup = KATANA_SWING[1][0];
                if (t >= end + KATANA_TRAIL_T) cursorClickT = -1;
                const angle = Math.round(KATANA_REST + (cursorClickT >= 0 ? katanaSwing(t) : 0));
                // the trail: from where the cut started, to the tip's furthest point; its start
                // catches up with its end as it fades
                let from = 0, to = 0;
                if (cursorClickT >= windup) {
                    const peakAt = KATANA_SWING[2][0];
                    to = Math.round(KATANA_REST + katanaSwing(Math.min(t, peakAt)));
                    from = KATANA_REST + KATANA_SWING[1][1];
                    const fade = Math.max(0, (t - peakAt) / (end + KATANA_TRAIL_T - peakAt));
                    from = Math.round(from + (to - from) * Math.min(1, fade));
                }
                key = angle + "," + from + "," + to;
                draw = () => drawKatana(angle, from, to);
            } else {
                shurikenAngle = (shurikenAngle + shurikenSpin * dt) % 1;
                shurikenSpin *= Math.exp(-SHURIKEN_SPIN_DRAG * dt);
                let turn = 0;
                if (cursorClickT >= 0) {
                    const k = Math.min(1, cursorClickT / SHURIKEN_CLICK_TURN_T);
                    turn = 1 - Math.pow(1 - k, 3); // fast, then eases into place
                    if (k >= 1) { cursorClickT = -1; turn = 0; }
                }
                const step = Math.round((shurikenAngle + turn) * SHURIKEN_ANGLE_STEPS) % SHURIKEN_ANGLE_STEPS;
                key = step;
                draw = CURSOR_STYLE === "tomoe" ? () => drawTomoe(step) : () => drawShuriken(step);
            }
            if (key !== cursorDrawn) { draw(); cursorDrawn = key; }
        }

        if (isDesktop()) document.documentElement.classList.add("custom-cursor");
        cursorTick(0);

        /* =====================================================================
           SCREEN FLOW & INPUT — any press on the title screen: Space / Enter / click / tap
           ===================================================================== */

        // --- Screen flow helpers ---
        // To the title screen: the LOADING screen as it is now is kept, and faded out over it
        function goHome() {
            bootFade = document.createElement("canvas");
            bootFade.width = W;
            bootFade.height = H;
            bootFade.getContext("2d").drawImage(canvas, 0, 0);
            bootFadeTime = 0;
            state = "home";
            homeMenuTime = 0;
            canvas.classList.remove("boot");
        }
        // The home screen is "complete" once every image has either loaded or been ruled
        // missing, and its font is in (see homeReady). PRESS START only appears — and only
        // responds — after that, and the theme starts then.
        // The title screen's font: once its stylesheet is in, load the face itself; if it
        // never comes (offline), give up after LOADING_MAX_T and use the fallback.
        let fontSettled = false;
        window.addEventListener("load", () => {
            const done = () => { fontSettled = true; };
            if (document.fonts) document.fonts.load(HOME_PRESS_START.font, HOME_PRESS_START.text).then(done, done);
            else done();
        });
        setTimeout(() => { fontSettled = true; }, LOADING_MAX_T * 1000);
        function homeReady() { return allAssetsSettled() && fontSettled; }

        // Key moments of a crossing (s since it started), from the constants above
        // and the gummy's own width:
        //   0 .. run          the left portal opens, and swirls PORTAL_WAIT_T before he comes out
        //   .. leftClose      the gummy is fully out of it, it closes behind him
        //   rightOpen         the right portal opens ~1s before he gets there
        //   .. arrive         he is fully inside it, it closes
        //   end               both portals are closed: the next pause starts
        //   eyeOpen .. end    the samurai has an eye open: from the gummy's center passing HOME_EYE_FROM
        function crossingTimeline() {
            const gw = gummyWidth();
            const run = PORTAL_OPEN_T + PORTAL_WAIT_T;
            const arrive = run + (PORTAL_RIGHT_X - PORTAL_LEFT_X + gw) / CROSSING_GUMMY_SPEED;
            const leftClose = run + gw / CROSSING_GUMMY_SPEED + PORTAL_HOLD_T;
            const rightOpen = Math.max(0, arrive - 1.0 - PORTAL_OPEN_T);
            const eyeOpen = run + (HOME_EYE_FROM - PORTAL_LEFT_X + gw / 2) / CROSSING_GUMMY_SPEED;
            return { run, leftClose, rightOpen, arrive, eyeOpen, end: arrive + PORTAL_OPEN_T };
        }

        // Waits a random PORTAL_GAP, plays one crossing, and again
        function updateCrossing(dt) {
            if (crossingTime < 0) {
                if ((crossingWait -= dt) > 0) return;
                crossingTime = 0;
                playSfx("portalOpen", MIX_PORTAL_OPEN, PORTAL_LEFT_X, 0, PORTAL_SOUND_LENGTH);
                return;
            }
            const before = crossingTime;
            crossingTime += dt;
            const tl = crossingTimeline();
            // The portals' sounds (the left one opening is played as the crossing starts, above):
            // started early so that each one's hit lands on its moment, panned to its portal
            for (const [at, name, volume, x] of [
                [tl.rightOpen, "portalOpen", MIX_PORTAL_OPEN, PORTAL_RIGHT_X],
                [tl.leftClose + PORTAL_OPEN_T, "portalClose", MIX_PORTAL_CLOSE, PORTAL_LEFT_X],  // fully closed
                [tl.end, "portalClose", MIX_PORTAL_CLOSE, PORTAL_RIGHT_X]]) {
                const lead = soundLead(name);
                if (before < at - lead && crossingTime >= at - lead) playSfx(name, volume, x, 0, PORTAL_SOUND_LENGTH);
            }
            // The samurai's "hm"s, started early so they are heard as his eye opens, and as it
            // closes again (with the right portal: the end of the crossing)
            const hmLead = soundLead("samuraiHm");
            for (const [at, hm] of [[tl.eyeOpen, SAMURAI_HM_OPEN], [tl.end, SAMURAI_HM_CLOSE]])
                if (before < at - hmLead && crossingTime >= at - hmLead)
                    playSfx("samuraiHm", MIX_SAMURAI_HM, HOME_EYE.x, hm.start, hm.length);
            // A footstep on every frame of the run where a foot lands, started early so it is
            // heard as that frame shows, panned after where the gummy is then
            const lead = soundLead("gummyStep");
            const frameAt = time => Math.floor((time - tl.run) * RUN_FPS); // run frames shown so far, 0 = the first
            for (let f = Math.max(0, frameAt(before + lead) + 1); f <= frameAt(crossingTime + lead); f++) {
                const at = tl.run + f / RUN_FPS;
                if (at >= tl.arrive) break;
                if (!GUMMY_STEP_FRAMES.includes(f % runFrameCount() + 1)) continue;
                const x = PORTAL_LEFT_X - gummyWidth() / 2 + CROSSING_GUMMY_SPEED * (at - tl.run);
                const start = GUMMY_STEP_STARTS[gummyStep++ % GUMMY_STEP_STARTS.length];
                playSfx("gummyStep", MIX_GUMMY_STEP, x, start - SOUND_HIT.gummyStep, GUMMY_STEP_LENGTH);
            }
            if (crossingTime >= tl.end) {
                crossingTime = -1;
                crossingWait = randIn(PORTAL_GAP);
            }
        }

        // Any press (key, click, tap — anywhere). On the title screen, PRESS START is
        // not wired to a game yet, so it plays its sound and shows PRESS_MESSAGE_LINES instead
        function pressButton() {
            // LOADING screen: nothing until ENTER is up, then any press goes to the title screen
            // (unlockSound has just turned the sound on)
            if (state === "boot") { if (bootReady) goHome(); return; }
            if (!homeReady()) return; // PRESS START is not up yet
            if (pressMessageTime > 0) return; // the message is up: PRESS START is back once it is gone
            playSfx("pressStart", MIX_PRESS_START, W / 2);
            pressMessageTime = PRESS_MESSAGE_T;
        }

        window.addEventListener("keydown", (e) => {
            if (blocked) return; // the "get a PC" screen swallows every input
            if (!["Space", "Enter", "ArrowUp"].includes(e.code)) return;
            e.preventDefault();
            if (e.repeat) return;
            pressButton();
        });
        window.addEventListener("pointerdown", (e) => { if (blocked) return; e.preventDefault(); pressButton(); }); // mouse, pen and touch

        /* =====================================================================
           RANDOM HELPERS
           ===================================================================== */

        function rand(min, max) { return min + Math.random() * (max - min); }
        function randIn(range) { return rand(range[0], range[1]); } // range = [min, max]

        function update(dt) {
            if (state === "home") updateHomeScene(dt); // the forest keeps living
            if (bootFade && (bootFadeTime += dt) >= BOOT_TO_HOME_T) bootFade = null;

            if (state === "boot") {
                if (!mix) ensureAudio(); // the sounds start loading now (they stay silent until a click)
                // The LOADING screen waits for the images, with a floor and a ceiling on
                // how long it stays, then holds a beat; ENTER replaces LOADING at the end of a
                // round of dots (all three shown), never in the middle of one.
                const before = bootTime, round = BOOT_DOT_T * 4;
                bootTime += dt;
                updateFrog(dt);
                if (loadingProgress() >= 1) bootDoneTime += dt;
                const loaded = bootDoneTime >= LOADING_HOLD_T || bootTime >= LOADING_MAX_T;
                if (loaded && Math.floor(bootTime / round) > Math.floor(before / round)) bootReady = true;
            } else if (state === "home" && homeReady()) {
                homeMenuTime += dt; // PRESS START fades in
                if (!themeWanted) startTheme(); // the title screen is fully up: the theme starts
                if (pressMessageTime > 0) pressMessageTime -= dt;
                updateCrossing(dt);
            }
        }

        /* =====================================================================
           DRAWING
           ===================================================================== */

        function draw() {
            ctx.imageSmoothingEnabled = false; // pixel art: a scaled sprite stays crisp, never blurred
            drawScreen();
        }

        // One screen, drawn in coordinates 0..W x 0..H
        function drawScreen() {
            if (state === "boot") drawBoot();
            else drawHome();
        }

        // Draws text in a chunky PIXELATED style: rendered small on an offscreen
        // canvas, then blown up with image smoothing disabled.
        const pixelCanvas = document.createElement("canvas");
        const pixelCtx = pixelCanvas.getContext("2d");
        function drawPixelText(text, cx, cy, smallPx, scaleFactor, color) {
            pixelCtx.font = "bold " + smallPx + "px monospace";
            const tw = Math.ceil(pixelCtx.measureText(text).width) + 4;
            const th = smallPx + 6;
            pixelCanvas.width = tw;  // resizing also clears the offscreen canvas
            pixelCanvas.height = th;
            pixelCtx.font = "bold " + smallPx + "px monospace"; // re-set after the resize
            pixelCtx.textAlign = "left";
            pixelCtx.textBaseline = "top";
            pixelCtx.fillStyle = color;
            pixelCtx.fillText(text, 2, 2);
            ctx.save();
            ctx.imageSmoothingEnabled = false; // this is what makes the pixels chunky
            ctx.drawImage(pixelCanvas, cx - (tw * scaleFactor) / 2, cy - (th * scaleFactor) / 2, tw * scaleFactor, th * scaleFactor);
            ctx.restore();
        }

        // The gummy's run cycle frames sit in their own folder, like the portal's: Gummy_run/gummy_run_n
        function runBase() { return "Gummy_run/gummy_run"; }
        function runSlot(n) { return runBase() + "_" + n; }

        // Run frames actually delivered: the loop cycles over what exists (none = placeholder).
        function runFrameCount() {
            return loadedFrames(runBase(), RUN_FRAME_COUNT) || RUN_FRAME_COUNT;
        }

        /* =====================================================================
           TITLE SCREEN — the forest
           The still layers back to front (HOME_BACK_LAYERS, the waterfall loop,
           HOME_FRONT_LAYERS), then what lives in them: falling leaves, the
           meditating samurai and his katana, the tancho koi. Everything is drawn at its
           native size on whole pixels, so the pixel art stays crisp.
           ===================================================================== */

        const HOME_SPLASH_T = 0.9;   // how long a koi splash lasts (s)

        // --- The living scene. Set up once at load, then animated on the title
        //     screen, the gummy's crossings included. ---
        let homeSceneTime = 0;     // the scene's own clock (s)
        let leaves = [];           // {cx, y, w, h, fall, sway, speed, phase, far, slot, size, wait} — cx = center of the sway
        let leafSpawnXs = [];      // where the last leaves came down (center x), newest last
        let tanchoWater = [];      // the droplets riding up with the tancho, then thrown off (see HOME_KOI_WATER_*)
        let koiJump = null;        // the tancho's leap in progress {t, x0, dir}, or null
        let koiJumpWait = 2.5;     // time before the next leap (s) — the first one comes early
        let splashes = [];         // see makeSplash: where the tancho broke the water
        let floatClear = [];       // per floater, per x: how low the rocks make it sit (see pondClearance)
        let lookCache = [], lookTime = -1; // sceneAt's answers, for the current frame

        const HOME_LOOK_STEP = 0.1; // s between two looks when a path is played ahead
        // Are rects {x, y, w, h} a and b closer than gap px?
        function rectsNear(a, b, gap) {
            return a.x < b.x + b.w + gap && b.x < a.x + a.w + gap && a.y < b.y + b.h + gap && b.y < a.y + a.h + gap;
        }

        // The kite at time t ({x, y, w, h}, flip = flying right: the art faces left): on
        // the flat loop set by its `soar`, through its PSD spot, turning round at soar.left
        // (behind the trunk) and soar.right (off the screen)
        const HOME_TOBI = HOME_BACK_LAYERS.find(L => L.soar);
        function tobiAt(t) {
            const L = HOME_TOBI, s = L.soar;
            const cx = (s.left + s.right) / 2, rx = (s.right - s.left) / 2;
            const a0 = Math.acos((L.x - cx) / rx); // its PSD spot on the loop, heading left
            const a = a0 + t * Math.PI * 2 / s.period;
            return {
                x: cx + rx * Math.cos(a), y: L.y + s.ry * (Math.sin(a) - Math.sin(a0)),
                w: slotW(L.slot, 38), h: slotH(L.slot, 38), flip: Math.sin(a) < 0
            };
        }

        // --- The pond's floating flowers (see HOME_FLOATERS) ---
        const pondTopCol = new Int16Array(W); // HOME_POND_TOP, one value per column
        HOME_POND_TOP.forEach(([x, y], i) => pondTopCol.fill(y, x, i + 1 < HOME_POND_TOP.length ? HOME_POND_TOP[i + 1][0] : W));
        // The highest a floater w px wide, left edge on x, may sit (its top edge, px): under
        // the rock / water edge all along it, and eased down on its way there
        function pondClearance(x, w) {
            const reach = (H - 640) / HOME_FLOAT_EASE; // the pond's rock edges are all below y 640
            let y = 0;
            for (let c = Math.floor(x - reach); c <= x + w + reach; c++) {
                const d = c < x ? x - c : c > x + w ? c - x - w : 0;
                y = Math.max(y, pondTopCol[Math.max(0, Math.min(W - 1, c))] - d * HOME_FLOAT_EASE);
            }
            return Math.ceil(y);
        }
        // Do floaters a and b share columns, counting the current's loop (one that just
        // left on the right is also about to come in on the left)?
        function loopOverlapX(a, b) {
            const d = ((b.x - a.x) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP;
            return d < a.w || HOME_FLOAT_LOOP - d < b.w;
        }
        // Every floater at time t: [{slot, x, y, w, h}], in HOME_FLOATERS order
        function floatersAt(t) {
            const off = HOME_FLOAT_LOOP - W;
            const out = HOME_FLOATERS.map((f, i) => {
                const x = ((f.x + off + HOME_FLOAT_SPEED * t) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP - off;
                const bob = Math.sin(t * Math.PI * 2 / HOME_FLOAT_BOB_T - x / 40) > 0 ? -1 : 0; // the ripple runs with the current
                return { slot: f.slot, x, y: Math.max(f.y + bob, floatClear[i][Math.floor(x) + off]), w: f.w, h: f.h };
            });
            // one that comes under another one (listed before it) is nudged below it
            for (let i = 1; i < out.length; i++)
                for (let j = 0; j < i; j++)
                    if (loopOverlapX(out[i], out[j])) out[i].y = Math.max(out[i].y, out[j].y + out[j].h);
            return out;
        }

        // --- The tancho's leap j = {x0, dir}: x0 = its center as it leaves the water ---
        // At time t into the leap: {x, y, w, h} = what shows above the water, cx / cy = its
        // center, quarter = quarter turns (0 head up, 1 level); null under water
        function tanchoSize() {
            return {
                w: Math.round(slotW(HOME_KOI_JUMPER, 102) * HOME_KOI_JUMP_SCALE),
                h: Math.round(slotH(HOME_KOI_JUMPER, 152) * HOME_KOI_JUMP_SCALE)
            };
        }
        // How high the arc lifts it (px), so that its top is on JUMP_TOP when it levels out
        function tanchoRise() {
            const up = HOME_KOI_LEVEL_AT;
            return (HOME_KOI_WATER_Y - HOME_KOI_JUMP_TOP) / (4 * up * (1 - up));
        }
        function tanchoAt(j, t) {
            if (t < 0 || t > HOME_KOI_JUMP_T) return null;
            const { w, h } = tanchoSize(), up = HOME_KOI_LEVEL_AT;
            const p = t / HOME_KOI_JUMP_T, rise = tanchoRise();
            const cx = j.x0 + j.dir * HOME_KOI_JUMP_DX * p;   // a ballistic arc
            const cy = HOME_KOI_WATER_Y + h / 2 - rise * 4 * p * (1 - p);
            const quarter = p < up ? 0 : 1;
            const rw = quarter === 1 ? h : w, rh = quarter === 1 ? w : h; // level: lying on its side
            const top = cy - rh / 2;
            if (top >= HOME_KOI_WATER_Y) return null;
            return { x: cx - rw / 2, y: top, w: rw, h: Math.min(rh, HOME_KOI_WATER_Y - top), cx, cy, quarter };
        }

        // --- Falling leaves ---
        // A new falling leaf (or cherry blossom), not placed yet. far = falls behind the
        // forest, smaller and slower. slot / size are picked at random when omitted.
        function makeLeaf(far, slot, size) {
            slot = slot || (Math.random() < HOME_BLOSSOM_CHANCE ? "cherry_blossom" : "leaf_1");
            size = size || randIn(far ? HOME_LEAF_FAR_SIZE : HOME_LEAF_SIZE);
            return {
                far, slot, size, cx: 0, y: 0, phase: 0, wait: 0, small: !far && size < HOME_LEAF_SMALL,
                w: Math.round(slotW(slot, 40) * size), h: Math.round(slotH(slot, 45) * size),
                fall: randIn(HOME_LEAF_FALL) * size, sway: randIn(HOME_LEAF_SWAY) * size,
                speed: randIn(HOME_LEAF_SWAY_SPEED)
            };
        }
        // Where a leaf's fall ends: a small one once it is fully behind the ledge, the others off the screen
        function leafEnd(l) { return l.small ? HOME_LEAF_HIDDEN_Y : H; }
        // Where leaf l will be tau s from now
        function leafRect(l, tau) {
            return { x: l.cx + Math.sin(l.phase + l.speed * tau) * l.sway - l.w / 2, y: l.y + l.fall * tau, w: l.w, h: l.h };
        }
        // Everything whose path is known, k looks (HOME_LOOK_STEP) from now: [{r, who}] —
        // the leaves, the kite, the floaters, the tancho's leap in progress
        function sceneAt(k) {
            if (lookTime !== homeSceneTime) { lookTime = homeSceneTime; lookCache = []; }
            if (!lookCache[k]) {
                const tau = k * HOME_LOOK_STEP, t = homeSceneTime + tau, list = [];
                for (const l of leaves) if (!l.wait && l.y + l.fall * tau < leafEnd(l)) list.push({ r: leafRect(l, tau), who: l });
                list.push({ r: tobiAt(t), who: "tobi" });
                for (const f of floatersAt(t)) list.push({ r: f, who: "float" });
                const j = koiJump && tanchoAt(koiJump, koiJump.t + tau);
                if (j) list.push({ r: j, who: "tancho" });
                lookCache[k] = list;
            }
            return lookCache[k];
        }
        // Does leaf l's whole fall, until it is off the screen, keep HOME_LEAF_GAP from all that?
        function leafPathClear(l) {
            for (let k = 0; ; k++) {
                const r = leafRect(l, k * HOME_LOOK_STEP);
                if (r.y >= leafEnd(l)) return true;
                if (l.far && rectsNear(r, HOME_FAR_ZONE, 0)) return false; // never behind the temple
                for (const o of sceneAt(k)) if (o.who !== l && rectsNear(r, o.r, HOME_LEAF_GAP)) return false;
            }
        }
        // Leaf l comes down again as a new one, from just above the screen: away from where
        // the last ones came down, at a spot where its whole fall is clear. If there is no
        // such spot right now, it waits a moment and tries again.
        function dropLeaf(l) {
            Object.assign(l, makeLeaf(Math.random() < HOME_LEAF_FAR_CHANCE));
            l.y = -l.h;
            l.wait = 0.4;
            for (let i = 0; i < 24 && l.wait; i++) {
                const cx = rand(0, W);
                if (leafSpawnXs.some(x => Math.abs(x - cx) < HOME_LEAF_SPREAD)) continue;
                l.cx = cx;
                l.phase = rand(0, Math.PI * 2);
                if (leafPathClear(l)) {
                    l.wait = 0;
                    leafSpawnXs = leafSpawnXs.concat(cx).slice(-HOME_LEAF_MEMORY);
                }
            }
            lookTime = -1; // the scene changed
        }

        function initHomeScene() {
            const off = HOME_FLOAT_LOOP - W;
            floatClear = HOME_FLOATERS.map(f => Int16Array.from({ length: HOME_FLOAT_LOOP }, (_, i) => pondClearance(i - off, f.w)));
            // The leaves: the PSD's where the master has them (only their pace and sway are
            // drawn at random, until their fall is clear), then a few far ones at random
            // spots. One that finds no clear fall comes down later, from above.
            leaves = [];
            const add = make => {
                let l;
                for (let i = 0; i < 40; i++) {
                    l = make();
                    if (leafPathClear(l)) break;
                    l.wait = rand(1, 4);
                }
                leaves.push(l);
                lookTime = -1;
            };
            const starts = HOME_LEAF_START.map(s => ["leaf_1", ...s]).concat(HOME_BLOSSOM_START.map(s => ["cherry_blossom", ...s]));
            for (const [slot, cx, cy, size] of starts)
                add(() => { const l = makeLeaf(false, slot, size); l.cx = cx; l.y = cy - l.h / 2; return l; });
            for (let i = 0; i < HOME_LEAF_FAR_START; i++)
                add(() => { const l = makeLeaf(true); l.cx = rand(0, W); l.y = rand(0, GROUND_Y); l.phase = rand(0, Math.PI * 2); return l; });
        }

        function updateHomeScene(dt) {
            homeSceneTime += dt;

            // Leaves: fall and sway; once out of the screen they come down again from above
            // (a leaf waiting for a clear spot is not on screen)
            for (const l of leaves) {
                if (l.wait > 0) {
                    if ((l.wait -= dt) <= 0) dropLeaf(l);
                    continue;
                }
                l.y += l.fall * dt;
                l.phase += l.speed * dt;
                if (l.y > leafEnd(l)) dropLeaf(l);
            }

            // The tancho: waits, then leaps from a random one of HOME_KOI_JUMP_SHIFT, either
            // way, whatever is around — a splash each way.
            if (koiJump) {
                const before = koiJump.t;
                koiJump.t += dt;
                const dive = HOME_KOI_JUMP_T - soundLead("tanchoSplash"); // started early so its hit lands as it hits the water
                if (before < dive && koiJump.t >= dive) playSfx("tanchoSplash", MIX_TANCHO_SPLASH, koiJump.x0 + koiJump.dir * HOME_KOI_JUMP_DX);
                if (koiJump.t >= HOME_KOI_JUMP_T) {
                    splashes.push(makeSplash(koiJump.x0 + koiJump.dir * HOME_KOI_JUMP_DX, true));
                    koiJump = null;
                    koiJumpWait = randIn(HOME_KOI_JUMP_GAP);
                }
            } else if ((koiJumpWait -= dt) <= 0) {
                const shift = HOME_KOI_JUMP_SHIFT[Math.floor(Math.random() * HOME_KOI_JUMP_SHIFT.length)];
                const dir = Math.random() < 0.5 ? 1 : -1;
                koiJump = { t: 0, dir, x0: HOME_KOI_JUMP_CX + shift - dir * HOME_KOI_JUMP_DX / 2 };
                splashes.push(makeSplash(koiJump.x0, false));
                playSfx("tanchoJump", MIX_TANCHO_JUMP, koiJump.x0, soundLead("tanchoJump")); // its lead-in skipped: the hit is now
                tanchoWater = makeTanchoWater();
                lookTime = -1; // the scene changed (the leaves keep out of its way)
            }
            for (const s of splashes) s.t += dt;
            splashes = splashes.filter(s => s.t < HOME_SPLASH_T);
            updateTanchoWater(dt);
        }

        // Sky, clouds, mountains, forest, the waterfall's current frame, rocks, ground
        function drawHomeBackdrop() {
            ctx.fillStyle = "#56dbfd"; // sky.png's own color, also the placeholder while it loads
            ctx.fillRect(0, 0, W, H);
            for (const L of HOME_BACK_LAYERS) {
                if (L.leavesBehind) drawLeaves("far");
                let x = L.x || 0, y = L.y || 0, flipX = false;
                if (L.drift) {
                    // right to left, back in from the right once fully gone
                    const w = slotW(L.slot, 0), period = W + w;
                    x = -w + ((((x + w - L.drift * homeSceneTime) % period) + period) % period);
                }
                if (L.soar) ({ x, y, flip: flipX } = tobiAt(homeSceneTime)); // flying right: mirrored
                drawNative(L.slot, x, y, flipX);
            }
            // the kite over the temple, where it crosses it (see HOME_FAR_ZONE)
            const kite = tobiAt(homeSceneTime), Z = HOME_FAR_ZONE;
            ctx.save();
            ctx.beginPath();
            ctx.rect(Z.x, Z.y, Z.w, Z.h);
            ctx.clip();
            drawNative(HOME_TOBI.slot, kite.x, kite.y, kite.flip);
            ctx.restore();
            drawLeaves("small"); // further back: behind the rocks and the ledge
            for (const L of HOME_FRONT_LAYERS) drawNative(L.slot, L.x || 0, L.y || 0);
            drawHomeWater();
        }

        // --- Water, animated by code (see HOME_WATER_*) ---
        // The streaks are drawn on an offscreen canvas, cut to water_mask with
        // "destination-in" (only the mask's pixels keep them), then laid over the art.
        // No pixel is ever read back, so it also works when the page is opened as a file.
        const waterCanvas = document.createElement("canvas");
        waterCanvas.width = W;
        waterCanvas.height = H;
        const waterCtx = waterCanvas.getContext("2d");
        let waterStreaks = null;   // one list of seeds per zone, built on first use
        let waterTick = -1;        // the pattern step currently on waterCanvas

        // Small seeded random generator: the same pattern on every load
        function seededRandom(seed) {
            return () => {
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function buildWaterStreaks() {
            const rnd = seededRandom(1234);
            const between = (range) => range[0] + rnd() * (range[1] - range[0]);
            return HOME_WATER_ZONES.map(z => {
                const F = HOME_WATER_FLOWS[z.flow];
                return Array.from({ length: Math.round(z.w * z.h * F.density) }, () => ({
                    x: rnd() * z.w, y: rnd() * z.h, len: Math.round(between(F.len)),
                    speed: between(F.speed), phase: rnd() * Math.PI * 2, light: rnd() < F.light
                }));
            });
        }

        function drawHomeWater() {
            const mask = assets["water_mask"];
            if (!mask) return;
            const tick = Math.floor(homeSceneTime * HOME_WATER_FPS);
            if (tick !== waterTick) {
                waterTick = tick;
                const t = tick / HOME_WATER_FPS;
                if (!waterStreaks) waterStreaks = buildWaterStreaks();
                waterCtx.clearRect(0, 0, W, H);
                HOME_WATER_ZONES.forEach((z, i) => {
                    const F = HOME_WATER_FLOWS[z.flow];
                    waterCtx.save();
                    waterCtx.beginPath();
                    waterCtx.rect(z.x, z.y, z.w, z.h); // a zone's streaks never spill into the next
                    waterCtx.clip();
                    for (const s of waterStreaks[i]) {
                        waterCtx.fillStyle = s.light ? HOME_WATER_LIGHT : HOME_WATER_DARK;
                        if (F.dir === "down") {
                            const y = ((s.y + s.speed * t) % (z.h + s.len)) - s.len;
                            waterCtx.fillRect(z.x + Math.round(s.x), z.y + Math.round(y), 1, s.len);
                        } else if (F.dir === "flow") {
                            const y = (s.y + s.speed * t) % z.h;
                            waterCtx.fillRect(z.x + Math.round(s.x), z.y + Math.round(y), s.len, 1);
                        } else {
                            if (Math.sin(t * 1.6 + s.phase) < -0.2) continue; // twinkle: off for a moment
                            const x = ((s.x + s.speed * t) % (z.w + s.len)) - s.len;
                            waterCtx.fillRect(z.x + Math.round(x), z.y + Math.round(s.y), s.len, 1);
                        }
                    }
                    waterCtx.restore();
                });
                waterCtx.globalCompositeOperation = "destination-in"; // keep them on water pixels only
                waterCtx.drawImage(mask, 0, 0);
                waterCtx.globalCompositeOperation = "source-over";
            }
            ctx.drawImage(waterCanvas, 0, 0);
        }

        // The samurai at his PSD spot, meditating. On the out-breath the rows above
        // HOME_BREATH_SPLIT are drawn HOME_BREATH_PX lower, over the top row below them:
        // whole rows moved by whole pixels, nothing is ever resampled. eyeOpen draws
        // eye.png on him — it follows the breath, it is part of his head.
        function drawHomeSamurai(eyeOpen) {
            const img = assets["samurai"];
            if (!img) return;
            const { x, y } = HOME_SAMURAI, s = HOME_BREATH_SPLIT;
            const t = homeSceneTime % (HOME_BREATH_PERIOD + HOME_BREATH_PAUSE); // in-breath | out-breath | pause (still out)
            const out = t >= HOME_BREATH_PERIOD / 2 ? HOME_BREATH_PX : 0;
            ctx.drawImage(img, 0, s, img.width, img.height - s, x, y + s, img.width, img.height - s);
            ctx.drawImage(img, 0, 0, img.width, s, x, y + out, img.width, s);
            if (eyeOpen) drawNative("eye", HOME_EYE.x, HOME_EYE.y + out);
        }

        // A splash where the tancho breaks the water at x: its droplets are drawn once, at
        // random, when it starts. entry = diving back in (a little bigger).
        function makeSplash(x, entry) {
            const k = entry ? 1.2 : 1;
            const drops = Array.from({ length: Math.round(HOME_SPLASH_DROPS * k) }, () => {
                const a = Math.PI * rand(0.12, 0.88), v = randIn(HOME_SPLASH_SPEED) * k; // a crown, mostly upward
                return {
                    x: rand(-14, 14), vx: Math.cos(a) * v, vy: -Math.sin(a) * v,
                    size: Math.random() < 0.3 ? 3 : 2,
                    color: HOME_SPLASH_COLORS[Math.floor(Math.random() * HOME_SPLASH_COLORS.length)]
                };
            });
            return { x, t: 0, k, drops };
        }

        // The water that rides up with the tancho as it comes out: droplets sitting on its
        // head and running down its back (dx / dy from the middle of its top edge), each one
        // carried until the leap reaches its own share of the height (off), then thrown off
        // with part of its speed (keep) and spread out, and pulled back into the pond.
        function makeTanchoWater() {
            const w = tanchoSize().w, H0 = HOME_KOI_WATER_Y - HOME_KOI_JUMP_TOP;
            return Array.from({ length: HOME_KOI_WATER_DROPS }, () => {
                const dy = rand(-14, 40);                                        // above its head .. down its back
                const half = w * (0.12 + 0.28 * Math.max(0, Math.min(1, dy / 40))); // narrow on its head, wider down its body
                return {
                    dx: rand(-half, half), dy, carried: true,
                    offY: HOME_KOI_WATER_Y - H0 * randIn(HOME_KOI_WATER_OFF) + Math.max(0, dy), // the drop itself is thrown off there
                    keep: randIn(HOME_KOI_WATER_KEEP), x: 0, y: 0, vx: 0, vy: 0,
                    size: Math.random() < 0.3 ? 3 : 2,
                    color: HOME_SPLASH_COLORS[Math.floor(Math.random() * HOME_SPLASH_COLORS.length)]
                };
            });
        }
        // Middle of the tancho's top edge on the way up (head up), wherever the water line is,
        // and how fast it moves (px/s)
        function tanchoHead(j, t) {
            const p = t / HOME_KOI_JUMP_T, rise = tanchoRise();
            return {
                x: j.x0 + j.dir * HOME_KOI_JUMP_DX * p,
                y: HOME_KOI_WATER_Y - rise * 4 * p * (1 - p),
                vx: j.dir * HOME_KOI_JUMP_DX / HOME_KOI_JUMP_T,
                vy: -rise * 4 * (1 - 2 * p) / HOME_KOI_JUMP_T
            };
        }
        function updateTanchoWater(dt) {
            for (const d of tanchoWater) {
                if (d.carried) {
                    const head = koiJump && koiJump.t / HOME_KOI_JUMP_T < HOME_KOI_LEVEL_AT ? tanchoHead(koiJump, koiJump.t) : null;
                    if (head) {
                        d.x = head.x + d.dx;
                        d.y = head.y + d.dy;
                        if (d.y > d.offY) continue; // still riding up with it
                    }
                    d.carried = false; // thrown off: spread out, part of the leap's speed
                    const v = head || { vx: 0, vy: 0 };
                    d.vx = v.vx * d.keep + d.dx * 2.2 + rand(-15, 15);
                    d.vy = v.vy * d.keep;
                }
                d.vy += HOME_SPLASH_GRAVITY * dt;
                d.x += d.vx * dt;
                d.y += d.vy * dt;
            }
            tanchoWater = tanchoWater.filter(d => d.carried || d.vy < 0 || d.y < HOME_KOI_WATER_Y); // gone once back in the pond
        }
        function drawTanchoWater() {
            for (const d of tanchoWater) {
                if (d.y >= HOME_KOI_WATER_Y) continue; // not out of the water yet
                ctx.fillStyle = d.color;
                ctx.fillRect(Math.round(d.x - d.size / 2), Math.round(d.y) - d.size, d.size, d.size);
            }
        }
        // The rings and the foam are drawn on their own canvas and cut to water_mask (like
        // the water), so they never spill over a rock; the droplets are in the air.
        const splashCanvas = document.createElement("canvas");
        splashCanvas.width = W;
        splashCanvas.height = H;
        const splashCtx = splashCanvas.getContext("2d");
        function drawSplashes() {
            if (!splashes.length) return;
            const Y = HOME_KOI_WATER_Y, mask = assets["water_mask"];
            splashCtx.clearRect(0, 0, W, H);
            for (const s of splashes) {
                const p = s.t / HOME_SPLASH_T;
                // ripple rings: flat ellipses of whole pixels, spreading and fading out
                for (const lag of [0, 0.22]) {
                    const q = (p - lag) / (1 - lag);
                    if (q <= 0) continue;
                    const rx = (HOME_SPLASH_RING[0] + (HOME_SPLASH_RING[1] - HOME_SPLASH_RING[0]) * Math.sqrt(q)) * s.k;
                    const ry = Math.max(2, rx * 0.16);
                    splashCtx.globalAlpha = 0.7 * (1 - q);
                    splashCtx.fillStyle = HOME_SPLASH_COLORS[1];
                    for (let a = 0; a < Math.PI * 2; a += 2 / rx)
                        splashCtx.fillRect(Math.round(s.x + Math.cos(a) * rx), Math.round(Y + 2 + Math.sin(a) * ry), 2, 1);
                }
                // foam: a white burst on the water line that shrinks away
                if (p < 0.45) {
                    const fw = Math.round(34 * s.k * (1 - p / 0.45)), fh = Math.max(1, Math.round(6 * (1 - p / 0.45)));
                    splashCtx.globalAlpha = 0.9;
                    splashCtx.fillStyle = "#ffffff";
                    splashCtx.fillRect(Math.round(s.x - fw / 2), Y - fh + 2, fw, fh);
                    splashCtx.fillStyle = HOME_SPLASH_COLORS[2];
                    splashCtx.fillRect(Math.round(s.x - fw / 2) - 3, Y + 1, fw + 6, 2);
                }
            }
            splashCtx.globalAlpha = 1;
            if (mask) {
                splashCtx.globalCompositeOperation = "destination-in"; // on water pixels only
                splashCtx.drawImage(mask, 0, 0);
                splashCtx.globalCompositeOperation = "source-over";
            }
            ctx.drawImage(splashCanvas, 0, 0);
            for (const s of splashes) {
                // droplets: thrown up, pulled back down, gone once they are back in the pond
                ctx.globalAlpha = 1;
                for (const d of s.drops) {
                    const dy = d.vy * s.t + HOME_SPLASH_GRAVITY * s.t * s.t / 2;
                    if (dy > 0 && s.t > 0.05) continue;
                    ctx.fillStyle = d.color;
                    ctx.fillRect(Math.round(s.x + d.x + d.vx * s.t), Math.round(Y + dy) - d.size, d.size, d.size);
                }
            }
            ctx.globalAlpha = 1;
        }

        // The pond: the floating flowers, then the leaping tancho, the water riding up with it
        // and its splashes
        function drawKois() {
            for (const f of floatersAt(homeSceneTime)) drawNative(f.slot, f.x, f.y);
            const leap = koiJump && tanchoAt(koiJump, koiJump.t);
            if (leap) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, HOME_KOI_WATER_Y); // nothing of it shows under the water line
                ctx.clip();
                drawTurned(HOME_KOI_JUMPER, leap.cx, leap.cy, leap.quarter, koiJump.dir < 0, HOME_KOI_JUMP_SCALE); // leaping left: mirrored
                ctx.restore();
            }
            drawTanchoWater();
            drawSplashes();
        }

        // The leaves of one depth ("far", "small" or "big"), each at its own whole-pixel
        // size (nearest-neighbour, like the rest of the pixel art), mirrored while it
        // swings back to the left — which reads as the leaf turning over.
        function drawLeaves(depth) {
            for (const l of leaves) {
                if (l.wait > 0 || (l.far ? "far" : l.small ? "small" : "big") !== depth) continue;
                const r = leafRect(l, 0);
                drawNative(l.slot, r.x, r.y, Math.cos(l.phase) < 0, false, l.size);
            }
        }

        // The whole title-screen scene, in the PSD's order: the backdrop (with the far
        // and the small leaves inside it, behind the forest / the ledge), the koi, the
        // katana, the samurai, the big leaves (in front of him), the title (it overlaps
        // none of them). actors() draws the crossing's portals and gummy last, so
        // the gummy runs in front of the samurai. eyeOpen: see drawHomeSamurai.
        function drawHomeScene(actors, eyeOpen) {
            drawHomeBackdrop();
            drawKois();
            drawNative("katana", 0, 0);
            drawHomeSamurai(eyeOpen || HOME_EYE_ALWAYS);
            drawLeaves("big");
            drawHomeTitle();
            if (actors) actors();
        }

        // The FULL SEND title (title.png, full canvas): already in place at its PSD spot,
        // bobbing gently (whole pixels), on the scene's clock
        function drawHomeTitle() {
            const bob = Math.sin(homeSceneTime * HOME_LOGO_BOUNCE_SPEED) * HOME_LOGO_BOUNCE_PX;
            const dy = HOME_TITLE_SHIFT.y + bob;
            if (!drawNative("title", HOME_TITLE_SHIFT.x, dy)) {
                drawPixelText("FULL SEND", W / 2 + 5, 240 + dy + 5, 16, 5, MENU_SHADOW);
                drawPixelText("FULL SEND", W / 2, 240 + dy, 16, 5, "#ffffff");
            }
        }
        // LOADING progress, 0..1: the real image loading, but never faster than
        // LOADING_MIN_T so the screen doesn't just blink past
        function loadingProgress() {
            return Math.min(1, bootTime / LOADING_MIN_T, assetsSettled / ASSET_SLOTS.length);
        }

        // --- LOADING screen (see BOOT_* and FROG_*) ---
        // The frog's frames, in order (n = 1..24)
        function frogSlot(n) { return "loading screen/frog_" + n; }
        let frogFrame = 0;                 // the frame on screen (0-based)
        let frogFrameTime = 0;             // how long it has been up (s)
        // Moves the animation on: a frame of 0s is shown for exactly one screen refresh
        function updateFrog(dt) {
            const d = FROG_FRAME_T[frogFrame];
            frogFrameTime += dt;
            if (d > 0 && frogFrameTime < d) return;
            frogFrameTime = d > 0 ? frogFrameTime - d : 0;
            frogFrame = (frogFrame + 1) % FROG_FRAME_T.length;
        }

        // VT323 for LOADING / ENTER: the text waits for it (no flash of another font), up to LOADING_MAX_T
        const BOOT_FONT = BOOT_TEXT_PX + 'px "VT323"';
        let bootFontReady = false;
        if (document.fonts) document.fonts.load(BOOT_FONT, "LOADING ENTER").then(() => { bootFontReady = true; }, () => { bootFontReady = true; });
        else bootFontReady = true;
        setTimeout(() => { bootFontReady = true; }, LOADING_MAX_T * 1000);

        // Built once, on first use: the textured background with its vignette, a few grain
        // patterns, the scanlines, and scratch canvases for the picture and the text
        let bootLayers = null;
        function buildBootLayers() {
            const make = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
            // Background: the navy, each pixel nudged a little lighter or darker, then the vignette
            const bg = make(W, H), bgCtx = bg.getContext("2d");
            const base = [1, 3, 5].map(i => parseInt(BOOT_BG.slice(i, i + 2), 16));
            const img = bgCtx.createImageData(W, H);
            for (let i = 0; i < img.data.length; i += 4) {
                const n = Math.round(rand(-BOOT_BG_NOISE, BOOT_BG_NOISE));
                img.data[i] = base[0] + n; img.data[i + 1] = base[1] + n; img.data[i + 2] = base[2] + n; img.data[i + 3] = 255;
            }
            bgCtx.putImageData(img, 0, 0);
            const vignette = bgCtx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
            vignette.addColorStop(0, "rgba(0,0,0,0)");
            vignette.addColorStop(1, "rgba(0,0,0," + BOOT_VIGNETTE + ")");
            bgCtx.fillStyle = vignette;
            bgCtx.fillRect(0, 0, W, H);
            // Grain: patterns of random grey pixels around mid-grey, one picked at random every 1-2 frames
            const grain = Array.from({ length: 4 }, () => {
                const c = make(256, 256), g = c.getContext("2d"), d = g.createImageData(256, 256);
                for (let i = 0; i < d.data.length; i += 4) {
                    d.data[i] = d.data[i + 1] = d.data[i + 2] = Math.round(rand(128 - BOOT_GRAIN_SPREAD, 128 + BOOT_GRAIN_SPREAD));
                    d.data[i + 3] = 255;
                }
                g.putImageData(d, 0, 0);
                return ctx.createPattern(c, "repeat");
            });
            // Scanlines: one dark row out of three
            const line = make(1, 3), lineCtx = line.getContext("2d");
            lineCtx.fillStyle = "rgba(0,0,0," + BOOT_SCANLINE_ALPHA + ")";
            lineCtx.fillRect(0, 2, 1, 1);
            return { bg, grain, scanlines: ctx.createPattern(line, "repeat"), picture: make(W, H), text: make(W / BOOT_TEXT_SCALE, 60) };
        }
        let grainPick = { pattern: 0, x: 0, y: 0, frames: 0 }; // the grain pattern and offset on screen now

        // The LOADING screen. The picture is put together off screen — background, the frog's
        // glow then the frog — then laid on the screen slightly blurred with a touch of bloom;
        // LOADING (or ENTER) and its glow come next, then the scanlines and the grain on top of it all.
        // ctx.filter (blurs, contrast...) is skipped by browsers that don't have it.
        function drawBoot() {
            if (!bootLayers) bootLayers = buildBootLayers();
            const L = bootLayers, pic = L.picture.getContext("2d");
            pic.imageSmoothingEnabled = false;
            pic.drawImage(L.bg, 0, 0);

            const frame = assets[frogSlot(frogFrame + 1)];
            if (frame) {
                pic.save();
                pic.globalCompositeOperation = "screen";
                pic.filter = "blur(" + FROG_GLOW_BLUR + "px)";
                pic.globalAlpha = FROG_GLOW_ALPHA;
                pic.drawImage(frame, FROG_POS.x, FROG_POS.y + FROG_FRAME_DY[frogFrame]);
                pic.restore();
                pic.save();
                pic.filter = FROG_FILTER;
                pic.drawImage(frame, FROG_POS.x, FROG_POS.y + FROG_FRAME_DY[frogFrame]);
                pic.restore();
            }

            // On screen: the picture very slightly softened, then a touch of bloom
            ctx.fillStyle = BOOT_BG;
            ctx.fillRect(0, 0, W, H); // under the soft edges of the blur
            ctx.save();
            ctx.filter = "blur(" + BOOT_SOFTNESS + "px)";
            ctx.drawImage(L.picture, 0, 0);
            ctx.globalCompositeOperation = "screen";
            ctx.filter = "blur(" + BOOT_BLOOM_BLUR + "px)";
            ctx.globalAlpha = BOOT_BLOOM_ALPHA;
            ctx.drawImage(L.picture, 0, 0);
            ctx.restore();

            if (bootFontReady) {
                // LOADING with its dots appearing one by one (the word stays put), then ENTER:
                // drawn small on its own canvas, then enlarged pixel for pixel, centered. It comes after
                // the screen's softness, with a lighter one of its own: thin strokes stay white
                const tc = L.text.getContext("2d");
                tc.clearRect(0, 0, L.text.width, L.text.height);
                tc.font = BOOT_FONT;
                tc.textBaseline = "alphabetic";
                tc.fillStyle = BOOT_TEXT_COLOR;
                const text = bootReady ? "ENTER" : "LOADING " + ".".repeat(Math.floor(bootTime / BOOT_DOT_T) % 4);
                const tw = tc.measureText(bootReady ? "ENTER" : "LOADING ...").width;
                const base = 40; // the text's baseline on its canvas
                tc.fillText(text, Math.round(L.text.width / 2 - tw / 2), base);
                const x = W / 2 - L.text.width * BOOT_TEXT_SCALE / 2, y = BOOT_TEXT_Y - base * BOOT_TEXT_SCALE;
                const w = L.text.width * BOOT_TEXT_SCALE, h = L.text.height * BOOT_TEXT_SCALE;
                ctx.save();
                ctx.globalCompositeOperation = "screen";
                ctx.filter = "blur(" + BOOT_TEXT_GLOW_BLUR + "px)";
                ctx.globalAlpha = BOOT_TEXT_GLOW_ALPHA;
                ctx.drawImage(L.text, x, y, w, h);
                ctx.restore();
                ctx.save();
                ctx.filter = "blur(" + BOOT_TEXT_SOFTNESS + "px)";
                ctx.globalAlpha = BOOT_TEXT_ALPHA;
                ctx.drawImage(L.text, x, y, w, h);
                ctx.restore();
            }

            ctx.fillStyle = L.scanlines;
            ctx.fillRect(0, 0, W, H);

            // Grain, jumping irregularly: a new random pattern and offset every 1-2 frames
            if (--grainPick.frames <= 0)
                grainPick = { pattern: Math.floor(Math.random() * L.grain.length), x: Math.floor(Math.random() * 256), y: Math.floor(Math.random() * 256), frames: Math.round(randIn(BOOT_GRAIN_HOLD)) };
            ctx.save();
            ctx.globalAlpha = BOOT_GRAIN_ALPHA;
            ctx.translate(-grainPick.x, -grainPick.y);
            ctx.fillStyle = L.grain[grainPick.pattern];
            ctx.fillRect(0, 0, W + 256, H + 256);
            ctx.restore();
        }

        // Title screen, with the gummy's crossing when one is on. PRESS START only shows
        // up once everything else is in place (see homeReady), and fades in over
        // HOME_MENU_FADE_T; after a press it reads PRESS_MESSAGE_LINES for a while,
        // centered on the same spot.
        function drawHome() {
            if (crossingTime >= 0) drawCrossing();
            else drawHomeScene(null);

            if (homeReady()) {
                const P = HOME_PRESS_START;
                ctx.globalAlpha = Math.min(1, homeMenuTime / HOME_MENU_FADE_T);
                ctx.font = P.font;
                ctx.textAlign = "left";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = P.color;
                if (pressMessageTime > 0) {
                    const cx = P.x + ctx.measureText(P.text).width / 2;
                    ctx.font = PRESS_MESSAGE_FONT;
                    // capitals are as tall as the font size: the middle of PRESS START, then the
                    // first baseline that puts the middle of the whole block there
                    const middle = P.y - parseInt(P.font) / 2, px = parseInt(PRESS_MESSAGE_FONT);
                    const first = Math.round(middle - ((PRESS_MESSAGE_LINES.length - 1) * PRESS_MESSAGE_LINE_H + px) / 2 + px);
                    PRESS_MESSAGE_LINES.forEach((line, i) => {
                        const y = first + i * PRESS_MESSAGE_LINE_H;
                        ctx.fillText(line, Math.round(cx - ctx.measureText(line).width / 2), y);
                    });
                } else {
                    ctx.fillText(P.text, P.x, P.y);
                }
                ctx.globalAlpha = 1;
            }

            // Just after ENTER: the LOADING screen fading away, gently (eased in and out)
            if (bootFade) {
                const p = bootFadeTime / BOOT_TO_HOME_T;
                ctx.globalAlpha = 1 - p * p * (3 - 2 * p);
                ctx.drawImage(bootFade, 0, 0);
                ctx.globalAlpha = 1;
            }
        }

        /* ---------------------------------------------------------------------
           THE CROSSING — a portal opens on the left, the gummy runs out of it, in
           front of the meditating samurai, into the portal on the right; both close.
           The gummy is clipped to the space BETWEEN the two portal centers: that
           is what makes him come out of the first one and vanish into the second.
           --------------------------------------------------------------------- */

        function gummyWidth() { return slotW(runSlot(1), 74); }
        function gummyRunSlot(t) { return runSlot(Math.floor(t * RUN_FPS) % runFrameCount() + 1); }

        // 0..1 size of a portal: opens from openAt, closes from closeAt
        function portalScale(t, openAt, closeAt) {
            const open = (t - openAt) / PORTAL_OPEN_T;
            const close = 1 - (t - closeAt) / PORTAL_OPEN_T;
            return Math.max(0, Math.min(1, open, close));
        }

        // Portal frames actually delivered (the swirl loops over what exists)
        function portalFrameCount() {
            return loadedFrames("Portal/portal", PORTAL_FRAME_COUNT);
        }

        // A portal — the swirl's frame for time t — centered on (cx, PORTAL_CENTER_Y):
        // native size once open, scaled around its center while it opens / closes (no
        // smoothing, so it stays pixelated); flip mirrors it (see PORTAL_*_FLIP)
        function drawPortal(cx, s, flip, t) {
            if (s <= 0) return;
            const n = portalFrameCount();
            const img = n ? assets["Portal/portal_" + (Math.floor(t * PORTAL_FPS) % n + 1)] : null;
            const pw = img ? img.width : 100, ph = img ? img.height : 156;
            const cy = PORTAL_CENTER_Y;
            if (!img) {
                ctx.fillStyle = "#5a2ab0"; // placeholder: a purple oval
                ctx.beginPath();
                ctx.ellipse(cx, cy, pw / 2 * s, ph / 2 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                return;
            }
            const w = Math.round(pw * s), h = Math.round(ph * s);
            const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
            ctx.save();
            ctx.translate(flip ? x + w : x, y);
            if (flip) ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, w, h);
            ctx.restore();
        }

        function drawCrossing() {
            const tl = crossingTimeline();
            const t = crossingTime;
            const rt = t - tl.run;                                           // time since the gummy set off
            const x = PORTAL_LEFT_X - gummyWidth() + CROSSING_GUMMY_SPEED * rt; // its left edge
            const running = t >= tl.run && t < tl.arrive;
            // The samurai opens an eye as the gummy comes in front of him, until the right portal has closed
            const peek = t >= tl.eyeOpen && t < tl.end;

            drawHomeScene(() => {
                drawPortal(PORTAL_LEFT_X, portalScale(t, 0, tl.leftClose), PORTAL_LEFT_FLIP, t);
                drawPortal(PORTAL_RIGHT_X, portalScale(t, tl.rightOpen, tl.arrive), PORTAL_RIGHT_FLIP, t);
                if (!running) return;
                const slot = gummyRunSlot(rt);
                ctx.save();
                ctx.beginPath();
                ctx.rect(PORTAL_LEFT_X, 0, PORTAL_RIGHT_X - PORTAL_LEFT_X, H);
                ctx.clip();
                if (!drawNative(slot, x, GROUND_Y - slotH(slot, 0))) {
                    ctx.fillStyle = "#e01010"; // placeholder gummy
                    ctx.fillRect(Math.round(x), GROUND_Y - PLAYER_H, PLAYER_W, PLAYER_H);
                }
                ctx.restore();
            }, peek);
        }

        /* =====================================================================
           MAIN LOOP
           ===================================================================== */

        let lastTime = performance.now();

        function loop(now) {
            // Delta time in seconds, clamped so a background tab doesn't teleport the game.
            // Never below 0: the first frame's timestamp can come from just BEFORE the script
            // read lastTime, and a negative step would run the clocks backwards.
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            dt = Math.max(0, Math.min(dt, 0.05));

            mixTick();
            cursorTick(dt);
            // Blocked (phone / tablet / tiny window): the world is frozen and nothing is
            // drawn, so coming back to a big enough window resumes exactly where it was.
            if (!blocked) {
                update(dt);
                draw();
                glowCtx.drawImage(canvas, 0, 0, glow.width, glow.height); // feed the backlight
            }
            requestAnimationFrame(loop);
        }

        initHomeScene();     // the title screen's leaves and koi
        updateDesktopGate(); // decide up front whether this device gets the game at all
        requestAnimationFrame(loop);
    </script>
</body>

</html>
