<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>DGM — Demon Got Me (prototype)</title>
    <!-- PRESS START on the title screen is set in Press Start 2P, LOADING / ENTER in VT323 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=block" rel="stylesheet">
    <style>
        /* Black page, canvas centered: whatever the window's shape, the space the
           16:9 game doesn't fill shows as black bars */
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            /* prevents mobile scroll/zoom while tapping */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The screen: the game canvas, with its backlight glowing behind it */
        #screen {
            position: relative;
            flex-shrink: 0;
        }

        #game {
            /* Display size: the FIRST value below — 40vw = 40% of the window's width
               (1920-wide window -> 768x432). It follows the window when it is
               resized, always 16:9. The calc() only stops it from overflowing a
               very wide, very short window. The game is still 1280x720 inside;
               this is only how big it is shown. The rest stays black. */
            width: min(40vw, calc(100vh * 16 / 9));
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
            position: relative;   /* drawn above #glow */
            image-rendering: pixelated;
            outline: none;
            /* ARCADE LOOK — brightness, contrast and color punch of the whole picture
               (1 = untouched). Display only: the art files are not changed. */
            filter: brightness(1.12) contrast(1.08) saturate(1.25);
        }

        /* The LOADING screen has its own CRT look, drawn in code (see BOOT_* in the script):
           no arcade filter on it, only this overall brightness (1 = as drawn) */
        #game.boot {
            filter: brightness(1);
        }

        /* BACKLIGHT — a tiny live copy of the screen, blown up and blurred behind it:
           the game's own colors glow out onto the black around it, as if the light
           came from behind the screen. */
        #glow {
            position: absolute;
            left: 0;              /* same spot and size as the screen: the blur spreads it past the edges */
            top: 0;
            width: 100%;          /* bigger = spreads further (then left/top = -(width - 100%) / 2 to stay centered) */
            height: 100%;
            filter: blur(48px) saturate(1.6) brightness(1.1); /* softness, color, strength */
            opacity: 0.7;         /* 0 = no glow, 1 = full */
            pointer-events: none;
        }

        /* --- Desktop gate: shown instead of the game on phones and tablets
     (see updateDesktopGate). --- */
        #gate {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            font-family: "Courier New", ui-monospace, monospace;
            text-align: center;
            text-transform: uppercase;
            z-index: 10;
        }

        #gate[hidden] {
            display: none;
        }

        #gate .gate-line {
            font-size: 15px;
            letter-spacing: 1px;
            line-height: 1.6;
            max-width: 30ch;
        }

        /* Blinking cursor, because this is an arcade console after all */
        #gate .gate-caret {
            animation: gate-blink 1s steps(1) infinite;
        }

        @keyframes gate-blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Shown instead of the game on anything that is not a desktop/laptop -->
    <div id="gate" hidden>
        <div class="gate-line">
            Full Send is currently playable on desktop only
            <span class="gate-caret">_</span>
        </div>
    </div>

    <!-- The game screen (1280x720, the art is drawn on it 1:1) and its backlight -->
    <div id="screen">
        <canvas id="glow" width="160" height="90"></canvas>
        <canvas id="game" class="boot" width="1280" height="720"></canvas>
    </div>

    <script>
        "use strict";

        /* =====================================================================
           TUNABLE CONSTANTS — everything you might want to tweak lives here.
           All speeds are in pixels/second, all durations in seconds.
           ===================================================================== */

        // --- Screen ---
        // The game screen is 1280x720 (16:9). The canvas IS the screen: the art is
        // drawn on it 1:1. How big it is SHOWN is set in the canvas CSS (base size,
        // shrinks with a smaller window, always 16:9, centered, black around).
        const W = 1280;                    // must match the <canvas> tag
        const H = 720;
        const LOADING_MIN_T = 3.0;         // the LOADING screen stays up at least this long (s)
        const LOADING_MAX_T = 6.0;         // ...and stops waiting for slow images after this (s)
        const LOADING_HOLD_T = 0.25;       // once everything is in, LOADING stays this long before ENTER replaces it (s)

        // --- LOADING screen: the frog on its lily pad (assets/loading screen/), through an old CRT ---
        // Measured on "Loading Screen.png". Once loading is done, ENTER replaces LOADING and
        // the screen waits for a click (or a key) anywhere: that first press turns the sound on.
        // A soft CRT, not TV static: everything below is drawn in code, the frames are never changed.
        const BOOT_BG = "#0b0c1a";         // very dark navy, a little darker than the reference's #0e0f1d:
        // the grain lifts it back to it
        const BOOT_BG_NOISE = 2;           // background texture: each pixel +- up to this (0..255)
        const BOOT_VIGNETTE = 0.3;         // how dark the corners get (0 = no vignette)
        // The frames: Frog_0023_1 .. Frog_0000_24, all on one 300x300 canvas (frame n = Frog_(24-n)_n).
        // How long each one stays up (s), in order; 0 = a single screen refresh, as fast as it goes.
        const FROG_FRAME_T = [...Array(14).fill(0.1), ...Array(10).fill(0)];
        const FROG_POS = { x: 489, y: 158 }; // top-left of the 300x300 frames: the frog lands on the reference's
        // The frog: contrast, brightness and saturation brought down a touch (1 = as drawn)
        const FROG_FILTER = "contrast(0.88) brightness(0.94) saturate(0.85)";
        // Its light bleed: a blurred copy underneath, added as light (so its dark outline casts no
        // shadow): a green glow around the frog, a pink / red one around the lily pad
        const FROG_GLOW_BLUR = 8;          // px
        const FROG_GLOW_ALPHA = 0.24;
        // LOADING / ENTER: VT323 drawn small then enlarged pixel for pixel, in a faded blue-grey white
        const BOOT_TEXT_PX = 20;           // the font size it is drawn at...
        const BOOT_TEXT_SCALE = 2;         // ...then enlarged this much (whole pixels): 22px capitals
        const BOOT_TEXT_Y = 490;           // baseline on screen (px), centered on the screen
        const BOOT_TEXT_COLOR = "#c9d2e0";
        const BOOT_TEXT_ALPHA = 0.85;
        const BOOT_TEXT_GLOW_BLUR = 3;     // its soft glow (px)...
        const BOOT_TEXT_GLOW_ALPHA = 0.3;  // ...this strong
        const BOOT_DOT_T = 0.35;           // LOADING's dots come one by one, this often (s); ENTER only
        // replaces it once the third one has been up for as long
        // The screen itself
        const BOOT_SOFTNESS = 0.6;         // the whole picture, very slightly blurred (px)
        const BOOT_BLOOM_BLUR = 3;         // bright parts bleeding a little: the picture blurred, added as light (px)...
        const BOOT_BLOOM_ALPHA = 0.06;     // ...this much
        const BOOT_SCANLINE_ALPHA = 0.025; // a barely visible dark line on every 3rd row
        const BOOT_GRAIN_ALPHA = 0.03;     // fine grey grain over EVERYTHING (frog and text included)...
        const BOOT_GRAIN_SPREAD = 64;      // ...each grain pixel within +- this of mid-grey (0..127: lower = softer)
        const BOOT_GRAIN_HOLD = [1, 2];    // ...jumping to a new random pattern every 1 or 2 frames

        // --- Title screen: the forest ---
        // Everything comes from "Master Home Screen.psd": each image is named after its
        // layer and keeps its PSD position. Most layers are exported at
        // the full 1280x720 canvas, so they are drawn at (0, 0); the few trimmed ones
        // (tobi, samurai, eye) carry their PSD position. Pixel art drawn 1:1, never
        // scaled. Listed back to front.
        // drift = the clouds creep right to left (px/s, the furthest one slowest) and come
        // back in from the right once fully gone.
        // leavesBehind = the far falling leaves are drawn right before this layer, so
        // they vanish behind it.
        const HOME_BACK_LAYERS = [
            { slot: "sky" },
            { slot: "cloud_4", drift: 3 },
            { slot: "cloud_3", drift: 4 },
            { slot: "cloud_2", drift: 5 },            // its 50% opacity is baked into the file
            { slot: "cloud_1", drift: 6 },
            { slot: "landscape" },                    // the mountains
            // The kite (Lumière crue) circles in a wide, flat loop, starting at its PSD spot
            // heading left. It only turns round where nobody can see it: `left` = its left
            // edge when it turns behind the big trunk in the middle of the forest (the only
            // spot of the sky where the trees hide it whole), `right` = off the screen.
            // ry = how much higher it flies on the way back (px), period = one loop (s).
            { slot: "tobi", x: 976, y: 111, soar: { left: 758, right: 1284, ry: 14, period: 36 } },
            { slot: "background", leavesBehind: true } // trees, waterfall, bridge (+ the big rock)
        ];
        // The temple on its cliff (in background.png) is far away: nothing ever goes behind
        // it. The kite is drawn again over it wherever it crosses this zone, and no far leaf
        // ever falls through it. Only the temple, its cliff and the far trees in there (the
        // near trees start left of it, right of it and under y 355).
        const HOME_FAR_ZONE = { x: 990, y: 110, w: 190, h: 350 };
        const HOME_FRONT_LAYERS = [
            { slot: "rocks" },
            { slot: "front", y: 530 }                 // the grass ledge (running line) + the pond
        ];
        // WATER, animated by code. water_mask.png marks, pixel for pixel, which pixels
        // of the forest are water (white = water — it can be repainted in Photoshop; the
        // pool under the bridge is exactly river.png). The code draws moving light and
        // dark streaks, keeps only what falls inside the mask, and lays that over the
        // art: the drawing never changes.
        // Each zone has its own flow; a flow's streaks are fixed random seeds.
        const HOME_WATER_FPS = 12;         // the pattern steps this many times per second (retro, not smooth)
        const HOME_WATER_LIGHT = "rgba(235,252,255,0.55)"; // highlight streaks
        const HOME_WATER_DARK = "rgba(0,70,95,0.22)";      // shadow streaks
        const HOME_WATER_FLOWS = {
            // dir: "down" = vertical streaks pouring down, "flow" = short ripples carried
            // down (under the log), "side" = ripples drifting left to right and twinkling.
            // density = streaks per px² of zone, len / speed = ranges (px, px/s), light = share of highlights
            fall: { dir: "down", density: 0.02, len: [6, 18], speed: [80, 140], light: 0.4 },
            stream: { dir: "flow", density: 0.005, len: [3, 9], speed: [6, 14], light: 0.5 }, // same pace as the pond
            ripple: { dir: "side", density: 0.0025, len: [4, 14], speed: [4, 12], light: 0.7 }
        };
        const HOME_WATER_ZONES = [
            { x: 1100, y: 255, w: 72, h: 185, flow: "fall" },     // the waterfall
            { x: 1025, y: 485, w: 100, h: 53, flow: "stream" },   // the pool under the bridge (river.png): flows down to the log
            { x: 1095, y: 578, w: 135, h: 67, flow: "stream" },   // under the log, between the two rocks: flows down
            { x: 0, y: 645, w: 1280, h: 75, flow: "ripple" }      // past the rocks: the whole pond, one current, left to right
        ];
        // The samurai (samurai.png, trimmed) at his PSD spot; katana.png is full-canvas.
        const HOME_SAMURAI = { x: 185, y: 346 };
        // He meditates, barely moving: on every out-breath his head, hands and shoulders
        // sink one pixel, all together — the rows above HOME_BREATH_SPLIT slide down over that
        // row. The seam sits in his chest, well above his legs: his knees start on row 146 and
        // his elbows rest on them, so nothing from there down ever moves.
        const HOME_BREATH_PX = 1;          // 0 = perfectly still
        const HOME_BREATH_SPLIT = 90;      // the row of samurai.png the out-breath covers (chest, under the hands)
        const HOME_BREATH_PERIOD = 1.5;    // one full breath (s): in-breath, then out-breath, half each
        const HOME_BREATH_PAUSE = 2;       // then he stays breathed out this long before the next breath (s)
        // His open eye (eye.png = the PSD's "Oeil" layer): during the crossing he opens it as
        // the gummy comes in front of him and keeps it open until the right portal has closed
        // behind it. HOME_EYE_ALWAYS = true keeps it open, as in the PSD.
        const HOME_EYE = { x: 333, y: 411 };
        const HOME_EYE_ALWAYS = false;
        const HOME_EYE_FROM = 185;         // he opens it once the gummy's center passes this x: his art's left edge (px)
        // Falling leaves: leaf_1 (and now and then a cherry_blossom) drifting down and
        // swaying, mirrored each time the sway turns back (pixel-perfect flip, no
        // rotation). Three depths: BIG front leaves fall in front of the whole forest (and
        // of the samurai) down to the bottom of the screen; SMALL front ones (under
        // HOME_LEAF_SMALL) are a little further back: they go behind the rocks, the ledge,
        // the katana and the samurai, and are gone once they are behind the ledge; FAR
        // ones are smaller and slower and fall BEHIND background.png (only seen through
        // the gaps in the trees). Sizes are whole-pixel, nearest-neighbour. They start
        // where the PSD has them (+ a few far ones), then respawn above the screen.
        // Nothing ever touches: before a leaf is let go, its whole fall is played ahead
        // against the other leaves, the kite, the floating flowers and the tancho's leap,
        // and a spot where it would touch one is not used (it waits above the screen
        // until one is free). A new leaf never comes down where one of the last ones did.
        const HOME_LEAF_START = [          // [center x, center y, size] on the first frame — the PSD's
            [626, 375, 0.67], [612, 186, 0.58], [499, 337, 0.58], [225, 221, 0.58], [128, 350, 0.56], // Leaf .. Leaf 5
            [499, 473, 0.53], [159, 455, 0.83], [1172, 425, 0.47], [985, 592, 0.7]                    // Leaf 6 .. Leaf 9
        ];
        const HOME_BLOSSOM_START = [[813, 581, 1]]; // the PSD's cherry blossom, same format
        const HOME_BLOSSOM_CHANCE = 0.15;  // share of respawning leaves that come back as a cherry blossom
        const HOME_LEAF_FAR_START = 4;     // far leaves on the first frame, at random spots
        const HOME_LEAF_FAR_CHANCE = 0.35; // share of respawning leaves that come back as far ones
        const HOME_LEAF_SIZE = [0.5, 0.85]; // front leaf size range (x leaf_1) — as in the PSD
        const HOME_LEAF_FAR_SIZE = [0.38, 0.46]; // far leaf size range
        const HOME_LEAF_FALL = [28, 48];   // fall speed range at full size (px/s) — scaled with the size
        const HOME_LEAF_SWAY = [16, 40];   // sway amplitude range at full size (px) — ditto
        const HOME_LEAF_SWAY_SPEED = [0.8, 1.4]; // sway speed range (radians/s)
        const HOME_LEAF_GAP = 6;           // the closest a leaf ever comes to anything else that moves (px)
        const HOME_LEAF_SPREAD = 130;      // a new leaf comes down at least this far (px) from...
        const HOME_LEAF_MEMORY = 4;        // ...where the last this many came down
        const HOME_LEAF_SMALL = 0.62;      // front leaves smaller than this (x leaf_1) are the small, further back ones
        const HOME_LEAF_HIDDEN_Y = 555;    // front.png's ledge edge is above this all across (532..554): a small leaf whose top is past it is out of sight (px)
        // The tancho koi is the only one that leaps: out of the pond in an arc, in front of
        // the ledge. Two poses: head up on the way up, then level (head forward) from just
        // before the top of the arc until it is back in the water. It is scaled
        // nearest-neighbour and only turned by quarter turns, so its pixels stay square. It
        // leaps whatever is around (leaves, floating flowers), and splashes when it breaks
        // the water, out and back in. Coming out, water rides up on its head and back
        // (HOME_KOI_WATER_*) and is only thrown off around half the height of the leap.
        const HOME_KOI_JUMPER = "tancho_koi"; // head up in the art
        const HOME_KOI_JUMP_SCALE = 1.25;  // its size (x tancho_koi.png): 102x152 -> 128x190
        const HOME_KOI_JUMP_CX = 601;      // its center at the top of the arc (px) — the master's spot
        const HOME_KOI_JUMP_TOP = 440;     // its highest top edge, as it levels out (px) — under PRESS START
        const HOME_KOI_JUMP_SHIFT = [0, 40, -30, 80, 120]; // it may leap this far (px) from that spot (not further left: the katana)
        const HOME_KOI_JUMP_DX = 80;       // how far it travels sideways during a leap (px)
        const HOME_KOI_WATER_Y = 704;      // water line it leaps from and dives back into (px)
        const HOME_KOI_JUMP_T = 1.5;       // duration of a leap (s)
        const HOME_KOI_LEVEL_AT = 0.4;     // it levels out (head forward) at this share of the leap, and stays level
        const HOME_KOI_JUMP_GAP = [5, 10]; // pause between two leaps (s)
        const HOME_KOI_WATER_DROPS = 22;   // droplets riding up with it
        const HOME_KOI_WATER_OFF = [0.45, 0.65]; // they are thrown off between these shares of the leap's height
        const HOME_KOI_WATER_KEEP = [0.3, 0.5];  // ...keeping this share of its speed, before they fall back
        // Its splashes, coded: droplets thrown up in a crown that fall back into the pond,
        // a white foam burst on the water line and flat ripple rings spreading out.
        const HOME_SPLASH_DROPS = 16;      // droplets per splash
        const HOME_SPLASH_SPEED = [70, 190]; // droplet launch speed range (px/s)
        const HOME_SPLASH_GRAVITY = 520;   // pulls the droplets back down (px/s²)
        const HOME_SPLASH_RING = [18, 70]; // ripple ring half-width, from..to (px)
        const HOME_SPLASH_COLORS = ["#ffffff", "#e6fbff", "#b8ecf7", "#7fd3e6"];
        // Flowers and leaves floating on the pond (the PSD's lily pads and floating leaves).
        // The current carries them left to right, all at the same pace, so they never catch
        // up with one another, and brings them back in from the left once they are gone.
        // They bob with the ripples and slip past the rocks: HOME_POND_TOP is the rock /
        // water edge (from x on, the water starts at y). A flower heading for a rock is eased
        // down in front of it, and one that comes under another one is nudged below it.
        // HOME_POND_TOP was measured on water_mask.png: measure it again if front.png changes.
        const HOME_FLOATERS = [            // PSD spot + size (px), listed top to bottom
            { slot: "dark_floating_leaf", x: 913, y: 649, w: 31, h: 10 },
            { slot: "lily_pad_2", x: 861, y: 665, w: 24, h: 25 },
            { slot: "lily_pad", x: 1047, y: 680, w: 29, h: 14 },
            { slot: "lily_pad_3", x: 376, y: 685, w: 71, h: 17 },
            { slot: "dark_lily_pad", x: 110, y: 685, w: 26, h: 17 },
            { slot: "floating_leaf", x: 877, y: 690, w: 72, h: 12 },
            { slot: "floating_leaf_2", x: 668, y: 697, w: 96, h: 20 },
            { slot: "lily_pad_4", x: 588, y: 701, w: 26, h: 19 }
        ];
        const HOME_FLOAT_SPEED = 6;        // the current (px/s) — the pond's ripples go 4..12
        const HOME_FLOAT_LOOP = 1400;      // one trip of the current (px): a flower is back 120px after leaving on the right
        const HOME_FLOAT_BOB_T = 3.2;      // the ripples lift each flower 1px and back every this many s
        const HOME_FLOAT_EASE = 0.5;       // how gently a flower goes down past a rock (px down per px across)
        const HOME_POND_TOP = [
            [0, 691], [96, 684], [168, 679], [184, 689], [192, 691], [216, 696], [240, 693], [248, 691],
            [256, 696], [288, 691], [296, 700], [320, 708], [328, 679], [464, 681], [472, 679], [632, 677],
            [640, 674], [680, 684], [696, 686], [720, 691], [728, 696], [760, 697], [800, 650], [920, 652],
            [928, 650], [968, 655], [984, 652], [1000, 655], [1008, 660], [1024, 662], [1032, 669], [1064, 667],
            [1072, 669], [1112, 660], [1120, 640], [1184, 645], [1192, 657], [1240, 652], [1248, 662], [1264, 652]
        ];

        // The FULL SEND title (title.png, full canvas): on screen from the start, no slide-in,
        // at the PSD's Title spot — title.png was exported 2px right of it and 24px lower.
        const HOME_TITLE_SHIFT = { x: -2, y: -24 };
        const HOME_LOGO_BOUNCE_PX = 8;     // how far the logo bobs up and down once it has landed (px)
        const HOME_LOGO_BOUNCE_SPEED = 2.4; // logo bob speed (radians/s)
        const HOME_MENU_FADE_T = 0.3;      // PRESS START fades in over this, once the title screen is complete (s)
        // PRESS START, as in the master: plain white Press Start 2P, 26px, left edge / baseline (px)
        const HOME_PRESS_START = { text: "PRESS START", x: 494, y: 429, font: '26px "Press Start 2P"', color: "#ffffff" };
        const MENU_SHADOW = "rgba(15,25,15,0.8)"; // drop shadow under the white menu text on the forest

        // --- The crossing: the gummy runs across the title screen, portal to portal ---
        // A portal opens on the left, the red gummy runs out of it, past the
        // meditating samurai, into a second portal on the right; both close. It plays
        // on its own, again and again, after a random pause each time (PORTAL_GAP).
        const PORTAL_GAP = [5, 10];        // pause before each crossing, picked at random in this range (s)
        const PORTAL_LEFT_X = 115;         // portal centers (px) — the left one where the PSD has it
        const PORTAL_RIGHT_X = 1195;
        const PORTAL_CENTER_Y = 471;       // vertical center of both portals (px, from the PSD)
        const PORTAL_FRAME_COUNT = 50;     // Portal/portal_1..50: the swirl, aligned on one 121x188 canvas
        const PORTAL_FPS = 12;             // swirl speed (frames per second): 50 frames = ~4s
        // Which way each portal leans. Mirroring is lossless on pixel art (a 45°
        // rotation would break its pixel grid), so the orientation is set with flips.
        const PORTAL_LEFT_FLIP = false;    // as drawn: leans "\" (top to the left)
        const PORTAL_RIGHT_FLIP = true;    // mirrored: leans "/" — the pair opens outward
        const PORTAL_OPEN_T = 0.3;         // a portal opens / closes in this long (s)
        const PORTAL_WAIT_T = 0.5;         // the left portal swirls open this long before the gummy comes out (s)
        const PORTAL_HOLD_T = 0.25;        // the left portal stays open this long once the gummy is out (s)
        const CROSSING_GUMMY_SPEED = 460;  // run speed across the screen (px/s)

        // --- The gummy (Gummy_run/gummy_run_1..N), crossing the title screen ---
        const RUN_FPS = 24;                // run cycle speed (frames per second): 30 frames = 1.25s
        const RUN_FRAME_COUNT = 30;        // Gummy_run/gummy_run_1..30 — they share one canvas, feet on its bottom
        // edge and head at the same x, so they play back without any jitter
        const PLAYER_W = 48;               // placeholder gummy (while its frames are missing): width (px)
        const PLAYER_H = 88;               // ...and height (px)
        const GROUND_Y = 560;              // the running line (px from the top of the screen) — the
        // samurai, the katana and the gummy all stand on it

        // --- Menu ---
        // PRESS START does not start anything yet: a press swaps it for this message,
        // same typeface and color, each line centered where PRESS START is, for PRESS_MESSAGE_T.
        // The first line sits on PRESS START's baseline, the next ones below it (they may cross
        // the top of the tancho's leap, y 440: the message is drawn over it).
        const PRESS_MESSAGE_LINES = ["CONGRATS", "YOU'VE FINISHED THE GAME"];
        const PRESS_MESSAGE_FONT = '20px "Press Start 2P"'; // a little smaller than PRESS START (26px)
        const PRESS_MESSAGE_LINE_H = 30;   // baseline to baseline (px): the 20px letters + a 10px gap
        const PRESS_MESSAGE_T = 2;         // how long the message stays up (s)

        /* =====================================================================
           SETUP
           ===================================================================== */

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        // Backlight (#glow in the CSS): a 160x90 copy of every frame, which the CSS blows
        // up and blurs behind the screen
        const glow = document.getElementById("glow");
        const glowCtx = glow.getContext("2d");
        const screenEl = document.getElementById("screen"); // the screen + its backlight

        // F toggles fullscreen
        window.addEventListener("keydown", (e) => {
            if (e.code === "KeyF") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        /* ---------------------------------------------------------------------
           DESKTOP GATE
           The game is played with a keyboard or a mouse: phones and tablets get a
           message instead of the game.
           --------------------------------------------------------------------- */
        const gate = document.getElementById("gate");
        let blocked = false;
        // A touch-only device: no fine pointer and no hover. iPadOS lies about its UA
        // (it claims to be a Mac), so the pointer media queries are the real test and
        // the UA sniff is only a belt-and-braces second opinion.
        function isTouchOnlyDevice() {
            const finePointer = window.matchMedia("(pointer: fine)").matches;
            const canHover = window.matchMedia("(hover: hover)").matches;
            const uaMobile = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile|Silk|Kindle|BlackBerry/i.test(navigator.userAgent);
            const iPadOnMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
            return uaMobile || iPadOnMac || !(finePointer && canHover);
        }

        function isDesktop() {
            return !isTouchOnlyDevice();
        }
        // Re-evaluated on every resize / rotation.
        function updateDesktopGate() {
            blocked = !isDesktop();
            gate.hidden = !blocked;
            screenEl.style.visibility = blocked ? "hidden" : "visible";
        }
        window.addEventListener("resize", updateDesktopGate);
        window.addEventListener("orientationchange", updateDesktopGate);

        /* ---------------------------------------------------------------------
           IMAGE SLOT SYSTEM
           Each visual element tries to load assets/<slot>.png. If the file is
           missing, the game silently draws its colored-shape placeholder instead.
           Drop a PNG into assets/ later and it replaces the shape automatically,
           without touching the code.
           --------------------------------------------------------------------- */
        const ASSET_SLOTS = [
            // LOADING screen: the frog (first, so it shows while the rest loads)
            ...FROG_FRAME_T.map((_, i) => frogSlot(i + 1)),
            // Title screen: the forest, named after its PSD layers (see HOME_BACK_LAYERS & co.)
            "sky", "cloud_1", "cloud_2", "cloud_3", "cloud_4", "landscape", "tobi",
            "background", "rocks", "front", "water_mask",
            "leaf_1", "cherry_blossom", "tancho_koi",
            ...HOME_FLOATERS.map(f => f.slot),
            "title", "katana", "samurai", "eye",
            // The crossing: the portal's swirl and the red gummy's run cycle
            ...Array.from({ length: PORTAL_FRAME_COUNT }, (_, i) => "Portal/portal_" + (i + 1)),
            ...Array.from({ length: RUN_FRAME_COUNT }, (_, i) => runSlot(i + 1))
        ];
        const assets = {}; // only slots whose PNG actually loaded end up in here
        let assetsSettled = 0; // slots that finished loading OR turned out missing (drives the LOADING bar)

        for (const name of ASSET_SLOTS) {
            const img = new Image();
            img.onload = () => { assets[name] = img; assetsSettled++; };
            img.onerror = () => { assetsSettled++; /* file missing: the fallback shape will be drawn, no error */ };
            img.src = "assets/" + name + ".png";
        }
        function allAssetsSettled() { return assetsSettled >= ASSET_SLOTS.length; }

        // Some source images have transparent padding around the artwork. This table
        // (opaque pixel bounds, measured from the PNGs) lets the draw functions below
        // render ONLY the artwork, hugging the visible pixels on all four sides.
        // Re-measure if these images are replaced.
        const SPRITE_TRIM = {
            // Title-screen sprites exported at the full 1280x720 canvas: only their
            // artwork is drawn (moved, scaled, mirrored)
            "leaf_1": { x: 612, y: 360, w: 40, h: 45 },
            "cherry_blossom": { x: 772, y: 276, w: 41, h: 40 },
            "tancho_koi": { x: 550, y: 507, w: 102, h: 152 }
            // Deliberately NOT trimmed: animation frames that share a canvas
            // (Gummy_run/*, Portal/*) — trimming each one separately would make them
            // jitter frame to frame.
        };

        // The part of a slot's image to draw: its SPRITE_TRIM rect (when the image is big
        // enough to hold it: a trimmed export is drawn whole), else the whole image
        function spriteRect(slot, img) {
            const t = SPRITE_TRIM[slot];
            return t && t.x + t.w <= img.width && t.y + t.h <= img.height ? t : { x: 0, y: 0, w: img.width, h: img.height };
        }

        // Draws a slot's artwork at its native size (x scale when given) with its
        // top-left corner on (x, y), snapped to whole pixels; flipX / flipY mirror it in
        // place. False if the image is missing.
        function drawNative(slot, x, y, flipX, flipY, scale) {
            const img = assets[slot];
            if (!img) return false;
            const t = spriteRect(slot, img);
            const w = Math.round(t.w * (scale || 1)), h = Math.round(t.h * (scale || 1));
            x = Math.round(x);
            y = Math.round(y);
            ctx.save();
            ctx.translate(x + (flipX ? w : 0), y + (flipY ? h : 0));
            ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
            ctx.drawImage(img, t.x, t.y, t.w, t.h, 0, 0, w, h);
            ctx.restore();
            return true;
        }

        // Draws a slot's artwork centered on (cx, cy), x scale (nearest-neighbour), turned
        // `quarter` quarter turns clockwise and mirrored left/right if asked. Quarter turns
        // and mirrors only move whole pixels (the drawn width and height must be even).
        function drawTurned(slot, cx, cy, quarter, mirror, scale) {
            const img = assets[slot];
            if (!img) return false;
            const t = spriteRect(slot, img);
            const w = Math.round(t.w * (scale || 1)), h = Math.round(t.h * (scale || 1));
            const c = [1, 0, -1, 0][quarter], s = [0, 1, 0, -1][quarter], m = mirror ? -1 : 1;
            ctx.save();
            ctx.translate(Math.round(cx), Math.round(cy));
            ctx.transform(m * c, s, -m * s, c, 0, 0);
            ctx.drawImage(img, t.x, t.y, t.w, t.h, -w / 2, -h / 2, w, h);
            ctx.restore();
            return true;
        }

        // Artwork size of a slot (its SPRITE_TRIM rect when measured, known even before
        // it loads), or the fallback while it is missing
        function slotW(slot, fallback) { const t = SPRITE_TRIM[slot]; return t ? t.w : assets[slot] ? assets[slot].width : fallback; }
        function slotH(slot, fallback) { const t = SPRITE_TRIM[slot]; return t ? t.h : assets[slot] ? assets[slot].height : fallback; }

        // How many frames of a numbered animation (base_1, base_2, ...) actually loaded,
        // up to max. Counted once every image has settled, then remembered.
        const loadedFrameCounts = {};
        function loadedFrames(base, max) {
            if (base in loadedFrameCounts) return loadedFrameCounts[base];
            let n = 0;
            while (n < max && assets[base + "_" + (n + 1)]) n++;
            if (allAssetsSettled()) loadedFrameCounts[base] = n;
            return n;
        }

        // Screens: "boot" (LOADING) -> "home" (the title screen, for good)
        let state = "boot";
        let bootTime = 0;              // time spent on the LOADING screen (s)
        let bootDoneTime = 0;          // time spent at 100% on the LOADING screen (s)
        let bootReady = false;         // loading is over: ENTER is up, a press goes to the title screen
        let homeMenuTime = 0;          // time since PRESS START appeared (drives its fade-in)
        let pressMessageTime = 0;      // PRESS_MESSAGE_LINES stay up while this is above 0 (s)
        let crossingTime = -1;         // time since the gummy's crossing started (s), -1 = none on screen
        let crossingWait = randIn(PORTAL_GAP); // time before the next crossing (s)
        let gummyStep = 0;             // which of GUMMY_STEP_STARTS the next footstep plays

        /* =====================================================================
           AUDIO — the AudioContext (the sounds themselves are in MIX below)
           ===================================================================== */

        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
            }
            if (!mix && (audioCtx || MIX_ELEMENTS)) buildMix();
            if (audioCtx && audioCtx.state === "suspended" && soundUnlocked) audioCtx.resume();
        }

        // Where the coded sounds go: the SFX bus of the mix (see MIX), or straight out
        // in <audio> mode, which has no buses
        function sfxOutput() { return mix && mix.sfx ? mix.sfx : audioCtx.destination; }

        /* =====================================================================
           MIX — the music and sounds (assets/Music/)
           Two buses, MUSIC and SFX, into MASTER, then a safety limiter so the sum
           never clips. A missing file just stays silent.
           Browsers keep all sound off until the first click / key press: the press on
           ENTER (at the latest) turns it on, before the title screen and its theme.
           ===================================================================== */

        // --- Volumes (0..1): tweak these ---
        const MIX_MASTER = 0.9;            // everything (the limiter adds back ~+0.9 dB)
        const MIX_MUSIC = 0.4;             // MUSIC bus: the theme
        const MIX_SFX = 1.0;               // SFX bus: the scene's sounds
        const MIX_TANCHO_JUMP = 0.25;      // the tancho breaking out of the water
        const MIX_TANCHO_SPLASH = 0.25;    // the tancho diving back in
        const MIX_PORTAL = 0.7;            // a portal opening, humming and closing (coded: see portalSound)
        const PORTAL_REVERB = 0.35;        // how much of the portal goes into its reverb (0 = dry)
        const MIX_GUMMY_STEP = 0.5;        // each of the gummy's footsteps
        const MIX_PRESS_START = 1.0;       // a press on PRESS START
        const MIX_SAMURAI_HM = 1.0;        // the samurai's "hm"s, as he opens his eye on the gummy and once he has closed it
        // --- Feel ---
        const MIX_FADE_IN = 2.5;           // the theme fades in when it starts (s), then never stops
        const MIX_VARY_GAIN = [0.85, 1];   // each splash a little louder or softer (x its volume)...
        const MIX_VARY_RATE = [0.96, 1.04]; // ...and a little higher or lower (playback rate)
        const MIX_PAN = 0.3;               // stereo: a sound at the edge of the screen sits this far to that side (0..1)
        // --- Files and timing ---
        const SOUND_FILES = {
            theme: "Music/theme.mp3",
            tanchoJump: "Music/tancho_koi_jump.wav",
            tanchoSplash: "Music/tancho_koi_splash.wav",
            gummyStep: "Music/gummy_run.wav",
            samuraiHm: "Music/hm.wav",
            pressStart: "Music/press_start.mp3"
        };
        // The theme loops on its own length, not the MP3's: an MP3 carries a little silence
        // before and after the music (the encoder's padding), which some browsers keep when
        // they decode it. Measure THEME_LENGTH again if theme.mp3 changes.
        const THEME_LENGTH = 119.44;       // the music itself (s): theme.wav's exact length
        const MP3_PADDING = 1105 / 48000;  // the silence the MP3 encoder puts before it (s)
        // Where the sound actually hits in each file (s): it is lined up so that this
        // moment, not the start of the file, lands on the frame it goes with.
        const SOUND_HIT = { tanchoJump: 0.065, tanchoSplash: 0.09, gummyStep: 0.008, samuraiHm: 0.004 };
        // gummy_run.wav is a run of steps, one every ~0.1s: they are played ONE AT A TIME, one
        // per foot landing in the run cycle (GUMMY_STEP_FRAMES), so they always match the
        // animation. These are where some of its steps start (s, measured on the file), taken
        // in turn for variety; each plays GUMMY_STEP_LENGTH. Measure again if the file changes.
        const GUMMY_STEP_STARTS = [0.022, 0.13, 0.226, 0.332, 0.436, 0.536, 0.636, 0.742,
            0.842, 0.938, 1.04, 1.146, 1.238, 1.336, 1.436, 1.532];
        const GUMMY_STEP_LENGTH = 0.09;    // s of the file per step
        // The run cycle's frames where a foot lands (Gummy_run/gummy_run_n: its ground contact
        // jumps forward). Measure again if the frames change.
        const GUMMY_STEP_FRAMES = [1, 5, 10, 14, 18, 21, 25, 28];
        // hm.wav holds the samurai's two "hm"s (s, measured on the file): the first one as he
        // opens his eye, the second one as he has closed it again — it starts with a soft
        // breath in, its "hm" comes at 0.90. Measure again if the file changes.
        const SAMURAI_HM_OPEN = { start: 0, length: 0.32 };
        const SAMURAI_HM_CLOSE = { start: 0.76, length: 0.36 };
        // Opened straight from the disk (file://), the browser refuses to load sound files
        // into the Web Audio mix: the sounds then play through plain <audio> elements
        // instead — same volumes, fade-in and timing, only no stereo panning and no limiter.
        const MIX_ELEMENTS = location.protocol === "file:";

        let mix = null;            // {master, music, sfx}: the gain buses (Web Audio), or {} in <audio> mode
        const sounds = {};         // by name (see SOUND_FILES): decoded AudioBuffers, or loaded <audio> elements
        let theme = null;          // the theme once started: its looping source, or its <audio> element
        let themeWanted = false;   // the title screen is up: the theme starts as soon as it is loaded
        let themeFadeT0 = 0;       // <audio> mode: when its fade-in started (performance.now, ms)
        let soundUnlocked = false; // a click / key press has turned sound on

        function buildMix() {
            if (MIX_ELEMENTS) {
                mix = {};
                for (const [name, file] of Object.entries(SOUND_FILES)) {
                    const el = new Audio("assets/" + file);
                    el.preload = "auto";
                    const ready = () => { if (!sounds[name]) { sounds[name] = el; if (name === "theme" && themeWanted) startTheme(); } };
                    el.addEventListener("canplaythrough", ready);
                    el.addEventListener("loadeddata", ready);
                }
                return;
            }
            const limiter = audioCtx.createDynamicsCompressor();
            limiter.threshold.value = -1.5;
            limiter.knee.value = 0;
            limiter.ratio.value = 20;
            limiter.attack.value = 0.003;
            limiter.release.value = 0.25;
            limiter.connect(audioCtx.destination);
            mix = { master: audioCtx.createGain(), music: audioCtx.createGain(), sfx: audioCtx.createGain() };
            mix.master.gain.value = MIX_MASTER;
            mix.music.gain.value = 0;
            mix.sfx.gain.value = MIX_SFX;
            mix.master.connect(limiter);
            mix.music.connect(mix.master);
            mix.sfx.connect(mix.master);
            for (const [name, file] of Object.entries(SOUND_FILES)) {
                fetch("assets/" + file)
                    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                    .then(data => new Promise((ok, fail) => audioCtx.decodeAudioData(data, ok, fail)))
                    .then(buffer => { sounds[name] = buffer; if (name === "theme" && themeWanted) startTheme(); })
                    .catch(() => { /* missing file: that sound stays silent */ });
            }
        }

        // Is sound actually coming out right now?
        function soundRunning() {
            return MIX_ELEMENTS ? !!(theme && !theme.paused) : !!(audioCtx && audioCtx.state === "running");
        }

        // Every click / key press, before the game handles it: turns sound on
        function unlockSound() {
            if (blocked) return;
            soundUnlocked = true;
            ensureAudio();
            if (MIX_ELEMENTS && theme && theme.paused) { themeFadeT0 = performance.now(); theme.play().catch(() => { }); }
        }
        ["pointerdown", "keydown"].forEach(type => window.addEventListener(type, unlockSound, true));

        // The title screen is up: the theme starts from the top, fades in and loops for
        // the rest of the session (seamlessly in Web Audio: the buffer loops sample-exact).
        // No click yet: Web Audio holds it (and its fade) until one; <audio> is started by unlockSound.
        function startTheme() {
            themeWanted = true;
            if (theme || !mix || !sounds.theme) return; // already on, or not loaded yet (buildMix calls this again)
            if (MIX_ELEMENTS) {
                theme = sounds.theme;
                theme.loop = true;
                theme.volume = 0;
                themeFadeT0 = performance.now();
                theme.play().catch(() => { });
                return;
            }
            theme = audioCtx.createBufferSource();
            theme.buffer = sounds.theme;
            // Loop on the music alone: past the MP3's leading silence when the browser kept it
            const pad = sounds.theme.duration > THEME_LENGTH + 0.01 ? MP3_PADDING : 0;
            theme.loop = true;
            theme.loopStart = pad;
            theme.loopEnd = pad + THEME_LENGTH;
            theme.connect(mix.music);
            const t = audioCtx.currentTime;
            mix.music.gain.setValueAtTime(0, t);
            mix.music.gain.linearRampToValueAtTime(MIX_MUSIC, t + MIX_FADE_IN);
            theme.start(t, pad);
        }
        // <audio> mode, every frame: the theme's fade-in
        function mixTick() {
            if (!MIX_ELEMENTS || !theme) return;
            const p = Math.min(1, (performance.now() - themeFadeT0) / 1000 / MIX_FADE_IN);
            theme.volume = Math.min(1, MIX_MASTER * MIX_MUSIC * p);
        }

        // How long before its moment a sound must be started: its hit, plus the time the
        // audio takes to reach the speakers
        function soundLead(name) {
            const out = audioCtx && !MIX_ELEMENTS ? (audioCtx.outputLatency || audioCtx.baseLatency || 0) : 0.03;
            return SOUND_HIT[name] + Math.min(out, 0.1);
        }

        // Plays one scene sound on the SFX bus, panned after x (px on screen), a little
        // different every time. skip = s of the file to jump over (to land its hit right now),
        // length = s of the file to play from there (all of it when omitted).
        function playSfx(name, volume, x, skip, length) {
            const sound = sounds[name];
            if (!mix || !sound || volume <= 0 || !soundRunning()) return;
            const v = volume * randIn(MIX_VARY_GAIN), rate = randIn(MIX_VARY_RATE);
            if (MIX_ELEMENTS) {
                const el = sound.cloneNode();
                el.preservesPitch = false; // the rate moves the pitch too, as in Web Audio
                el.playbackRate = rate;
                try { el.currentTime = Math.max(0, skip || 0); } catch (e) { }
                el.volume = Math.min(1, MIX_MASTER * MIX_SFX * v);
                el.play().catch(() => { });
                if (length) setTimeout(() => el.pause(), length / rate * 1000);
                return;
            }
            const t = audioCtx.currentTime;
            const src = audioCtx.createBufferSource();
            src.buffer = sound;
            src.playbackRate.value = rate;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(v, t + 0.005); // no click, even when started mid-file
            let node = src.connect(gain);
            if (audioCtx.createStereoPanner) {
                const pan = audioCtx.createStereoPanner();
                pan.pan.value = Math.max(-1, Math.min(1, (x / W * 2 - 1) * MIX_PAN));
                node = node.connect(pan);
            }
            node.connect(mix.sfx);
            src.start(t, Math.max(0, skip || 0));
            if (length) {
                const end = t + length / rate;
                gain.gain.setValueAtTime(v, end - 0.01);
                gain.gain.linearRampToValueAtTime(0, end); // no click at the cut either
                src.stop(end);
            }
        }

        // A portal's sound, coded (no file), "kawoosh" style: a blast as it opens (a sub boom
        // dropping away + a burst of noise whose filter slams open), an electric hum rippling
        // like water while it is open, and a suck as it closes (noise swelling through an
        // opening filter, cut dead, with a low thunk). openFor = s from the start of its
        // opening to the start of its closing; x = the portal's spot (px), for the stereo.
        let portalNoise = null;            // 2s of white noise, looped, built on first use
        let portalReverb = null;           // a synthetic hall (decaying noise), shared by the portals
        function portalSound(x, openFor) {
            if (!audioCtx || audioCtx.state !== "running" || MIX_PORTAL <= 0) return;
            const t = audioCtx.currentTime;
            const hold = t + Math.max(openFor, 0.6);   // the hum has swelled up by then
            const closed = hold + PORTAL_OPEN_T;
            if (!portalNoise) {
                portalNoise = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const data = portalNoise.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            }
            if (!portalReverb) {
                const len = Math.floor(audioCtx.sampleRate * 2.4);
                const ir = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const data = ir.getChannelData(ch);
                    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
                }
                portalReverb = audioCtx.createConvolver();
                portalReverb.buffer = ir;
                portalReverb.connect(sfxOutput());
            }
            const gain = (v) => { const g = audioCtx.createGain(); g.gain.value = v; return g; };
            const osc = (type, f) => { const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = f; return o; };
            const filter = (type, f, q) => { const b = audioCtx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
            const noise = () => { const n = audioCtx.createBufferSource(); n.buffer = portalNoise; n.loop = true; return n; };
            const play = (src, from, to, offset) => { src.start(from, offset || 0); src.stop(to); return src; };
            // param: from `a` at time `at`, then exponential ramps through [value, time] pairs
            const ramp = (param, at, a, ...steps) => {
                param.setValueAtTime(a, at);
                for (const [v, time] of steps) param.exponentialRampToValueAtTime(v, time);
            };

            // Everything goes through `out` (the volume), panned to the portal's side, with a reverb send
            const out = gain(MIX_PORTAL);
            let node = out;
            if (audioCtx.createStereoPanner) {
                const pan = audioCtx.createStereoPanner();
                pan.pan.value = Math.max(-1, Math.min(1, (x / W * 2 - 1) * MIX_PAN));
                node = node.connect(pan);
            }
            node.connect(sfxOutput());
            out.connect(gain(PORTAL_REVERB)).connect(filter("lowpass", 2200, 0.7)).connect(portalReverb); // a darker hall

            // Opening blast: the sub boom...
            const boom = osc("sine", 110), boomGain = gain(0);
            ramp(boom.frequency, t, 110, [32, t + 0.6]);
            ramp(boomGain.gain, t, 0.0001, [0.9, t + 0.04], [0.0001, t + 0.7]);
            play(boom, t, t + 0.8).connect(boomGain).connect(out);
            // ...and the burst of noise
            const blast = noise(), blastFilter = filter("lowpass", 300, 0.7), blastGain = gain(0);
            ramp(blastFilter.frequency, t, 300, [2500, t + 0.15], [500, t + 0.9]);
            ramp(blastGain.gain, t, 0.0001, [0.8, t + 0.08], [0.0001, t + 1]);
            play(blast, t, t + 1.05, Math.random()).connect(blastFilter).connect(blastGain).connect(out);

            // The hum while it is open: two saws a little apart through a wobbling low-pass,
            // with a trembling shimmer of noise on top
            const hum = gain(0);
            ramp(hum.gain, t + 0.1, 0.0001, [0.28, t + 0.6]);
            hum.gain.setValueAtTime(0.28, hold);
            hum.gain.exponentialRampToValueAtTime(0.0001, closed);
            hum.connect(out);
            const humFilter = filter("lowpass", 460, 1.5);
            humFilter.connect(hum);
            for (const f of [98, 99.3]) play(osc("sawtooth", f), t, closed + 0.05).connect(humFilter);
            const wobble = play(osc("sine", 0.7), t, closed + 0.05);
            wobble.connect(gain(400)).connect(humFilter.detune);
            const shimmer = noise(), tremble = gain(0.5);
            play(shimmer, t, closed + 0.05, Math.random()).connect(filter("bandpass", 1400, 4)).connect(tremble).connect(gain(0.1)).connect(hum);
            play(osc("sine", 11), t, closed + 0.05).connect(gain(0.5)).connect(tremble.gain);

            // Closing suck, ending as the portal is fully closed...
            const suck = noise(), suckFilter = filter("lowpass", 200, 0.7), suckGain = gain(0);
            ramp(suckFilter.frequency, hold, 200, [1800, closed]);
            ramp(suckGain.gain, hold, 0.0001, [0.5, closed - 0.03], [0.0001, closed + 0.1]);
            play(suck, hold, closed + 0.12, Math.random()).connect(suckFilter).connect(suckGain).connect(out);
            // ...and the thunk
            const thunk = osc("sine", 70), thunkGain = gain(0);
            ramp(thunk.frequency, closed, 70, [28, closed + 0.3]);
            ramp(thunkGain.gain, closed, 0.0001, [0.7, closed + 0.03], [0.0001, closed + 0.35]);
            play(thunk, closed, closed + 0.4).connect(thunkGain).connect(out);
        }

        /* =====================================================================
           SCREEN FLOW & INPUT — any press on the title screen: Space / Enter / click / tap
           ===================================================================== */

        // --- Screen flow helpers ---
        function goHome() { state = "home"; homeMenuTime = 0; canvas.classList.remove("boot"); }
        // The home screen is "complete" once every image has either loaded or been ruled
        // missing, and its font is in (see homeReady). PRESS START only appears — and only
        // responds — after that, and the theme starts then.
        // The title screen's font: once its stylesheet is in, load the face itself; if it
        // never comes (offline), give up after LOADING_MAX_T and use the fallback.
        let fontSettled = false;
        window.addEventListener("load", () => {
            const done = () => { fontSettled = true; };
            if (document.fonts) document.fonts.load(HOME_PRESS_START.font, HOME_PRESS_START.text).then(done, done);
            else done();
        });
        setTimeout(() => { fontSettled = true; }, LOADING_MAX_T * 1000);
        function homeReady() { return allAssetsSettled() && fontSettled; }

        // Key moments of a crossing (s since it started), from the constants above
        // and the gummy's own width:
        //   0 .. run          the left portal opens, and swirls PORTAL_WAIT_T before he comes out
        //   .. leftClose      the gummy is fully out of it, it closes behind him
        //   rightOpen         the right portal opens ~1s before he gets there
        //   .. arrive         he is fully inside it, it closes
        //   end               both portals are closed: the next pause starts
        //   eyeOpen .. end    the samurai has an eye open: from the gummy's center passing HOME_EYE_FROM
        function crossingTimeline() {
            const gw = gummyWidth();
            const run = PORTAL_OPEN_T + PORTAL_WAIT_T;
            const arrive = run + (PORTAL_RIGHT_X - PORTAL_LEFT_X + gw) / CROSSING_GUMMY_SPEED;
            const leftClose = run + gw / CROSSING_GUMMY_SPEED + PORTAL_HOLD_T;
            const rightOpen = Math.max(0, arrive - 1.0 - PORTAL_OPEN_T);
            const eyeOpen = run + (HOME_EYE_FROM - PORTAL_LEFT_X + gw / 2) / CROSSING_GUMMY_SPEED;
            return { run, leftClose, rightOpen, arrive, eyeOpen, end: arrive + PORTAL_OPEN_T };
        }

        // Waits a random PORTAL_GAP, plays one crossing, and again
        function updateCrossing(dt) {
            if (crossingTime < 0) {
                if ((crossingWait -= dt) > 0) return;
                crossingTime = 0;
                portalSound(PORTAL_LEFT_X, crossingTimeline().leftClose);
                return;
            }
            const before = crossingTime;
            crossingTime += dt;
            const tl = crossingTimeline();
            if (before < tl.rightOpen && crossingTime >= tl.rightOpen) portalSound(PORTAL_RIGHT_X, tl.arrive - tl.rightOpen);
            // The samurai's "hm"s, started early so they are heard as his eye opens, and as it
            // closes again (with the right portal: the end of the crossing)
            const hmLead = soundLead("samuraiHm");
            for (const [at, hm] of [[tl.eyeOpen, SAMURAI_HM_OPEN], [tl.end, SAMURAI_HM_CLOSE]])
                if (before < at - hmLead && crossingTime >= at - hmLead)
                    playSfx("samuraiHm", MIX_SAMURAI_HM, HOME_EYE.x, hm.start, hm.length);
            // A footstep on every frame of the run where a foot lands, started early so it is
            // heard as that frame shows, panned after where the gummy is then
            const lead = soundLead("gummyStep");
            const frameAt = time => Math.floor((time - tl.run) * RUN_FPS); // run frames shown so far, 0 = the first
            for (let f = Math.max(0, frameAt(before + lead) + 1); f <= frameAt(crossingTime + lead); f++) {
                const at = tl.run + f / RUN_FPS;
                if (at >= tl.arrive) break;
                if (!GUMMY_STEP_FRAMES.includes(f % runFrameCount() + 1)) continue;
                const x = PORTAL_LEFT_X - gummyWidth() / 2 + CROSSING_GUMMY_SPEED * (at - tl.run);
                const start = GUMMY_STEP_STARTS[gummyStep++ % GUMMY_STEP_STARTS.length];
                playSfx("gummyStep", MIX_GUMMY_STEP, x, start - SOUND_HIT.gummyStep, GUMMY_STEP_LENGTH);
            }
            if (crossingTime >= tl.end) {
                crossingTime = -1;
                crossingWait = randIn(PORTAL_GAP);
            }
        }

        // Any press (key, click, tap — anywhere). On the title screen, PRESS START is
        // not wired to a game yet, so it plays its sound and shows PRESS_MESSAGE_LINES instead
        function pressButton() {
            // LOADING screen: nothing until ENTER is up, then any press goes to the title screen
            // (unlockSound has just turned the sound on)
            if (state === "boot") { if (bootReady) goHome(); return; }
            if (!homeReady()) return; // PRESS START is not up yet
            if (pressMessageTime > 0) return; // the message is up: PRESS START is back once it is gone
            playSfx("pressStart", MIX_PRESS_START, W / 2);
            pressMessageTime = PRESS_MESSAGE_T;
        }

        window.addEventListener("keydown", (e) => {
            if (blocked) return; // the "get a PC" screen swallows every input
            if (!["Space", "Enter", "ArrowUp"].includes(e.code)) return;
            e.preventDefault();
            if (e.repeat) return;
            pressButton();
        });
        window.addEventListener("pointerdown", (e) => { if (blocked) return; e.preventDefault(); pressButton(); }); // mouse, pen and touch

        /* =====================================================================
           RANDOM HELPERS
           ===================================================================== */

        function rand(min, max) { return min + Math.random() * (max - min); }
        function randIn(range) { return rand(range[0], range[1]); } // range = [min, max]

        function update(dt) {
            if (state === "home") updateHomeScene(dt); // the forest keeps living

            if (state === "boot") {
                if (!mix) ensureAudio(); // the sounds start loading now (they stay silent until a click)
                // The LOADING screen waits for the images, with a floor and a ceiling on
                // how long it stays, then holds a beat; ENTER replaces LOADING at the end of a
                // round of dots (all three shown), never in the middle of one.
                const before = bootTime, round = BOOT_DOT_T * 4;
                bootTime += dt;
                updateFrog(dt);
                if (loadingProgress() >= 1) bootDoneTime += dt;
                const loaded = bootDoneTime >= LOADING_HOLD_T || bootTime >= LOADING_MAX_T;
                if (loaded && Math.floor(bootTime / round) > Math.floor(before / round)) bootReady = true;
            } else if (state === "home" && homeReady()) {
                homeMenuTime += dt; // PRESS START fades in
                if (!themeWanted) startTheme(); // the title screen is fully up: the theme starts
                if (pressMessageTime > 0) pressMessageTime -= dt;
                updateCrossing(dt);
            }
        }

        /* =====================================================================
           DRAWING
           ===================================================================== */

        function draw() {
            ctx.imageSmoothingEnabled = false; // pixel art: a scaled sprite stays crisp, never blurred
            drawScreen();
        }

        // One screen, drawn in coordinates 0..W x 0..H
        function drawScreen() {
            if (state === "boot") drawBoot();
            else drawHome();
        }

        // Draws text in a chunky PIXELATED style: rendered small on an offscreen
        // canvas, then blown up with image smoothing disabled.
        const pixelCanvas = document.createElement("canvas");
        const pixelCtx = pixelCanvas.getContext("2d");
        function drawPixelText(text, cx, cy, smallPx, scaleFactor, color) {
            pixelCtx.font = "bold " + smallPx + "px monospace";
            const tw = Math.ceil(pixelCtx.measureText(text).width) + 4;
            const th = smallPx + 6;
            pixelCanvas.width = tw;  // resizing also clears the offscreen canvas
            pixelCanvas.height = th;
            pixelCtx.font = "bold " + smallPx + "px monospace"; // re-set after the resize
            pixelCtx.textAlign = "left";
            pixelCtx.textBaseline = "top";
            pixelCtx.fillStyle = color;
            pixelCtx.fillText(text, 2, 2);
            ctx.save();
            ctx.imageSmoothingEnabled = false; // this is what makes the pixels chunky
            ctx.drawImage(pixelCanvas, cx - (tw * scaleFactor) / 2, cy - (th * scaleFactor) / 2, tw * scaleFactor, th * scaleFactor);
            ctx.restore();
        }

        // The gummy's run cycle frames sit in their own folder, like the portal's: Gummy_run/gummy_run_n
        function runBase() { return "Gummy_run/gummy_run"; }
        function runSlot(n) { return runBase() + "_" + n; }

        // Run frames actually delivered: the loop cycles over what exists (none = placeholder).
        function runFrameCount() {
            return loadedFrames(runBase(), RUN_FRAME_COUNT) || RUN_FRAME_COUNT;
        }

        /* =====================================================================
           TITLE SCREEN — the forest
           The still layers back to front (HOME_BACK_LAYERS, the waterfall loop,
           HOME_FRONT_LAYERS), then what lives in them: falling leaves, the
           meditating samurai and his katana, the tancho koi. Everything is drawn at its
           native size on whole pixels, so the pixel art stays crisp.
           ===================================================================== */

        const HOME_SPLASH_T = 0.9;   // how long a koi splash lasts (s)

        // --- The living scene. Set up once at load, then animated on the title
        //     screen, the gummy's crossings included. ---
        let homeSceneTime = 0;     // the scene's own clock (s)
        let leaves = [];           // {cx, y, w, h, fall, sway, speed, phase, far, slot, size, wait} — cx = center of the sway
        let leafSpawnXs = [];      // where the last leaves came down (center x), newest last
        let tanchoWater = [];      // the droplets riding up with the tancho, then thrown off (see HOME_KOI_WATER_*)
        let koiJump = null;        // the tancho's leap in progress {t, x0, dir}, or null
        let koiJumpWait = 2.5;     // time before the next leap (s) — the first one comes early
        let splashes = [];         // see makeSplash: where the tancho broke the water
        let floatClear = [];       // per floater, per x: how low the rocks make it sit (see pondClearance)
        let lookCache = [], lookTime = -1; // sceneAt's answers, for the current frame

        const HOME_LOOK_STEP = 0.1; // s between two looks when a path is played ahead
        // Are rects {x, y, w, h} a and b closer than gap px?
        function rectsNear(a, b, gap) {
            return a.x < b.x + b.w + gap && b.x < a.x + a.w + gap && a.y < b.y + b.h + gap && b.y < a.y + a.h + gap;
        }

        // The kite at time t ({x, y, w, h}, flip = flying right: the art faces left): on
        // the flat loop set by its `soar`, through its PSD spot, turning round at soar.left
        // (behind the trunk) and soar.right (off the screen)
        const HOME_TOBI = HOME_BACK_LAYERS.find(L => L.soar);
        function tobiAt(t) {
            const L = HOME_TOBI, s = L.soar;
            const cx = (s.left + s.right) / 2, rx = (s.right - s.left) / 2;
            const a0 = Math.acos((L.x - cx) / rx); // its PSD spot on the loop, heading left
            const a = a0 + t * Math.PI * 2 / s.period;
            return {
                x: cx + rx * Math.cos(a), y: L.y + s.ry * (Math.sin(a) - Math.sin(a0)),
                w: slotW(L.slot, 38), h: slotH(L.slot, 38), flip: Math.sin(a) < 0
            };
        }

        // --- The pond's floating flowers (see HOME_FLOATERS) ---
        const pondTopCol = new Int16Array(W); // HOME_POND_TOP, one value per column
        HOME_POND_TOP.forEach(([x, y], i) => pondTopCol.fill(y, x, i + 1 < HOME_POND_TOP.length ? HOME_POND_TOP[i + 1][0] : W));
        // The highest a floater w px wide, left edge on x, may sit (its top edge, px): under
        // the rock / water edge all along it, and eased down on its way there
        function pondClearance(x, w) {
            const reach = (H - 640) / HOME_FLOAT_EASE; // the pond's rock edges are all below y 640
            let y = 0;
            for (let c = Math.floor(x - reach); c <= x + w + reach; c++) {
                const d = c < x ? x - c : c > x + w ? c - x - w : 0;
                y = Math.max(y, pondTopCol[Math.max(0, Math.min(W - 1, c))] - d * HOME_FLOAT_EASE);
            }
            return Math.ceil(y);
        }
        // Do floaters a and b share columns, counting the current's loop (one that just
        // left on the right is also about to come in on the left)?
        function loopOverlapX(a, b) {
            const d = ((b.x - a.x) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP;
            return d < a.w || HOME_FLOAT_LOOP - d < b.w;
        }
        // Every floater at time t: [{slot, x, y, w, h}], in HOME_FLOATERS order
        function floatersAt(t) {
            const off = HOME_FLOAT_LOOP - W;
            const out = HOME_FLOATERS.map((f, i) => {
                const x = ((f.x + off + HOME_FLOAT_SPEED * t) % HOME_FLOAT_LOOP + HOME_FLOAT_LOOP) % HOME_FLOAT_LOOP - off;
                const bob = Math.sin(t * Math.PI * 2 / HOME_FLOAT_BOB_T - x / 40) > 0 ? -1 : 0; // the ripple runs with the current
                return { slot: f.slot, x, y: Math.max(f.y + bob, floatClear[i][Math.floor(x) + off]), w: f.w, h: f.h };
            });
            // one that comes under another one (listed before it) is nudged below it
            for (let i = 1; i < out.length; i++)
                for (let j = 0; j < i; j++)
                    if (loopOverlapX(out[i], out[j])) out[i].y = Math.max(out[i].y, out[j].y + out[j].h);
            return out;
        }

        // --- The tancho's leap j = {x0, dir}: x0 = its center as it leaves the water ---
        // At time t into the leap: {x, y, w, h} = what shows above the water, cx / cy = its
        // center, quarter = quarter turns (0 head up, 1 level); null under water
        function tanchoSize() {
            return {
                w: Math.round(slotW(HOME_KOI_JUMPER, 102) * HOME_KOI_JUMP_SCALE),
                h: Math.round(slotH(HOME_KOI_JUMPER, 152) * HOME_KOI_JUMP_SCALE)
            };
        }
        // How high the arc lifts it (px), so that its top is on JUMP_TOP when it levels out
        function tanchoRise() {
            const up = HOME_KOI_LEVEL_AT;
            return (HOME_KOI_WATER_Y - HOME_KOI_JUMP_TOP) / (4 * up * (1 - up));
        }
        function tanchoAt(j, t) {
            if (t < 0 || t > HOME_KOI_JUMP_T) return null;
            const { w, h } = tanchoSize(), up = HOME_KOI_LEVEL_AT;
            const p = t / HOME_KOI_JUMP_T, rise = tanchoRise();
            const cx = j.x0 + j.dir * HOME_KOI_JUMP_DX * p;   // a ballistic arc
            const cy = HOME_KOI_WATER_Y + h / 2 - rise * 4 * p * (1 - p);
            const quarter = p < up ? 0 : 1;
            const rw = quarter === 1 ? h : w, rh = quarter === 1 ? w : h; // level: lying on its side
            const top = cy - rh / 2;
            if (top >= HOME_KOI_WATER_Y) return null;
            return { x: cx - rw / 2, y: top, w: rw, h: Math.min(rh, HOME_KOI_WATER_Y - top), cx, cy, quarter };
        }

        // --- Falling leaves ---
        // A new falling leaf (or cherry blossom), not placed yet. far = falls behind the
        // forest, smaller and slower. slot / size are picked at random when omitted.
        function makeLeaf(far, slot, size) {
            slot = slot || (Math.random() < HOME_BLOSSOM_CHANCE ? "cherry_blossom" : "leaf_1");
            size = size || randIn(far ? HOME_LEAF_FAR_SIZE : HOME_LEAF_SIZE);
            return {
                far, slot, size, cx: 0, y: 0, phase: 0, wait: 0, small: !far && size < HOME_LEAF_SMALL,
                w: Math.round(slotW(slot, 40) * size), h: Math.round(slotH(slot, 45) * size),
                fall: randIn(HOME_LEAF_FALL) * size, sway: randIn(HOME_LEAF_SWAY) * size,
                speed: randIn(HOME_LEAF_SWAY_SPEED)
            };
        }
        // Where a leaf's fall ends: a small one once it is fully behind the ledge, the others off the screen
        function leafEnd(l) { return l.small ? HOME_LEAF_HIDDEN_Y : H; }
        // Where leaf l will be tau s from now
        function leafRect(l, tau) {
            return { x: l.cx + Math.sin(l.phase + l.speed * tau) * l.sway - l.w / 2, y: l.y + l.fall * tau, w: l.w, h: l.h };
        }
        // Everything whose path is known, k looks (HOME_LOOK_STEP) from now: [{r, who}] —
        // the leaves, the kite, the floaters, the tancho's leap in progress
        function sceneAt(k) {
            if (lookTime !== homeSceneTime) { lookTime = homeSceneTime; lookCache = []; }
            if (!lookCache[k]) {
                const tau = k * HOME_LOOK_STEP, t = homeSceneTime + tau, list = [];
                for (const l of leaves) if (!l.wait && l.y + l.fall * tau < leafEnd(l)) list.push({ r: leafRect(l, tau), who: l });
                list.push({ r: tobiAt(t), who: "tobi" });
                for (const f of floatersAt(t)) list.push({ r: f, who: "float" });
                const j = koiJump && tanchoAt(koiJump, koiJump.t + tau);
                if (j) list.push({ r: j, who: "tancho" });
                lookCache[k] = list;
            }
            return lookCache[k];
        }
        // Does leaf l's whole fall, until it is off the screen, keep HOME_LEAF_GAP from all that?
        function leafPathClear(l) {
            for (let k = 0; ; k++) {
                const r = leafRect(l, k * HOME_LOOK_STEP);
                if (r.y >= leafEnd(l)) return true;
                if (l.far && rectsNear(r, HOME_FAR_ZONE, 0)) return false; // never behind the temple
                for (const o of sceneAt(k)) if (o.who !== l && rectsNear(r, o.r, HOME_LEAF_GAP)) return false;
            }
        }
        // Leaf l comes down again as a new one, from just above the screen: away from where
        // the last ones came down, at a spot where its whole fall is clear. If there is no
        // such spot right now, it waits a moment and tries again.
        function dropLeaf(l) {
            Object.assign(l, makeLeaf(Math.random() < HOME_LEAF_FAR_CHANCE));
            l.y = -l.h;
            l.wait = 0.4;
            for (let i = 0; i < 24 && l.wait; i++) {
                const cx = rand(0, W);
                if (leafSpawnXs.some(x => Math.abs(x - cx) < HOME_LEAF_SPREAD)) continue;
                l.cx = cx;
                l.phase = rand(0, Math.PI * 2);
                if (leafPathClear(l)) {
                    l.wait = 0;
                    leafSpawnXs = leafSpawnXs.concat(cx).slice(-HOME_LEAF_MEMORY);
                }
            }
            lookTime = -1; // the scene changed
        }

        function initHomeScene() {
            const off = HOME_FLOAT_LOOP - W;
            floatClear = HOME_FLOATERS.map(f => Int16Array.from({ length: HOME_FLOAT_LOOP }, (_, i) => pondClearance(i - off, f.w)));
            // The leaves: the PSD's where the master has them (only their pace and sway are
            // drawn at random, until their fall is clear), then a few far ones at random
            // spots. One that finds no clear fall comes down later, from above.
            leaves = [];
            const add = make => {
                let l;
                for (let i = 0; i < 40; i++) {
                    l = make();
                    if (leafPathClear(l)) break;
                    l.wait = rand(1, 4);
                }
                leaves.push(l);
                lookTime = -1;
            };
            const starts = HOME_LEAF_START.map(s => ["leaf_1", ...s]).concat(HOME_BLOSSOM_START.map(s => ["cherry_blossom", ...s]));
            for (const [slot, cx, cy, size] of starts)
                add(() => { const l = makeLeaf(false, slot, size); l.cx = cx; l.y = cy - l.h / 2; return l; });
            for (let i = 0; i < HOME_LEAF_FAR_START; i++)
                add(() => { const l = makeLeaf(true); l.cx = rand(0, W); l.y = rand(0, GROUND_Y); l.phase = rand(0, Math.PI * 2); return l; });
        }

        function updateHomeScene(dt) {
            homeSceneTime += dt;

            // Leaves: fall and sway; once out of the screen they come down again from above
            // (a leaf waiting for a clear spot is not on screen)
            for (const l of leaves) {
                if (l.wait > 0) {
                    if ((l.wait -= dt) <= 0) dropLeaf(l);
                    continue;
                }
                l.y += l.fall * dt;
                l.phase += l.speed * dt;
                if (l.y > leafEnd(l)) dropLeaf(l);
            }

            // The tancho: waits, then leaps from a random one of HOME_KOI_JUMP_SHIFT, either
            // way, whatever is around — a splash each way.
            if (koiJump) {
                const before = koiJump.t;
                koiJump.t += dt;
                const dive = HOME_KOI_JUMP_T - soundLead("tanchoSplash"); // started early so its hit lands as it hits the water
                if (before < dive && koiJump.t >= dive) playSfx("tanchoSplash", MIX_TANCHO_SPLASH, koiJump.x0 + koiJump.dir * HOME_KOI_JUMP_DX);
                if (koiJump.t >= HOME_KOI_JUMP_T) {
                    splashes.push(makeSplash(koiJump.x0 + koiJump.dir * HOME_KOI_JUMP_DX, true));
                    koiJump = null;
                    koiJumpWait = randIn(HOME_KOI_JUMP_GAP);
                }
            } else if ((koiJumpWait -= dt) <= 0) {
                const shift = HOME_KOI_JUMP_SHIFT[Math.floor(Math.random() * HOME_KOI_JUMP_SHIFT.length)];
                const dir = Math.random() < 0.5 ? 1 : -1;
                koiJump = { t: 0, dir, x0: HOME_KOI_JUMP_CX + shift - dir * HOME_KOI_JUMP_DX / 2 };
                splashes.push(makeSplash(koiJump.x0, false));
                playSfx("tanchoJump", MIX_TANCHO_JUMP, koiJump.x0, soundLead("tanchoJump")); // its lead-in skipped: the hit is now
                tanchoWater = makeTanchoWater();
                lookTime = -1; // the scene changed (the leaves keep out of its way)
            }
            for (const s of splashes) s.t += dt;
            splashes = splashes.filter(s => s.t < HOME_SPLASH_T);
            updateTanchoWater(dt);
        }

        // Sky, clouds, mountains, forest, the waterfall's current frame, rocks, ground
        function drawHomeBackdrop() {
            ctx.fillStyle = "#56dbfd"; // sky.png's own color, also the placeholder while it loads
            ctx.fillRect(0, 0, W, H);
            for (const L of HOME_BACK_LAYERS) {
                if (L.leavesBehind) drawLeaves("far");
                let x = L.x || 0, y = L.y || 0, flipX = false;
                if (L.drift) {
                    // right to left, back in from the right once fully gone
                    const w = slotW(L.slot, 0), period = W + w;
                    x = -w + ((((x + w - L.drift * homeSceneTime) % period) + period) % period);
                }
                if (L.soar) ({ x, y, flip: flipX } = tobiAt(homeSceneTime)); // flying right: mirrored
                drawNative(L.slot, x, y, flipX);
            }
            // the kite over the temple, where it crosses it (see HOME_FAR_ZONE)
            const kite = tobiAt(homeSceneTime), Z = HOME_FAR_ZONE;
            ctx.save();
            ctx.beginPath();
            ctx.rect(Z.x, Z.y, Z.w, Z.h);
            ctx.clip();
            drawNative(HOME_TOBI.slot, kite.x, kite.y, kite.flip);
            ctx.restore();
            drawLeaves("small"); // further back: behind the rocks and the ledge
            for (const L of HOME_FRONT_LAYERS) drawNative(L.slot, L.x || 0, L.y || 0);
            drawHomeWater();
        }

        // --- Water, animated by code (see HOME_WATER_*) ---
        // The streaks are drawn on an offscreen canvas, cut to water_mask with
        // "destination-in" (only the mask's pixels keep them), then laid over the art.
        // No pixel is ever read back, so it also works when the page is opened as a file.
        const waterCanvas = document.createElement("canvas");
        waterCanvas.width = W;
        waterCanvas.height = H;
        const waterCtx = waterCanvas.getContext("2d");
        let waterStreaks = null;   // one list of seeds per zone, built on first use
        let waterTick = -1;        // the pattern step currently on waterCanvas

        // Small seeded random generator: the same pattern on every load
        function seededRandom(seed) {
            return () => {
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function buildWaterStreaks() {
            const rnd = seededRandom(1234);
            const between = (range) => range[0] + rnd() * (range[1] - range[0]);
            return HOME_WATER_ZONES.map(z => {
                const F = HOME_WATER_FLOWS[z.flow];
                return Array.from({ length: Math.round(z.w * z.h * F.density) }, () => ({
                    x: rnd() * z.w, y: rnd() * z.h, len: Math.round(between(F.len)),
                    speed: between(F.speed), phase: rnd() * Math.PI * 2, light: rnd() < F.light
