// a black wipe brings the actual run in. Press = skip.
// The scripted home sequence. Same page as HOME (clouds, prison, logo), only
// the menu is gone:
//   1. the koala cop rolls in from the right, the runner still idles
//   2. the koala plants himself and stands there
//   3. the runner panics (scared)
//   4. he bolts off to the right, a black wipe closes, the run begins
function drawIntro() {
  const tl = introTimeline();
  const t = introTime;
  const groundY = homeGroundY();

  drawHomeBackdrop();
  drawHomeLogo();

  // The parked police car, still blinking on the same wall clock as on the title
  // screen, so the light bar never stutters when the sequence takes over.
  drawHomeSprite(homeCarSlot(), W * HOME_CAR_FRAC, groundY, HOME_CAR_H, false);

  // --- The koala cop: he walks RIGHT to LEFT and stops roughly facing the
  // runner, well clear of the car. The artwork already faces left, which is his
  // direction of travel, so it is drawn as-is — no mirroring here. ---
  const koalaFrom = W * HOME_KOALA_START_FRAC;
  const koalaTo = W * HOME_KOALA_STOP_FRAC;
  let koalaX, koalaSlot;
  if (t < tl.koalaIn) {
    const p = t / tl.koalaIn;
    const ease = 1 - (1 - p) * (1 - p);            // decelerating arrival
    koalaX = koalaFrom + (koalaTo - koalaFrom) * ease;
    koalaSlot = homeLoopFrame(HOME_KOALA_BASE, HOME_KOALA_FRAMES, HOME_KOALA_FPS, t);
  } else {
    // Planted in front of him, holding up his warrant
    koalaX = koalaTo;
    koalaSlot = "koala_standing";
  }
  drawHomeSprite(koalaSlot, koalaX, groundY, HOME_KOALA_H, false);

  // --- The red character ---
  const charX0 = W * HOME_CHAR_FRAC;
  if (t < tl.koalaStop) {
    // Still idling, unaware
    drawHomeSprite(homeLoopFrame("idle", 4, HOME_IDLE_FPS, homeTime + t),
                   charX0, groundY, HOME_CHAR_H, false);
  } else if (t < tl.scared) {
    // Frozen in panic
    drawHomeSprite("scared", charX0, groundY, HOME_CHAR_H, false);
  } else {
    // Sprinting off to the right, at the SAME size he will have in game
    const rt = t - tl.scared;
    const x = charX0 + HOME_RUNOUT_SPEED * rt;
    drawHomeSprite(homeLoopFrame(HOME_RUN_BASE, RUN_FRAME_COUNT, HOME_RUN_FPS, rt),
                   x, groundY, HOME_CHAR_H, false);
  }

  ctx.fillStyle = "#404040";
  ctx.font = "14px monospace";
  ctx.textAlign = "center";
  ctx.fillText("press to skip", W / 2, H - 16);

  // Black wipe sliding in from the right just before the game starts
  if (t >= tl.wipe) {
    const p = Math.min(1, (t - tl.wipe) / HOME_WIPE_T);
    ctx.fillStyle = "#000";
    ctx.fillRect(W - p * W, 0, p * W, H);
  }
}

// Death sequence, in two beats:
//
//   beat 1  (0 -> DEATH_CATCH_FRAC)
//     The runner is already in his player_hurt pose — die() switches him the
//     instant the collision lands — and he stays frozen in it. A koala sprints
//     in from the LEFT to catch him. The koala artwork faces left by default,
//     but here he is running right, so THIS is where the mirror belongs.
//
//   beat 2  (DEATH_CATCH_FRAC -> 1)
//     The koala reaches him: both vanish on the spot, and gameover_player_1..7
//     plays through once while GAME OVER drops down the screen.
//
// The gameover frames share a 1888x1436 canvas, so they are drawn as FULL frames
// at one fixed size: no trimming, no jitter between them.
function drawDeathSequence() {
  const p = 1 - deathTimer / DEATH_SEQUENCE_DURATION; // 0 -> 1
  const elapsed = DEATH_SEQUENCE_DURATION * p;

  // Light veil only
  ctx.fillStyle = `rgba(10,5,8,${0.35 * p})`;
  ctx.fillRect(0, 0, W, H);

  // A fall into the void leaves player.y far below the screen, so the feet line
  // is clamped to the ground: the sequence must stay visible whatever killed us.
  const cx = player.x + PLAYER_W / 2;
  const feetY = Math.min(player.y + PLAYER_H, GROUND_Y);

  if (p < DEATH_CATCH_FRAC) {
    // ---- Beat 1: the runner lies there, the koala closes in from the left ----
    const kp = p / DEATH_CATCH_FRAC;
    const kEase = kp * (0.75 + 0.25 * kp);       // steady charge, closing a little faster
    const koalaX = W * DEATH_KOALA_FROM + (cx - W * DEATH_KOALA_FROM) * kEase;
    const koalaSlot = homeLoopFrame(HOME_KOALA_BASE, HOME_KOALA_FRAMES, HOME_KOALA_FPS, elapsed);
    // Running RIGHT, against the artwork's own facing => mirrored
    drawHomeSprite(koalaSlot, koalaX, GROUND_Y, DEATH_KOALA_H, true);

    // The runner, thrown and motionless. player_hurt is centered in its
    // square, so it hangs off the hitbox CENTER rather than off the feet.
    const hurt = assets[playerSpritePrefix() + "_hurt"];
    if (hurt) {
      const h = PLAYER_SPRITE_H, w = h * (hurt.width / hurt.height);
      ctx.drawImage(hurt, cx - w / 2, feetY - PLAYER_H / 2 - h / 2, w, h);
    } else {
      ctx.fillStyle = "#c03030";
      ctx.fillRect(cx - PLAYER_W / 2, feetY - PLAYER_H, PLAYER_W, PLAYER_H);
    }
    return; // GAME OVER only starts dropping once he has been caught
  }

  // ---- Beat 2: both are gone, the game-over animation takes over ----
  const tail = (p - DEATH_CATCH_FRAC) / (1 - DEATH_CATCH_FRAC); // 0 -> 1
  const tailElapsed = elapsed - DEATH_SEQUENCE_DURATION * DEATH_CATCH_FRAC;

  // Frames 1..7 play through once, then the last one holds
  const f = Math.min(GAMEOVER_FRAME_COUNT,
                     Math.floor(tailElapsed / GAMEOVER_BEAT_FRAME_T) + 1);
  const dieImg = assets["gameover_player_" + f];
  if (dieImg) {
    // Same fixed height for every frame, anchored on the player's feet line
    const h = PLAYER_SPRITE_H * 1.25, w = h * (dieImg.width / dieImg.height);
    ctx.drawImage(dieImg, cx - w / 2, feetY - h, w, h);
  } else {
    const size = PLAYER_W * (1 + Math.sin(tail * Math.PI * 6) * 0.15);
    ctx.save();
    ctx.translate(cx, feetY - PLAYER_H / 2);
    ctx.rotate(tail * Math.PI * 2);
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }

  // GAME OVER slides from above down to the center over this second beat
  const ease = 1 - (1 - tail) * (1 - tail); // settles gently at the end
  const goY = -80 + ease * (H / 2 + 80);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff3020";
  ctx.font = "bold 92px monospace";
  ctx.fillText("GAME OVER", W / 2, goY);
  ctx.fillStyle = "#f0e0d0";
  ctx.font = "17px monospace";
  ctx.fillText("(" + deathCause + ")", W / 2, goY + 44);
}

// NOTE: currently unused — the flow now goes dying -> leaderboard directly.
// Kept around in case we bring a game-over menu back later.
function drawGameOverScreen() {
  ctx.fillStyle = "rgba(10,5,8,0.85)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff3020";
  ctx.font = "bold 54px monospace";
  ctx.fillText("demon got me", W / 2, 170);
  ctx.fillStyle = "#f0e0d0";
  ctx.font = "14px monospace";
  ctx.fillText("(" + deathCause + ")", W / 2, 200);
  ctx.font = "bold 26px monospace";
  ctx.fillText("SCORE " + Math.floor(score), W / 2, 260);
  ctx.font = "18px monospace";
  ctx.fillText("BEST  " + bestScore, W / 2, 292);
  // Menu appears once the short restart lock has passed (avoids accidental restarts)
  if (performance.now() - gameOverTime > RESTART_LOCK * 1000) {
    drawMenu(["RUN AGAIN", "LEADERBOARD"], GAMEOVER_MENU_Y, menuIndexGameOver, "#f0e0d0");
  }
}

   ===================================================================== */

const DEFAULT_LEADERBOARD = [
  { name: "D3M0N",      score: 6660 },
  { name: "MOON",       score: 4200 },
  { name: "DGMAX",      score: 3333 },
  { name: "HODL3R",     score: 2500 },
  { name: "W4GMI",      score: 1999 },
  { name: "PEPE404",    score: 1337 },
  { name: "RUGPULL",    score: 999 },
  { name: "TOUCHGRASS", score: 777 },
  { name: "C0PE",       score: 420 },
  { name: "NGMI",       score: 69 }
];

// Merges the player's saved best score into the fake board (top 10 kept)
function getLeaderboardRows() {
  const rows = DEFAULT_LEADERBOARD.map(r => ({ ...r }));
  if (bestScore > 0) rows.push({ name: "YOU", score: bestScore, you: true });
  rows.sort((a, b) => b.score - a.score);
  return rows.slice(0, 10);
}

function drawLeaderboard() {
  if (!drawSlot("leaderboard_bg", 0, 0, W, H)) {
    ctx.fillStyle = "#14090e";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#ff3020";
  ctx.font = "bold 40px monospace";
  ctx.fillText("LEADERBOARD", W / 2, 73);

  // Score of the run that just ended (the flow lands here right after a death)
  if (score > 0) {
    ctx.fillStyle = "#f0e0d0";
    ctx.font = "bold 19px monospace";
    ctx.fillText("LAST RUN  " + Math.floor(score), W / 2, 104);
  }

  // 10 rows: rank, name, score (the player's row is highlighted).
  // Signed-in players with loaded data see the GLOBAL top 10 (@handles);
  // everyone else keeps the offline lore board — no network dependency.
  let rows;
  if (sbUser && onlineTop10 && onlineTop10.length) {
    const myHandle = sbUser.user_metadata && sbUser.user_metadata.user_name;
    rows = onlineTop10.map(r => ({ name: "@" + r.handle, score: r.best_score, you: r.handle === myHandle }));
  } else {
    rows = getLeaderboardRows();
  }
  ctx.font = "23px monospace";
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const y = 137 + i * 41;
    ctx.fillStyle = r.you ? "#ffd040" : "#f0e0d0";
    ctx.textAlign = "left";
    ctx.fillText(String(i + 1).padStart(2, " ") + ".", 264, y);
    ctx.fillText(r.name, 330, y);
    ctx.textAlign = "right";
    ctx.fillText(String(r.score).padStart(6, " "), 727, y);
  }

  // Character on the right, picked from the player's rank on the board:
  // rank 1 -> _4, rank 2 -> _3, ranks 3-4 -> _2, ranks 5-10 -> _1,
  // not ranked -> the crying leaderboard_player (or its placeholder).
  const youRank = rows.findIndex(r => r.you) + 1; // 0 = not on the board
  let tierName = "leaderboard_player";
  if (youRank === 1) tierName = "leaderboard_player_4";
  else if (youRank === 2) tierName = "leaderboard_player_3";
  else if (youRank === 3 || youRank === 4) tierName = "leaderboard_player_2";
  else if (youRank >= 5) tierName = "leaderboard_player_1";

  const t = performance.now() / 1000;
  const cx = W * 0.82, cy = 355;
  const chH = 213, chW = chH * slotAspect(tierName);
  // Animations by tier: _1 and _3 bob up and down (like the home idle);
  // _2 and _4 "dance" by mirroring left<->right at least every second.
  const bobbing = tierName === "leaderboard_player_1" || tierName === "leaderboard_player_3";
  const dancing = tierName === "leaderboard_player_2" || tierName === "leaderboard_player_4";
  const bobOff = bobbing ? Math.sin(t * 3) * 7 : 0;
  const flipped = dancing && Math.floor(t / 1.0) % 2 === 1;
  ctx.save();
  if (flipped) { // mirror the drawing around the character's center
    ctx.translate(cx, 0);
    ctx.scale(-1, 1);
    ctx.translate(-cx, 0);
  }
  const drawn = drawSlot(tierName, cx - chW / 2, cy - chH / 2 + bobOff, chW, chH);
  ctx.restore();
  if (!drawn) {
    ctx.fillStyle = "#d81f1f";
    ctx.fillRect(cx - 30, cy - 40, 60, 80);
    ctx.fillStyle = "#ffe040"; // eye
    ctx.fillRect(cx + 6, cy - 24, 9, 9);
    ctx.fillStyle = "#40a0ff"; // falling tears
    const tearY = (t * 60) % 50;
    ctx.fillRect(cx + 8, cy - 12 + tearY, 4, 7);
    ctx.fillRect(cx + 8, cy - 12 + ((tearY + 25) % 50), 3, 5);
  }

  // Personal position line — and BEFORE login, the hook line that gives the
  // JOIN button its meaning.
  {
    let msg = null;
    if (sbUser) msg = onlineStatus === "loading" ? "syncing..." : rankMessage();
    else if (db) msg = "Think you belong in the real Top 10? Log in!";
    if (msg) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd040";
      ctx.font = "bold 21px monospace";
      ctx.fillText(msg, W / 2, 542);
    }
  }

  // Buttons: JOIN GLOBAL LEADERBOARD (CTA, hidden once signed in),
  // SHARE (discreet) and FOLLOW US ON X
  for (const b of leaderboardButtons()) {
    const isCta = b.id === "join";
    ctx.fillStyle = isCta ? "#ff3020" : "rgba(255,255,255,0.08)";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = isCta ? "#ff3020" : "#909090";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = isCta ? "#ffffff" : "#cfcfcf";
    ctx.font = "bold 14px monospace";
    ctx.textAlign = "center";
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#909090";
  ctx.font = "14px monospace";
  ctx.fillText("press to new game", W / 2, H - 12);
}

// Creates the player row on first login, updates the handle on later ones
async function savePlayer(user) {
    const { data, error } = await db
        .from("players")
        .upsert(
            {
                user_id: user.id,
                x_id: user.user_metadata.provider_id,
                handle: user.user_metadata.user_name
            },
            { onConflict: "x_id" }
        )
        .select();

    console.log("savePlayer:", error || data);
}

// Sends a score, but only overwrites the stored best if it's higher
async function submitScore(user, score) {
    const { data, error } = await db
        .from("players")
        .update({ best_score: score })
        .eq("user_id", user.id)
        .lt("best_score", score)
        .select();

    console.log("submitScore:", error || data);
}

// Top 10 players by best score
async function loadTop10() {
    const { data, error } = await db
        .from("players")
        .select("handle, best_score")
        .order("best_score", { ascending: false })
        .limit(10);

    console.log("top10:", error || data);
    return data;
}

// Personal rank: how many players scored higher, plus one
async function loadMyRank(score) {
    const { count, error } = await db
        .from("players")
        .select("*", { count: "exact", head: true })
        .gt("best_score", score);

    console.log("rank:", error || count + 1);
    return count + 1;
}

/* ---- End of the verbatim block ---- */

// How many players have a score on the board at all (for the display rules)
async function loadRankedCount() {
  const { count } = await db
    .from("players")
    .select("*", { count: "exact", head: true })
    .gt("best_score", 0);
  return count || 0;
}

// Refreshes top 10 + my rank + ranked-player count (never throws)
async function refreshOnline() {
  if (!db || !sbUser) return;
  onlineStatus = "loading";
  try {
    onlineTop10 = await loadTop10();
    onlineRank = await loadMyRank(bestScore);
    onlineCount = await loadRankedCount();
    onlineStatus = "ready";
  } catch (e) {
    onlineStatus = "error"; // the lore board keeps being shown instead
  }
}

// Personal position line. Rules: never show a denominator, and never show a
// percentile above 50% (a plain rank is shown instead).
function rankMessage() {
  if (onlineRank == null || onlineCount == null) return null;
  if (onlineCount < 10) return "Think you belong in the real Top 10?";
  if (onlineCount < 50) return "RANK #" + onlineRank;
  const pct = Math.ceil((onlineRank / onlineCount) * 100);
  if (pct <= 50) return "TOP " + pct + "% OF RANKED PLAYERS";
  return "RANK #" + onlineRank;
}

function leaderboardButtonAction(id) {
  if (id === "join" && db) {
    // Exact same call as the validated test page — redirectTo must stay
    // origin + pathname or a leftover "#" breaks the session.
    db.auth.signInWithOAuth({
      provider: "x",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
  } else if (id === "share") {
    // Plain text + GAME link web intent — no assets, no generated images
    const msg = sbUser
      ? "Demon Got Me... here is my best score on FULL SEND : " + bestScore + ". Can you do better? " + GAME_URL
      : "Demon Got Me... can you do better than me? " + GAME_URL;
    window.open("https://x.com/intent/post?text=" + encodeURIComponent(msg), "_blank");
  } else if (id === "follow") {
    window.open(X_FOLLOW_URL, "_blank");
  } else if (id === "website") {
    window.open(SITE_URL, "_blank");
  }
}

// Runs once per signed-in user: ensure the player row exists, push the local
// best (the DB keeps the higher of the two), then load the global board.
function handleSignedIn(user) {
  if (!user || (sbUser && sbUser.id === user.id)) return;
  sbUser = user;
  savePlayer(user)
    .then(() => (bestScore > 0 ? submitScore(user, bestScore) : null))
    .then(refreshOnline)
    .catch(() => {});
}

// Restore an existing session on load, and catch the OAuth redirect return
if (db) {
  db.auth.getSession().then(({ data }) => {
    if (data.session) handleSignedIn(data.session.user);
  }).catch(() => {});
  db.auth.onAuthStateChange((_event, session) => {
    if (session) handleSignedIn(session.user);
  });
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */

let lastTime = performance.now();

function loop(now) {
  // Delta time in seconds, clamped so a background tab doesn't teleport the game
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  // Blocked (phone / tablet / tiny window): the world is frozen and nothing is
  // drawn, so coming back to a big enough window resumes exactly where it was.
  if (!blocked) {
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}

resetRun();          // so a valid world exists before the first run starts
updateDesktopGate(); // decide up front whether this device gets the game at all
requestAnimationFrame(loop);
