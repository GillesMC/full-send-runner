<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>DGM — Demon Got Me (prototype)</title>
    <style>
        /* Black page, canvas centered: whatever the window's shape, the space the
           16:9 game doesn't fill shows as black bars */
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            /* prevents mobile scroll/zoom while tapping */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            /* Base (max) display width: the FIRST value below — 1024px = 1024x576.
               The game is still 1280x720 inside; this is only how big it is shown.
               In a smaller window it shrinks with it, always 16:9 (the smaller of:
               that value, the window's width, the width the window's height allows).
               The rest of the window stays black. */
            width: min(960px, 100vw, calc(100vh * 16 / 9));
            height: auto;
            aspect-ratio: 16 / 9;
            flex-shrink: 0;
            display: block;
            image-rendering: pixelated;
            outline: none;
        }

        /* --- Desktop gate: shown instead of the game on phones and tablets
     (see updateDesktopGate). --- */
        #gate {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            font-family: "Courier New", ui-monospace, monospace;
            text-align: center;
            text-transform: uppercase;
            z-index: 10;
        }

        #gate[hidden] {
            display: none;
        }

        #gate .gate-icon {
            font-size: 44px;
            line-height: 1;
        }

        #gate .gate-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        #gate .gate-line {
            font-size: 15px;
            letter-spacing: 1px;
            line-height: 1.6;
            max-width: 30ch;
        }

        #gate .gate-hint {
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.7;
            text-transform: none;
        }

        /* Blinking cursor, because this is an arcade console after all */
        #gate .gate-caret {
            animation: gate-blink 1s steps(1) infinite;
        }

        @keyframes gate-blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Shown instead of the game on anything that is not a desktop/laptop -->
    <div id="gate" hidden>
        <div class="gate-line">
            Full Send is currently playable on desktop only
            <span class="gate-caret">_</span>
        </div>
    </div>

    <!-- The game screen: 1280x720, the art is drawn on it 1:1 -->
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- Supabase client library (online leaderboard). If this fails to load,
     the game detects it and runs fully offline as before. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        "use strict";

        /* =====================================================================
           TUNABLE CONSTANTS — everything you might want to tweak lives here.
           All speeds are in pixels/second, all durations in seconds.
           ===================================================================== */

        // --- Screen ---
        // The game screen is 1280x720 (16:9). The canvas IS the screen: the art is
        // drawn on it 1:1. How big it is SHOWN is set in the canvas CSS (base size,
        // shrinks with a smaller window, always 16:9, centered, black around).
        const W = 1280;                    // must match the <canvas> tag
        const H = 720;
        const LOADING_MIN_T = 1.4;         // the LOADING screen stays up at least this long (s)
        const LOADING_MAX_T = 6.0;         // ...and stops waiting for slow images after this (s)
        const LOADING_HOLD_T = 0.25;       // "100%" stays on screen this long before the home screen (s)

        // --- Title screen: the forest ---
        // Every home_* image is pixel art drawn 1:1 on the 1280x720 screen, at its
        // native size — never scaled. Photoshop's layer export trims each file to its
        // own pixels, so each one gets back the top-left corner it had in the PSD:
        // measured pixel by pixel against home_forest for rocks / ground / waterfall,
        // read off the demo render for the clouds. Listed back to front.
        // drift = the clouds creep right to left (px/s, the furthest one slowest) and come
        // back in from the right once fully gone. home_cloud_1's right edge was cut
        // by the PSD canvas (rows 354..456), but those rows always stay behind the
        // opaque mountains, so the cut never shows. leavesBehind = the far falling
        // leaves are drawn right before this layer, so they vanish behind it.
        const HOME_BACK_LAYERS = [
            { slot: "home_sky", x: 0, y: 0 },
            { slot: "home_cloud_4", x: 20, y: 150, drift: 1.5 },
            { slot: "home_cloud_3", x: 190, y: 140, drift: 2 },
            { slot: "home_cloud_2", x: 400, y: 165, drift: 2.5 },
            { slot: "home_cloud_1", x: 127, y: 0, drift: 3 },
            { slot: "home_mountains", x: 0, y: 0 },
            { slot: "home_forest", x: 0, y: 0, leavesBehind: true } // trees, pagoda, bridge, pond
        ];
        // The waterfall's frame 1 is the one painted in home_forest; frames 2 and 3
        // are drawn over it, so the loop is forest / 2 / 3.
        const HOME_WATERFALL = { x: 1103, y: 258, fps: 3, frames: [null, "home_waterfall_2", "home_waterfall_3"] };
        const HOME_FRONT_LAYERS = [
            { slot: "home_rocks", x: 1, y: 373 },
            { slot: "home_ground", x: 0, y: 530 }     // the grass ledge (running line) + the water
        ];
        // The samurai and his katana sit ON the running line (GROUND_Y): only x is set here
        const HOME_SAMURAI_X = 208;        // left edge (px)
        const HOME_KATANA_X = 383;         // left edge (px)
        // He meditates, barely moving: on every out-breath his head and shoulders sink
        // one pixel (the rows above HOME_BREATH_SPLIT slide down over the row below).
        const HOME_BREATH_PX = 1;          // 0 = perfectly still
        const HOME_BREATH_SPLIT = 120;     // first row of home_samurai that never moves (hakama)
        const HOME_BREATH_PERIOD = 4.5;    // one full breath (s)
        // Falling leaves: home_leaf drifting down and swaying, mirrored each time the
        // sway turns back (pixel-perfect flip, no rotation). Two depths: FRONT leaves
        // fall in front of the whole forest; FAR ones are smaller and slower and fall
        // BEHIND home_forest (only seen through the gaps in the trees). Sizes are
        // whole-pixel, nearest-neighbour reductions of home_leaf. They start where the
        // demo render has them (+ a few far ones), then respawn above the screen.
        const HOME_LEAF_START = [          // front leaf centers on the first frame (px)
            [233, 210], [128, 348], [150, 465], [500, 333], [612, 187],
            [632, 382], [503, 478], [1218, 415], [978, 600]
        ];
        const HOME_LEAF_FAR_START = 4;     // far leaves on the first frame, at random spots
        const HOME_LEAF_FAR_CHANCE = 0.35; // share of respawning leaves that come back as far ones
        const HOME_LEAF_SIZE = [0.75, 1];  // front leaf size range (x home_leaf)
        const HOME_LEAF_FAR_SIZE = [0.45, 0.62]; // far leaf size range
        const HOME_LEAF_FALL = [20, 36];   // fall speed range at full size (px/s) — scaled with the size
        const HOME_LEAF_SWAY = [14, 34];   // sway amplitude range at full size (px) — ditto
        const HOME_LEAF_SWAY_SPEED = [0.8, 1.4]; // sway speed range (radians/s)
        // Koi: two swim slowly back and forth in open water (clear of the stones),
        // the third one leaps out now and then. x = left edge, min/max bound it;
        // facesRight = which way the artwork itself looks.
        const HOME_KOI_SWIMMERS = [
            { slot: "home_koi_2", x: 518, y: 678, min: 330, max: 620, speed: 20, facesRight: true },
            { slot: "home_koi_3", x: 1000, y: 676, min: 830, max: 1080, speed: 16, facesRight: false }
        ];
        const HOME_KOI_JUMPER = "home_koi_1"; // diving pose, head down-left
        const HOME_KOI_JUMP_ZONES = [[360, 620], [850, 1060]]; // where it may leap (x range, px)
        const HOME_KOI_WATER_Y = 704;      // water line the leap starts from and dives back into (px)
        const HOME_KOI_JUMP_H = 54;        // height of the leap (px)
        const HOME_KOI_JUMP_DX = 70;       // distance covered during the leap (px)
        const HOME_KOI_JUMP_T = 1.0;       // duration of a leap (s)
        const HOME_KOI_JUMP_GAP = [5, 10]; // pause between two leaps (s)

        const HOME_LOGO_H = 196;           // display height of logo.png (px)
        const HOME_LOGO_Y = 120;           // vertical center of the logo (px)
        const TITLE_SLIDE_DURATION = 0.6;  // how long the logo takes to slide in (s)
        const HOME_LOGO_BOUNCE_PX = 8;     // how far the logo bobs up and down once it has landed (px)
        const HOME_LOGO_BOUNCE_SPEED = 2.4; // logo bob speed (radians/s)
        const HOME_MENU_FADE_T = 0.3;      // START / LEADERBOARD fade in over this, once the title screen is complete (s)
        const MENU_SHADOW = "rgba(15,25,15,0.8)"; // drop shadow under the white menu text on the forest

        // --- START sequence: the gummy crosses the screen, portal to portal ---
        // A portal opens on the left, the red gummy runs out of it, past the
        // meditating samurai, into a second portal on the right; both close, and the
        // run starts. It plays every time START is pressed (press again = skip).
        const PORTAL_LEFT_X = 70;          // portal centers (px)
        const PORTAL_RIGHT_X = 1195;
        // Which way each portal leans. Mirroring is lossless on pixel art (a 45°
        // rotation would break its pixel grid), so the orientation is set with flips.
        const PORTAL_LEFT_FLIP = false;    // as drawn: leans "\" (top to the left)
        const PORTAL_RIGHT_FLIP = true;    // mirrored: leans "/" — the pair opens outward
        const PORTAL_SINK = 6;             // the portal's bottom sits this far below GROUND_Y (px)
        const PORTAL_OPEN_T = 0.3;         // a portal opens / closes in this long (s)
        const PORTAL_HOLD_T = 0.25;        // the left portal stays open this long once the gummy is out (s)
        const INTRO_GUMMY_SPEED = 460;     // run speed across the screen (px/s)
        const INTRO_GUMMY_HOP_PX = 3;      // with a single run frame: a little hop instead of a leg cycle (px)
        const INTRO_GUMMY_HOP_HZ = 5;      // hops per second
        const INTRO_FADE_T = 0.4;          // fade to black before the run (s)

        // --- Death sequence ---
        // Two beats: the runner is thrown into his `hurt` pose and freezes there while a
        // koala sprints in from the LEFT to catch him; the moment he reaches him both
        // vanish and the gameover_player_1..7 animation plays out.
        const DEATH_SEQUENCE_DURATION = 3.4; // whole sequence, both beats (s)
        const DEATH_CATCH_FRAC = 0.38;       // when the koala reaches the player (fraction of the sequence)
        const DEATH_KOALA_FROM = -0.14;      // koala's start x (fraction of screen width, just off-screen
        // LEFT, so he is on screen almost immediately)
        const GAMEOVER_FRAME_COUNT = 7;      // gameover_player_1..7, played once in order
        const GAMEOVER_BEAT_FRAME_T = 0.26;  // seconds per gameover frame (7 frames ~ 1.8s)

        /* ---------------------------------------------------------------------
           GAMEPLAY CONSTANTS
           In screen pixels (1280x720). Only change these if you actually want to
           change the GAME.
           --------------------------------------------------------------------- */

        // --- Run speed & scoring ---
        const BASE_SPEED = 403;            // world scroll speed at the very start of a run (px/s)
        const SPEED_RAMP = 4.7;            // extra speed gained per second (px/s per s)
        const MAX_SPEED = 568;             // speed cap (px/s)
        const SCORE_PER_PIXEL = 0.038;     // score gained per pixel traveled (scaled down so the
        // score still climbs at the same rate per SECOND)

        // --- Player physics ---
        const GRAVITY = 4086;              // downward acceleration (px/s²)
        const JUMP_VELOCITY = 1345;        // initial upward speed of a jump (px/s) — ~221px high
        const DOUBLE_JUMP_VELOCITY = 1275; // upward speed of the second (air) jump (px/s) — ~199px more
        const JUMP_CUT_MULT = 0.45;        // releasing early multiplies upward speed by this (tap = short hop)
        const MAX_FALL_SPEED = 1954;       // max fall speed in normal free fall (px/s)
        const COYOTE_TIME = 0.08;          // grace period to still jump right after leaving the ground (s)
        const JUMP_BUFFER_TIME = 0.10;     // pressing jump this early before landing still triggers it (s)

        // --- Player hitbox (NEVER changes during a run, only visuals change) ---
        const PLAYER_X = 130;              // fixed horizontal position of the player (~12% from the left)
        const PLAYER_W = 70;               // hitbox width (px) — gummy_run_1 is 74 wide
        const PLAYER_H = 115;              // hitbox height (px) — the whole gummy_run_1 frame, its ground
        // shadow included, so the image's bottom row sits on GROUND_Y like the samurai's
        const HITBOX_PAD = 7;              // collision forgiveness: hitbox is shrunk by this on each side (px)

        // --- Player sprites: the red gummy (gummy_run_1..N, gummy_jump, ...) ---
        // Pixel art, drawn at its NATIVE size, feet on the bottom of the hitbox.
        const ANIM_FPS = 10;               // speed of the run / hold animation loops (frames per second)
        const RUN_FRAME_COUNT = 4;         // most gummy_run_* frames looked for
        const HOLD_FRAME_COUNT = 3;        // number of gummy_hold_* frames
        const DEBUG_HITBOX = true;         // true = draw the real collision box over the sprite (alignment check)
        // gummy_hurt is the one exception: the character is thrown through the air, so
        // it is anchored on the hitbox CENTER instead of on the feet.

        // --- World layout ---
        const GROUND_Y = 560;              // the running line (px from the top of the screen) — the
        // samurai, the katana and the gummy all stand on it, on the title screen too

        // --- Obstacle generation (time-based spacing => always playable at any speed) ---
        const SPAWN_GAP_MIN = 0.95;        // minimum time between two hazards (s)
        const SPAWN_GAP_MAX = 1.70;        // maximum time between two hazards (s)
        const KOALA_ANIM_FPS = 7;          // koala_running_1..2 walk loop (frames per second)
        const PIGEON_ANIM_FPS = 2.5;       // pigeon_1..2 wing beat — deliberately slow and lazy
        // Size presets per obstacle type. Only the HEIGHT is authoritative: the width
        // is derived from the artwork's aspect ratio, so nothing is ever stretched.
        const KOALA_SIZES = [
            { w: 84, h: 97 },                // the koala cop, small
            { w: 97, h: 128 }                // the koala cop, tall
        ];
        const PIGEON_SIZES = [
            { w: 105, h: 110 }               // a small bird — clearly smaller than the runner
        ];

        // --- Pigeon flight ---
        // The bird never sits still: it either bobs up and down or glides down on a
        // diagonal. BOTH paths are bounded so its lowest point is exactly the overhead
        // clearance line, which keeps it possible to run underneath at all times.
        const PIGEON_WAVE_AMPLITUDE = 38;  // how far above the clearance line it rises (px)
        const PIGEON_WAVE_SPEED = 1.9;     // bobbing speed (radians/s)
        const PIGEON_DIAGONAL_CHANCE = 0.35; // share of pigeons gliding down diagonally instead of bobbing
        const PIGEON_DIAGONAL_RISE = 95;   // how high a diagonal one starts above the clearance line (px)
        // The death scene reuses the run's own sizes
        const DEATH_KOALA_H = KOALA_SIZES[1].h;  // the koala catching you = the tall ground obstacle
        const DEATH_KOALA_FPS = 8;               // its walk loop speed
        const GAMEOVER_FRAME_H = 148;            // gameover_player_* are drawn at this height (px)

        const OVERHEAD_CLEARANCE = 45;     // free space between the player's head (running) and an overhead block (px)
        const GAP_WIDTH_MIN = 130;         // hole in the ground: min width (px) — must stay jumpable
        const GAP_WIDTH_MAX = 201;         // hole in the ground: max width (px)

        // --- Obstacle hitboxes ---
        // HITBOX_MODE lets us A/B the two approaches asked for in the spec:
        //   "body"  — a FIXED box on the creature's body, expressed as fractions of the
        //             sprite frame. Wings and tail feathers are deliberately outside it.
        //   "art"   — the box hugs the artwork's own opaque bounds, per frame.
        // "body" is the default and the recommended one: the two pigeon frames have very
        // different opaque bounds (frame 1: x=179 w=1831 h=1680, frame 2: x=0 w=2077
        // h=1646), so "art" makes the hitbox jump around as the wings flap — exactly the
        // offset we want gone. Both frames share a canvas, so a fixed box is rock steady.
        const HITBOX_MODE = "body";
        // Body box as fractions of the sprite frame {x0, y0, x1, y1}, measured on the
        // overlap of the animation frames (head + torso, wings excluded).
        // Keys are the obstacle's own `type` ("ground" / "overhead").
        const OBSTACLE_BODY_BOX = {
            ground: { x0: 0.02, y0: 0.02, x1: 0.98, y1: 0.98 }, // koala: fills its frame, barely trimmed
            // Pigeon: the WHOLE bird, wings included. Its two frames sweep their wings
            // across opposite corners (frame 1 reaches the top-right, frame 2 the
            // bottom-left), so the union of the artwork IS the full frame — which makes
            // the hitbox and the drawn sprite exactly the same rect here.
            overhead: { x0: 0.00, y0: 0.00, x1: 1.00, y1: 1.00 }
        };

        // --- Collectibles (3 kinds: points, jetpack, heart) ---
        const COLLECT_VALUE = 20;          // score gained per POINTS collectible
        const COLLECT_RADIUS = 26;         // collectible half-height (px) — the pickup box hugs the artwork
        const COLLECT_SPAWN_MIN = 1.5;     // min time between collectibles (s)
        const COLLECT_SPAWN_MAX = 3.5;     // max time between collectibles (s)
        const COLLECT_WEIGHT_JETPACK = 0.30; // chance a spawned collectible is a JETPACK token (refills fuel)
        const COLLECT_WEIGHT_HEART = 0.10;   // chance it is a heart (+1 life; points instead when hearts are full)
        // ...the rest are points

        // --- Lives (hearts) ---
        const LIVES_START = 1;             // hearts at the start of a run (1 = the next hit ends it)
        const LIVES_MAX = 3;               // most hearts you can carry
        const HURT_INVINCIBLE_T = 1.5;     // after losing a heart the runner blinks and can't be hit (s)
        const VOID_BOUNCE_VELOCITY = 1650; // a heart lost in a hole throws the runner back up this fast (px/s)

        // --- Jetpack (the runner's "magic power", runs on fuel refilled by collectible_jetpack) ---
        // Holding the button once the jump has peaked (or while falling) fires it: an
        // instant upward kick, then real thrust that beats gravity, while the runner
        // surges forward and the world rushes past faster. It pulls you out of a hole.
        const FUEL_MAX = 3.0;              // max seconds of thrust the tank can hold
        const FUEL_START = 1.5;            // fuel at the start of a run (s)
        const FUEL_REFILL = 1.0;           // fuel given by one JETPACK token (s)
        const JET_KICK = 520;              // instant upward speed on ignition (px/s) — the "whoosh"
        const JET_THRUST = 6200;           // upward acceleration while firing (px/s², GRAVITY is 4086)
        const JET_MAX_RISE = 560;          // climb speed cap (px/s)
        const JET_CEILING = 115;           // highest the jetpack lifts the player's top edge (px): just
        // under the HUD (fuel + hearts), still above the highest pigeon
        const JET_SPEED_BOOST = 0.45;      // world scrolls up to +45% faster while firing
        const JET_PUSH_X = 70;             // the runner surges this far forward on screen (px)
        const JET_SPOOL_UP = 7;            // how fast the boost kicks in (1/s)
        const JET_SPOOL_DOWN = 2.5;        // how fast it fades after the jetpack stops (1/s)

        // --- HUD placement ---
        const HUD_INSET_X = 40;            // horizontal distance of the HUD from the screen edges (px)
        const HUD_INSET_Y = 40;            // vertical distance of the HUD from the top (px)

        // --- Juice / feedback ---
        const FLASH_DURATION = 0.12;       // duration of screen flashes (s)
        const SHAKE_DURATION = 0.35;       // duration of screen shake on death (s)
        const SHAKE_STRENGTH = 7;          // max shake offset (px)
        const RESTART_LOCK = 0.5;          // delay before the game-over screen accepts a restart input (s)
        const SOUND_VOLUME = 0.07;         // master volume of the little beeps (0 = mute)

        /* =====================================================================
           SETUP
           ===================================================================== */

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // F toggles fullscreen
        window.addEventListener("keydown", (e) => {
            if (e.code === "KeyF") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        /* ---------------------------------------------------------------------
           DESKTOP GATE
           The game is played with a keyboard or a mouse: phones and tablets get a
           message instead of the game.
           --------------------------------------------------------------------- */
        const gate = document.getElementById("gate");
        let blocked = false;
        // A touch-only device: no fine pointer and no hover. iPadOS lies about its UA
        // (it claims to be a Mac), so the pointer media queries are the real test and
        // the UA sniff is only a belt-and-braces second opinion.
        function isTouchOnlyDevice() {
            const finePointer = window.matchMedia("(pointer: fine)").matches;
            const canHover = window.matchMedia("(hover: hover)").matches;
            const uaMobile = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile|Silk|Kindle|BlackBerry/i.test(navigator.userAgent);
            const iPadOnMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
            return uaMobile || iPadOnMac || !(finePointer && canHover);
        }


        function isDesktop() {
            return !isTouchOnlyDevice();
        }
        // Re-evaluated on every resize / rotation.
        function updateDesktopGate() {
            blocked = !isDesktop();
            gate.hidden = !blocked;
            canvas.style.visibility = blocked ? "hidden" : "visible";
            if (blocked) releaseButton(); // never leave the jump button stuck down
        }
        window.addEventListener("resize", updateDesktopGate);
        window.addEventListener("orientationchange", updateDesktopGate);

        /* ---------------------------------------------------------------------
           IMAGE SLOT SYSTEM
           Each visual element tries to load assets/<slot>.png. If the file is
           missing, the game silently draws its colored-shape placeholder instead.
           Drop a PNG into assets/ later and it replaces the shape automatically,
           without touching the code.
           --------------------------------------------------------------------- */
        const ASSET_SLOTS = [
            // Title screen: the forest (positions in HOME_BACK_LAYERS & co.)
            "home_sky", "home_cloud_1", "home_cloud_2", "home_cloud_3", "home_cloud_4",
            "home_mountains", "home_forest", "home_waterfall_2", "home_waterfall_3",
            "home_rocks", "home_ground", "home_leaf",
            "home_samurai", "home_katana", "home_koi_1", "home_koi_2", "home_koi_3",
            "logo",
            // START sequence
            "portal",
            // Player: the red gummy. Only gummy_run_1 exists so far — the others fall
            // back to it (run loop) or to the placeholder until they are drawn.
            "gummy_run_1", "gummy_run_2", "gummy_run_3", "gummy_run_4",
            "gummy_hold_1", "gummy_hold_2", "gummy_hold_3",
            "gummy_jump", "gummy_doublejump", "gummy_hurt",
            // Obstacles (2 animation frames each)
            "koala_running_1", "koala_running_2",
            "pigeon_1", "pigeon_2",
            // Collectibles (collectible_shrimp.png is in assets/ but not wired in yet)
            "collectible_points", "collectible_jetpack", "collectible_heart",
            // Death sequence
            "gameover_player_1", "gameover_player_2", "gameover_player_3",
            "gameover_player_4", "gameover_player_5", "gameover_player_6",
            "gameover_player_7",
            // Leaderboard
            "leaderboard_bg", "leaderboard_player",
            "leaderboard_player_1", "leaderboard_player_2",
            "leaderboard_player_3", "leaderboard_player_4"
        ];
        const assets = {}; // only slots whose PNG actually loaded end up in here
        let assetsSettled = 0; // slots that finished loading OR turned out missing (drives the LOADING bar)

        for (const name of ASSET_SLOTS) {
            const img = new Image();
            img.onload = () => { assets[name] = img; assetsSettled++; };
            img.onerror = () => { assetsSettled++; /* file missing: the fallback shape will be drawn, no error */ };
            img.src = "assets/" + name + ".png";
        }
        function allAssetsSettled() { return assetsSettled >= ASSET_SLOTS.length; }

        // Some source images have transparent padding around the artwork. This table
        // (opaque pixel bounds, measured from the PNGs) lets drawSlot render ONLY the
        // artwork — so the drawn rect, and therefore the hitbox, hugs the visible
        // pixels on all four sides. Re-measure if these images are replaced.
        const SPRITE_TRIM = {
            "leaderboard_player_1": { x: 133, y: 220, w: 758, h: 639 },
            "leaderboard_player_2": { x: 99, y: 191, w: 628, h: 640 },
            "leaderboard_player_3": { x: 200, y: 216, w: 616, h: 616 },
            "leaderboard_player_4": { x: 304, y: 155, w: 467, h: 670 }
            // Deliberately NOT trimmed: animation frames that share a canvas
            // (koala_running_*, pigeon_*, gameover_player_*) — trimming each one
            // separately would make them jitter frame to frame.
        };

        // Draws the slot image if it loaded (using its trim when measured).
        // Returns true if drawn, false so the caller draws the fallback shape.
        function drawSlot(name, x, y, w, h) {
            const img = assets[name];
            if (!img) return false;
            const t = SPRITE_TRIM[name];
            if (t) ctx.drawImage(img, t.x, t.y, t.w, t.h, x, y, w, h);
            else ctx.drawImage(img, x, y, w, h);
            return true;
        }

        // width/height ratio of a slot's VISIBLE artwork (trimmed if measured)
        function slotAspect(name) {
            const t = SPRITE_TRIM[name];
            if (t) return t.w / t.h;
            const img = assets[name];
            return img ? img.width / img.height : 1;
        }

        // Game state machine — one screen at a time:
        // "boot" -> "home" -> "intro" -> "playing" -> "dying" -> "gameover" -> "leaderboard"
        let state = "boot";
        let bootTime = 0;              // time spent on the LOADING screen (s)
        let bootDoneTime = 0;          // time spent at 100% on the LOADING screen (s)
        let homeTime = 0;              // time spent on the home screen (drives animations)
        let homeMenuTime = 0;          // time since START / LEADERBOARD appeared (drives their fade-in)
        let menuIndexHome = 0;         // selected item on HOME (0 = start game, 1 = leaderboard)
        let introTime = 0;             // time elapsed in the intro cinematic (s)
        let deathTimer = 0;            // counts down the death mini-sequence
        let menuIndexGameOver = 0;     // selected item on GAME OVER (0 = run again, 1 = leaderboard)

        // Best score, persisted in localStorage (wrapped in try/catch for file:// quirks)
        let bestScore = 0;
        try { bestScore = Number(localStorage.getItem("dgm_best")) || 0; } catch (e) { }

        // Run variables (initialized in resetRun)
        let player, obstacles, gaps, collectibles, particles, popups;
        let score, runTime, currentSpeed, worldX;
        let hazardTimer, collectTimer;
        let holding = false;       // is the jump button currently held? (drives the jetpack)
        let jumpBufferTimer = 0;   // time left on a buffered jump press
        let flashTimer = 0, flashColor = "#fff";
        let shakeTimer = 0, shakePower = SHAKE_STRENGTH;
        let gameOverTime = 0;      // timestamp of death, used for the restart lock
        let deathCause = "";       // short reason shown on the game-over screen
        let squash = 1;            // visual-only vertical squash of the player (landing feedback)
        let fuel = 0;              // seconds of jetpack thrust left in the tank
        let jetPower = 0;          // 0..1, eased: how hard the jetpack boost is currently pushing
        let lives = 0;             // hearts left (0 = the run is over)
        let invincibleTimer = 0;   // blinking grace period right after losing a heart (s)
        let paused = false;        // "P" pauses the run (world frozen, overlay shown)
        let bootSoundPlayed = false; // soft power-on sound, once (browsers may mute it before any click)
        let bootChimeDone = false;   // fallback: play the chime on the FIRST press (audio unlocked there)

        function resetRun() {
            player = {
                x: PLAYER_X,
                y: GROUND_Y - PLAYER_H,
                vy: 0,               // vertical speed (positive = falling)
                grounded: true,
                jumpsUsed: 0,        // 0 = fresh, 1 = jumped, 2 = double jump used
                coyoteTimer: 0,      // time since the player left the ground without jumping
                jetting: false       // is the jetpack firing right now?
            };
            obstacles = [];        // {type:'ground'|'overhead', x, y, w, h}
            gaps = [];             // {x, w} holes in the ground
            collectibles = [];     // {x, y, r}
            particles = [];        // {x, y, vx, vy, life, color, size}
            popups = [];           // floating texts {x, y, text, life, color}
            score = 0;
            runTime = 0;
            currentSpeed = BASE_SPEED;
            worldX = 0;            // total distance traveled, used for ground marks animation
            paused = false;
            hazardTimer = 1.2;     // small breather before the first obstacle
            collectTimer = 2.0;
            jumpBufferTimer = 0;
            squash = 1;
            fuel = FUEL_START;
            jetPower = 0;
            lives = LIVES_START;
            invincibleTimer = 0;
        }

        /* =====================================================================
           AUDIO — tiny WebAudio beeps, no files needed
           ===================================================================== */

        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
            }
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }

        // Plays a short beep. freqFrom/freqTo lets us do little pitch slides.
        function beep(freqFrom, freqTo, dur, type) {
            if (!audioCtx || SOUND_VOLUME <= 0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = audioCtx.currentTime;
            osc.type = type || "square";
            osc.frequency.setValueAtTime(freqFrom, t);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqTo), t + dur);
            gain.gain.setValueAtTime(SOUND_VOLUME, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + dur);
        }

        const sndJump = () => beep(300, 520, 0.10, "square");
        const sndDoubleJump = () => beep(420, 700, 0.10, "square");
        const sndCollect = () => beep(700, 1100, 0.09, "sine");
        const sndJetpack = () => beep(400, 800, 0.12, "triangle");
        const sndHeart = () => beep(520, 1040, 0.18, "sine");
        const sndSmash = () => beep(250, 90, 0.15, "square");
        const sndDeath = () => beep(220, 40, 0.45, "sawtooth");
        const sndBootUp = () => beep(160, 640, 0.7, "sine"); // soft, gentle power-on sweep
        const sndPortal = () => beep(180, 760, 0.4, "triangle"); // a portal opening
        const sndWhoosh = () => beep(900, 140, 0.25, "sine");    // the gummy vanishing into it
        const sndJetIgnite = () => beep(120, 900, 0.22, "sawtooth"); // jetpack whoosh
        const sndJetEmpty = () => beep(220, 60, 0.25, "square");     // out of fuel sputter

        // Low rumble that loops for as long as the jetpack fires
        let jetHum = null;
        function jetHumStart() {
            if (!audioCtx || SOUND_VOLUME <= 0 || jetHum) return;
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.value = 70;
            filter.type = "lowpass";
            filter.frequency.value = 500;
            gain.gain.value = SOUND_VOLUME * 0.9;
            osc.connect(filter).connect(gain).connect(audioCtx.destination);
            osc.start();
            jetHum = { osc, gain };
        }
        function jetHumStop() {
            if (!jetHum) return;
            const t = audioCtx.currentTime;
            jetHum.gain.gain.setTargetAtTime(0, t, 0.05);
            jetHum.osc.stop(t + 0.3);
            jetHum = null;
        }

        /* =====================================================================
           JUICE HELPERS
           ===================================================================== */

        function flash(color, dur) { flashColor = color; flashTimer = dur || FLASH_DURATION; }
        function shake(power) { shakeTimer = SHAKE_DURATION; shakePower = power || SHAKE_STRENGTH; }

        function addPopup(x, y, text, color) {
            popups.push({ x, y, text, color, life: 0.8 });
        }

        function burst(x, y, color, count, speed) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = (0.3 + Math.random() * 0.7) * speed;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s - 60,
                    life: 0.4 + Math.random() * 0.3,
                    color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        /* =====================================================================
           INPUT — one button: Space / click / tap. Press = jump, hold = JETPACK.
           ===================================================================== */

        // --- Screen flow helpers ---
        function goHome() { state = "home"; homeTime = 0; homeMenuTime = 0; menuIndexHome = 0; }
        // The home screen is "complete" once the logo has landed and every image has
        // either loaded or been ruled missing. START / LEADERBOARD only appear — and
        // only respond — after that. Add any future title-screen animation to this check.
        function homeReady() { return homeTime >= TITLE_SLIDE_DURATION && allAssetsSettled(); }
        function startIntro() {
            // The START sequence (portal, gummy run, portal) plays every time START
            // is pressed — it IS the transition into the run.
            state = "intro";
            introTime = 0;
            sndPortal();
        }
        function startPlaying() { resetRun(); state = "playing"; }

        // Key moments of the START sequence (s since START), from the constants above
        // and the gummy's own width:
        //   0 .. run          the left portal opens
        //   .. leftClose      the gummy is fully out of it, it closes behind him
        //   rightOpen         the right portal opens ~1s before he gets there
        //   .. arrive         he is fully inside it, it closes
        //   fade .. end       fade to black, the run starts
        function introTimeline() {
            const gw = gummyWidth();
            const run = PORTAL_OPEN_T;
            const arrive = run + (PORTAL_RIGHT_X - PORTAL_LEFT_X + gw) / INTRO_GUMMY_SPEED;
            const leftClose = run + gw / INTRO_GUMMY_SPEED + PORTAL_HOLD_T;
            const rightOpen = Math.max(0, arrive - 1.0 - PORTAL_OPEN_T);
            const fade = arrive + PORTAL_OPEN_T;
            return { run, leftClose, rightOpen, arrive, fade, end: fade + INTRO_FADE_T };
        }

        // Converts a mouse/touch event into GAME coordinates (0..W, 0..H): the canvas
        // is the screen, only scaled by CSS.
        function canvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
            const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
            return {
                x: (cx - rect.left) * W / rect.width,
                y: (cy - rect.top) * H / rect.height
            };
        }

        // Arrow up/down navigation inside menus
        function menuMove(dir) {
            if (state === "home" && homeReady()) menuIndexHome = (menuIndexHome + dir + 2) % 2;
            else if (state === "gameover") menuIndexGameOver = (menuIndexGameOver + dir + 2) % 2;
            else return;
            beep(500, 650, 0.05, "square"); // small navigation blip
        }

        // Menu rows vertical positions (used for drawing AND for click/tap selection)
        const HOME_MENU_Y = [440, 490];      // over the rocks, clear of the logo and the samurai
        const GAMEOVER_MENU_Y = [474, 535];

        // Clicking/tapping picks the menu row closest to the click before confirming
        function pickMenuFromClick(pos) {
            if (!pos || state !== "gameover") return;
            menuIndexGameOver = Math.abs(pos.y - GAMEOVER_MENU_Y[0]) <= Math.abs(pos.y - GAMEOVER_MENU_Y[1]) ? 0 : 1;
        }

        // The single action button (Space / click / tap) — behavior depends on the screen
        function pressButton(clickPos) {
            ensureAudio();
            // Browsers only allow audio after the first user interaction, so the boot
            // chime attempted at page load is usually muted. Replay it here, on the
            // very first press, while we're still at the start of the session.
            if (!bootChimeDone) {
                bootChimeDone = true;
                if (state === "boot" || state === "home") sndBootUp();
            }
            if (paused && state === "playing") return; // frozen: only "P" resumes
            holding = true;

            switch (state) {
                case "boot":
                    return; // the LOADING screen can't be skipped: it has to finish

                case "home": {
                    // START / LEADERBOARD only respond once the whole title screen is up
                    if (!homeReady()) return;
                    // Click/tap behavior: ANYWHERE starts a new game — except a click
                    // precisely ON the LEADERBOARD label. Keyboard: arrows + space/enter.
                    if (clickPos) {
                        const lbY = HOME_MENU_Y[1];
                        const onLeaderboard =
                            Math.abs(clickPos.x - W / 2) < 170 && clickPos.y > lbY - 26 && clickPos.y < lbY + 10;
                        menuIndexHome = onLeaderboard ? 1 : 0;
                    }
                    beep(600, 900, 0.08, "square"); // confirm blip
                    if (menuIndexHome === 0) startIntro();
                    else state = "leaderboard";
                    return;
                }

                case "intro":
                    startPlaying(); // pressing skips the home sequence
                    return;

                case "dying":
                    return; // no input during the death sequence

                case "gameover":
                    if (performance.now() - gameOverTime < RESTART_LOCK * 1000) return;
                    pickMenuFromClick(clickPos);
                    beep(600, 900, 0.08, "square"); // confirm blip
                    if (menuIndexGameOver === 0) startPlaying(); // restart: straight back in
                    else state = "leaderboard";
                    return;

                case "leaderboard": {
                    // brief lock right after a death so the leaderboard isn't skipped by accident
                    if (performance.now() - gameOverTime < RESTART_LOCK * 1000) return;
                    // A click/tap on one of the buttons triggers it; anything else goes home
                    if (clickPos) {
                        const b = leaderboardButtons().find(b =>
                            clickPos.x >= b.x && clickPos.x <= b.x + b.w &&
                            clickPos.y >= b.y && clickPos.y <= b.y + b.h);
                        if (b) { leaderboardButtonAction(b.id); return; }
                    }
                    // Any other press starts a NEW GAME. Restarts go straight into the run:
                    // the home sequence is the START flow, not something to sit through again.
                    startPlaying();
                    return;
                }
            }

            // state === "playing": try to jump
            const canGroundJump = player.grounded || (player.coyoteTimer < COYOTE_TIME && player.jumpsUsed === 0);
            if (canGroundJump) {
                doJump(JUMP_VELOCITY, 1);
                sndJump();
            } else if (player.jumpsUsed < 2) {
                doJump(DOUBLE_JUMP_VELOCITY, 2);
                sndDoubleJump();
            } else {
                // No jump available: buffer the press so it fires the instant we land
                jumpBufferTimer = JUMP_BUFFER_TIME;
            }
        }

        function doJump(velocity, jumpsUsedValue) {
            player.vy = -velocity;
            player.grounded = false;
            player.jumpsUsed = jumpsUsedValue;
            squash = 1.15; // slight vertical stretch on takeoff (visual only)
        }

        function releaseButton() {
            holding = false;
            if (state !== "playing") return;
            cutJet(false); // letting go shuts the jetpack off instantly
            // "Jump cut": releasing while still going up shortens the jump => tap = small hop
            if (player.vy < 0) player.vy *= JUMP_CUT_MULT;
        }

        // Where the jetpack flame comes out: low on the runner's back (he faces right)
        function jetNozzle() { return { x: player.x + 16, y: player.y + PLAYER_H * 0.62 }; }

        // Jetpack ignition: this is the "magic power" moment, so it has to hit hard —
        // an instant upward kick, a flash, a shake, a burst of fire and a whoosh.
        function igniteJet() {
            player.jetting = true;
            const rescue = player.y + PLAYER_H > GROUND_Y + 6; // already sinking into a hole
            if (player.y > JET_CEILING) player.vy = Math.min(player.vy, -JET_KICK);
            squash = 1.2;
            flash("#ffb030", 0.1);
            shake(rescue ? 6 : 3);
            const n = jetNozzle();
            burst(n.x, n.y, "#ff9a20", 14, 320);
            sndJetIgnite();
            jetHumStart();
        }

        function cutJet(outOfFuel) {
            if (!player.jetting) return;
            player.jetting = false;
            jetHumStop();
            if (outOfFuel) sndJetEmpty();
        }

        // Keyboard: Space/Enter = action button everywhere; ArrowUp = jump in game, navigate in menus
        window.addEventListener("keydown", (e) => {
            if (blocked) return; // the "get a PC" screen swallows every input
            if (!["Space", "Enter", "ArrowUp", "ArrowDown", "KeyP"].includes(e.code)) return;
            e.preventDefault();
            if (e.repeat) return; // ignore auto-repeat, we handle "hold" ourselves
            if (e.code === "KeyP") {
                // "P" toggles pause, only during a run
                if (state === "playing") {
                    paused = !paused;
                    if (paused) cutJet(false); // no rumble frozen under the pause
                }
                return;
            }
            const inMenu = (state === "home" && homeReady()) || state === "gameover";
            if (e.code === "ArrowUp" && inMenu) { menuMove(-1); return; }
            if (e.code === "ArrowDown") { if (inMenu) menuMove(1); return; }
            pressButton();
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowUp") releaseButton();
        });

        // Mouse & touch are captured on the WHOLE window: on a phone you can tap
        // anywhere on the screen to jump, not just on the console art.
        window.addEventListener("mousedown", (e) => { if (blocked) return; e.preventDefault(); pressButton(canvasPos(e)); });
        window.addEventListener("mouseup", releaseButton);

        window.addEventListener("touchstart", (e) => { if (blocked) return; e.preventDefault(); pressButton(canvasPos(e)); }, { passive: false });
        window.addEventListener("touchend", (e) => { e.preventDefault(); releaseButton(); }, { passive: false });
        window.addEventListener("touchcancel", releaseButton);

        /* =====================================================================
           PROCEDURAL GENERATION
           ===================================================================== */

        function rand(min, max) { return min + Math.random() * (max - min); }

        // Opaque bounds of each obstacle frame, as fractions of its own frame.
        // Only used by HITBOX_MODE === "art", to demonstrate the wobble a per-frame
        // hitbox produces: look at the pigeon, whose two frames disagree wildly.
        const OBSTACLE_ART_BOX = {
            "koala_running_1": { x0: 0.000, y0: 0.000, x1: 1.000, y1: 0.979 },
            "koala_running_2": { x0: 0.000, y0: 0.000, x1: 1.000, y1: 0.979 },
            "pigeon_1": { x0: 0.086, y0: 0.000, x1: 0.968, y1: 0.774 },
            "pigeon_2": { x0: 0.000, y0: 0.242, x1: 1.000, y1: 1.000 }
        };

        // Base slot name for an obstacle type ("koala_running" / "pigeon")
        function obstacleBaseName(type) {
            return type === "ground" ? "koala_running" : "pigeon";
        }

        // How many animation frames actually loaded for this obstacle type (0 = none)
        function obstacleFrameCount(type) {
            const base = obstacleBaseName(type);
            let n = 0;
            while (assets[base + "_" + (n + 1)]) n++;
            return n;
        }

        // The slot to DRAW for this obstacle right now. The koala and the pigeon are
        // 2-frame loops; each obstacle carries its own animOff so they do not all flap
        // in lockstep. Returns null when no image loaded (a plain rect is drawn).
        function obstacleFrameSlot(o) {
            const base = obstacleBaseName(o.type);
            const n = obstacleFrameCount(o.type);
            if (n === 0) return null;
            const fps = o.type === "ground" ? KOALA_ANIM_FPS : PIGEON_ANIM_FPS;
            const f = Math.floor(performance.now() / 1000 * fps + o.animOff) % n;
            return base + "_" + (f + 1);
        }

        // The full sprite FRAME rect (what gets drawn). The obstacle's x/y/w/h is its
        // hitbox, so the frame is offset from it by the dx/dy computed at spawn time.
        function obstacleFrameRect(o) {
            return { x: o.x + o.dx, y: o.y + o.dy, w: o.fw, h: o.fh };
        }

        // The obstacle's COLLISION box. In "body" mode this is simply x/y/w/h, a fixed
        // box on the creature's body that never moves with the animation. In "art" mode
        // it is recomputed from the current frame's opaque bounds instead.
        function obstacleHitbox(o) {
            if (HITBOX_MODE !== "art") return { x: o.x, y: o.y, w: o.w, h: o.h };
            const slot = obstacleFrameSlot(o);
            const box = slot && OBSTACLE_ART_BOX[slot];
            if (!box) return { x: o.x, y: o.y, w: o.w, h: o.h };
            const f = obstacleFrameRect(o);
            return {
                x: f.x + f.w * box.x0,
                y: f.y + f.h * box.y0,
                w: f.w * (box.x1 - box.x0),
                h: f.h * (box.y1 - box.y0)
            };
        }

        // The pigeon's y for its current position along the screen. Both paths are
        // anchored on o.baseY — the bird's LOWEST point, bottom edge on the overhead
        // clearance line — and only ever lift it ABOVE that, so running underneath
        // always stays possible.
        //   "wave"     bobs up and down as it crosses
        //   "diagonal" enters high and glides steadily down to the clearance line
        function pigeonY(o) {
            if (o.motion === "diagonal") {
                // Progress is driven by x, so the descent is smooth and speed-independent.
                // It bottoms out at the PLAYER's column, not at the left edge — otherwise
                // the bird would still be high when it passes him and the dive would never
                // be felt. Past that point it simply holds the clearance line.
                const span = W + 40 - PLAYER_X;
                const p = Math.max(0, Math.min(1, (o.x - PLAYER_X) / span)); // 1 at spawn -> 0 at the player
                return o.baseY - PIGEON_DIAGONAL_RISE * p;
            }
            // Sine mapped to [0..1] so the bird touches baseY at the bottom of each dip
            const wave = 0.5 + 0.5 * Math.sin(runTime * PIGEON_WAVE_SPEED + o.wavePhase);
            return o.baseY - PIGEON_WAVE_AMPLITUDE * wave;
        }

        // Turns a body height into the full frame rect offsets. The size presets always
        // describe the BODY (the part the player must clear), so difficulty stays
        // predictable no matter how much empty wing-space a frame carries around it.
        function obstacleFrameMetrics(type, bodyH) {
            const box = OBSTACLE_BODY_BOX[type];
            const base = obstacleBaseName(type);
            const img = assets[base + "_1"] || assets[base];
            const fh = bodyH / (box.y1 - box.y0);
            const fw = img ? fh * (img.width / img.height) : bodyH;
            return {
                fw, fh,
                bodyW: fw * (box.x1 - box.x0),
                dx: -fw * box.x0,   // frame left, relative to the hitbox left
                dy: -fh * box.y0    // frame top,  relative to the hitbox top
            };
        }

        // The collectible's slot name for its kind
        function collectibleSlotName(kind) {
            return "collectible_" + kind; // collectible_points / _jetpack / _heart
        }

        // Pickup box matching the drawn artwork (height = 2r, width follows the art)
        function collectibleBox(c) {
            const name = collectibleSlotName(c.kind);
            const ar = assets[name] ? slotAspect(name) : 1;
            const h = c.r * 2, w = h * ar;
            return { x: c.x - w / 2, y: c.y - c.r, w, h };
        }

        // RULE: nothing overlaps. These are the areas a collectible must keep clear of.
        // A pigeon is blocked over its WHOLE flight path (it bobs or dives after
        // spawning, so its spawn position alone is not enough); a hole is blocked
        // from the ground line down.
        function obstacleZone(o) {
            const f = obstacleFrameRect(o); // the drawn frame, never smaller than the hitbox
            if (o.type !== "overhead") return f;
            const rise = o.motion === "diagonal" ? PIGEON_DIAGONAL_RISE : PIGEON_WAVE_AMPLITUDE;
            const top = o.baseY + o.dy - rise;
            return { x: f.x, y: top, w: f.w, h: f.h + rise };
        }
        function gapZone(g) { return { x: g.x, y: GROUND_Y - 3, w: g.w, h: H - GROUND_Y + 3 }; }

        function spawnHazard() {
            const spawnX = W + 40; // just off-screen to the right
            const roll = Math.random();
            let zone; // the area the new hazard occupies (for the no-overlap rule)

            if (roll < 0.45) {
                // Ground obstacle (the koala cop): jump over it. The preset height is the
                // BODY height; the frame around it is sized from the artwork's ratio.
                const variant = Math.floor(Math.random() * KOALA_SIZES.length);
                const s = KOALA_SIZES[variant];
                const m = obstacleFrameMetrics("ground", s.h);
                const o = {
                    type: "ground", variant, animOff: Math.random() * 10,
                    x: spawnX, y: GROUND_Y - s.h, w: m.bodyW || s.w, h: s.h,
                    fw: m.fw, fh: m.fh, dx: m.dx, dy: m.dy
                };
                obstacles.push(o);
                zone = obstacleZone(o);
            } else if (roll < 0.75) {
                // Overhead obstacle (the pigeon): run under it (do NOT jump). The BODY's
                // bottom edge always sits on the same clearance line, so it stays playable
                // however far the wings stretch outside the frame.
                const variant = Math.floor(Math.random() * PIGEON_SIZES.length);
                const s = PIGEON_SIZES[variant];
                const m = obstacleFrameMetrics("overhead", s.h);
                // baseY is the bird's LOWEST position: its bottom edge on the clearance
                // line. Every flight path only ever lifts it above that, never below, so
                // there is always room to run underneath.
                const baseY = GROUND_Y - PLAYER_H - OVERHEAD_CLEARANCE - s.h;
                const o = {
                    type: "overhead", variant, animOff: Math.random() * 10,
                    x: spawnX, y: baseY, baseY, w: m.bodyW || s.w, h: s.h,
                    fw: m.fw, fh: m.fh, dx: m.dx, dy: m.dy,
                    motion: Math.random() < PIGEON_DIAGONAL_CHANCE ? "diagonal" : "wave",
                    wavePhase: Math.random() * Math.PI * 2
                };
                o.y = pigeonY(o);
                obstacles.push(o);
                zone = obstacleZone(o);
            } else {
                // Gap in the ground: jump across
                const g = { x: spawnX, w: rand(GAP_WIDTH_MIN, GAP_WIDTH_MAX) };
                gaps.push(g);
                zone = gapZone(g);
                // A gap "occupies" time on screen: push the next hazard a bit further away
                hazardTimer += g.w / currentSpeed;
            }

            // A new hazard (obstacle OR hole) evicts any collectible it would overlap
            collectibles = collectibles.filter(c => !overlapsWithMargin(collectibleBox(c), zone, 18));

            // Time-based spacing: at higher speed the pixel distance grows automatically,
            // so the pattern stays physically jumpable at any speed.
            hazardTimer += rand(SPAWN_GAP_MIN, SPAWN_GAP_MAX);
        }

        function spawnCollectible() {
            // Pick the collectible kind from the spawn weights (no heart while they are full)
            const roll = Math.random();
            let kind = "points";
            if (roll < COLLECT_WEIGHT_HEART) { if (lives < LIVES_MAX) kind = "heart"; }
            else if (roll < COLLECT_WEIGHT_HEART + COLLECT_WEIGHT_JETPACK) kind = "jetpack";

            // RULE: a collectible never overlaps (or touches) an obstacle's whole flight
            // path, a hole, or another collectible. Try a few heights near the spawn
            // point; give up this cycle if every one is blocked.
            const zones = obstacles.map(obstacleZone)
                .concat(gaps.map(gapZone))
                .concat(collectibles.map(collectibleBox));
            for (let attempt = 0; attempt < 6; attempt++) {
                const y = GROUND_Y - rand(41, 255); // low = grabbed running, high = needs a jump
                const c = { x: W + 40, y, r: COLLECT_RADIUS, kind };
                const box = collectibleBox(c);
                if (!zones.some(z => overlapsWithMargin(box, z, 18))) { collectibles.push(c); break; }
            }
            collectTimer += rand(COLLECT_SPAWN_MIN, COLLECT_SPAWN_MAX);
        }

        /* =====================================================================
           COLLISIONS
           ===================================================================== */

        // The player's collision box, slightly shrunk for forgiveness.
        // IMPORTANT: never changes during a run — only the visuals do.
        function playerHitbox() {
            return {
                x: player.x + HITBOX_PAD,
                y: player.y + HITBOX_PAD,
                w: PLAYER_W - HITBOX_PAD * 2,
                h: PLAYER_H - HITBOX_PAD * 2
            };
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // Overlap test with a safety margin around rect b (used for spawn rules)
        function overlapsWithMargin(a, b, m) {
            return a.x - m < b.x + b.w && a.x + a.w + m > b.x && a.y - m < b.y + b.h && a.y + a.h + m > b.y;
        }

        // Is the center of the player's feet currently above a hole?
        function overGap() {
            const footCenter = player.x + PLAYER_W / 2;
            return gaps.some(g => footCenter > g.x && footCenter < g.x + g.w);
        }

        /* =====================================================================
           DEATH
           ===================================================================== */

        // A hit costs a heart. With one to spare the run goes on: red flash, a thud and
        // a short blinking invincibility. Returns false when it was the last heart.
        function loseHeart() {
            lives--;
            if (lives <= 0) return false;
            invincibleTimer = HURT_INVINCIBLE_T;
            flash("#ff2020", 0.15);
            shake(5);
            sndSmash();
            return true;
        }

        function die(cause) {
            cutJet(false);
            state = "dying"; // short death sequence first; the GAME OVER screen comes after
            deathTimer = DEATH_SEQUENCE_DURATION;
            deathCause = cause;
            flash("#ff2020", 0.2);
            shake();
            sndDeath();
            if (score > bestScore) {
                bestScore = Math.floor(score);
                try { localStorage.setItem("dgm_best", String(bestScore)); } catch (e) { }
            }
            // Online (signed-in players only): push the score — the DB keeps only the
            // best — then refresh the global board. Fire-and-forget: any network
            // failure is swallowed and the game never waits on it.
            if (sbUser) {
                try { submitScore(sbUser, Math.floor(score)).then(refreshOnline).catch(() => { }); } catch (e) { }
            }
        }

        function update(dt) {
            // Paused: the whole world (and its juice) stands still
            if (paused && state === "playing") return;

            // --- Global timers (run in every state, for juice) ---
            if (flashTimer > 0) flashTimer -= dt;
            if (shakeTimer > 0) shakeTimer -= dt;
            if (state === "home" || state === "intro") updateHomeScene(dt); // the forest keeps living
            updateParticles(dt);
            updatePopups(dt);

            // --- Screen flow timers ---
            if (state === "boot") {
                // Soft power-on sound, once. NOTE: browsers block audio before the first
                // user interaction, so on a fresh page load it may stay silent.
                if (!bootSoundPlayed) {
                    bootSoundPlayed = true;
                    ensureAudio();
                    sndBootUp();
                }
                // The LOADING screen waits for the images, with a floor and a ceiling on
                // how long it stays, then holds "100%" for a beat before the home screen.
                bootTime += dt;
                if (loadingProgress() >= 1) bootDoneTime += dt;
                if (bootDoneTime >= LOADING_HOLD_T || bootTime >= LOADING_MAX_T) goHome();
            } else if (state === "home") {
                homeTime += dt; // drives the logo slide-in + the idle loop
                if (homeReady()) homeMenuTime += dt; // START / LEADERBOARD fade in
            } else if (state === "intro") {
                const before = introTime;
                introTime += dt;
                const tl = introTimeline();
                if (before < tl.rightOpen && introTime >= tl.rightOpen) sndPortal();
                if (before < tl.arrive && introTime >= tl.arrive) sndWhoosh();
                if (introTime >= tl.end) startPlaying();
            } else if (state === "dying") {
                // The koala reaching the player is a beat of its own: a thud and a shake,
                // fired exactly once as the sequence crosses DEATH_CATCH_FRAC.
                const catchAt = DEATH_SEQUENCE_DURATION * (1 - DEATH_CATCH_FRAC);
                const before = deathTimer;
                deathTimer -= dt;
                if (before > catchAt && deathTimer <= catchAt) {
                    shake();
                    sndSmash();
                }
                if (deathTimer <= 0) {
                    // The death sequence flows STRAIGHT into the leaderboard (no menu screen)
                    state = "leaderboard";
                    gameOverTime = performance.now(); // short input lock so a press can't skip it instantly
                }
            }

            if (state !== "playing") return;

            runTime += dt;

            // --- Speed: ease toward the target, which ramps up with time ---
            const targetSpeed = Math.min(MAX_SPEED, BASE_SPEED + SPEED_RAMP * runTime);
            // Smooth easing so speed changes never feel like a hard snap
            currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, 3 * dt);

            // --- Jetpack: fires while the button is held in the air, from the jump's
            // peak onwards (so a normal jump still reaches its full height first) ---
            const wantJet = holding && !player.grounded && fuel > 0 && (player.jetting || player.vy > 0);
            if (wantJet && !player.jetting) igniteJet();
            else if (!wantJet && player.jetting) cutJet(fuel <= 0);
            // The boost spools up fast and fades gently: the runner surges forward on
            // screen and the whole world rushes past faster
            jetPower += ((player.jetting ? 1 : 0) - jetPower) * Math.min(1, (player.jetting ? JET_SPOOL_UP : JET_SPOOL_DOWN) * dt);
            player.x = PLAYER_X + JET_PUSH_X * jetPower;

            const dx = currentSpeed * (1 + JET_SPEED_BOOST * jetPower) * dt; // pixels traveled this frame
            worldX += dx;
            score += dx * SCORE_PER_PIXEL;

            // --- Player physics ---
            player.vy += GRAVITY * dt;

            if (player.jetting) {
                // Real thrust, stronger than gravity: you climb, you don't just glide.
                // No thrust above the ceiling (a double jump can end up there): the
                // runner sinks back down to it first, then hovers on it.
                if (player.y >= JET_CEILING) player.vy = Math.max(player.vy - JET_THRUST * dt, -JET_MAX_RISE);
                fuel = Math.max(0, fuel - dt);
                // Fire and sparks spraying out of the nozzle
                const n = jetNozzle();
                for (let i = 0; i < 2; i++) {
                    particles.push({
                        x: n.x, y: n.y, vx: -rand(150, 350), vy: rand(200, 420),
                        life: rand(0.2, 0.45), color: Math.random() < 0.5 ? "#ffb030" : "#ff5a1a", size: rand(3, 6)
                    });
                }
            } else {
                player.vy = Math.min(player.vy, MAX_FALL_SPEED);
            }

            player.y += player.vy * dt;
            // The jetpack never climbs past its ceiling (jumps are not limited by it)
            if (player.jetting && player.vy < 0 && player.y < JET_CEILING) { player.y = JET_CEILING; player.vy = 0; }

            const standingOnGround = !overGap();

            if (player.y + PLAYER_H >= GROUND_Y && standingOnGround && player.vy >= 0) {
                // Landing
                const wasAirborne = !player.grounded;
                player.y = GROUND_Y - PLAYER_H;
                player.vy = 0;
                player.grounded = true;
                player.jumpsUsed = 0;
                player.coyoteTimer = 0;
                if (wasAirborne) {
                    squash = 0.8; // small squash on landing (visual only)
                    // Buffered jump fires immediately for a snappy feel
                    if (jumpBufferTimer > 0) {
                        jumpBufferTimer = 0;
                        doJump(JUMP_VELOCITY, 1);
                        sndJump();
                    }
                }
            } else {
                // Airborne (jumping, or walking over a hole)
                if (player.grounded) {
                    player.grounded = false;
                    player.coyoteTimer = 0; // just left the ground: coyote window starts
                } else {
                    player.coyoteTimer += dt;
                }
            }

            if (jumpBufferTimer > 0) jumpBufferTimer -= dt;
            if (invincibleTimer > 0) invincibleTimer -= dt;

            // Squash eases back to 1 (visual only, hitbox untouched)
            squash += (1 - squash) * Math.min(1, 10 * dt);

            // Fell into a hole: a spare heart (or the blink right after losing one)
            // throws the runner back up out of it; otherwise the run is over
            if (player.y > H + 40) {
                if (invincibleTimer > 0 || loseHeart()) {
                    player.y = H;
                    player.vy = -VOID_BOUNCE_VELOCITY;
                    player.jumpsUsed = 1; // one air jump left to steer the landing
                } else { die("fell into the void"); return; }
            }

            // --- Spawners ---
            hazardTimer -= dt;
            if (hazardTimer <= 0) spawnHazard();
            collectTimer -= dt;
            if (collectTimer <= 0) spawnCollectible();

            // --- Move & clean up world objects ---
            for (const o of obstacles) {
                o.x -= dx;
                // Pigeons fly: their hitbox follows the sprite, so what you see is what hits
                if (o.type === "overhead") o.y = pigeonY(o);
            }
            for (const g of gaps) g.x -= dx;
            for (const c of collectibles) c.x -= dx;
            obstacles = obstacles.filter(o => o.x + o.w > -60);
            gaps = gaps.filter(g => g.x + g.w > -60);
            collectibles = collectibles.filter(c => c.x + c.r > -60);

            // --- Collisions ---
            const hb = playerHitbox();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                // obstacleHitbox() honours HITBOX_MODE, so switching modes changes what
                // actually kills you without touching anything that is drawn.
                if (invincibleTimer > 0 || !rectsOverlap(hb, obstacleHitbox(o))) continue;
                if (loseHeart()) continue; // a spare heart absorbs the hit
                die(o.type === "ground" ? "caught by a koala cop" : "hit by a pigeon");
                return;
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                const box = collectibleBox(c); // pickup box = exactly the drawn artwork
                if (rectsOverlap(hb, box)) {
                    collectibles.splice(i, 1);
                    if (c.kind === "jetpack") {
                        fuel = Math.min(FUEL_MAX, fuel + FUEL_REFILL);
                        sndJetpack();
                    } else if (c.kind === "heart") {
                        lives = Math.min(LIVES_MAX, lives + 1);
                        addPopup(c.x, c.y - 14, "+❤️", "#ff3050");
                        sndHeart();
                    } else {
                        score += COLLECT_VALUE;
                        addPopup(c.x, c.y - 14, "+" + COLLECT_VALUE, "#444");
                        sndCollect();
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (const p of particles) {
                p.life -= dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 500 * dt; // light gravity on particles
            }
            particles = particles.filter(p => p.life > 0);
        }

        function updatePopups(dt) {
            for (const p of popups) {
                p.life -= dt;
                p.y -= 40 * dt; // floats upward
            }
            popups = popups.filter(p => p.life > 0);
        }

        /* =====================================================================
           DRAWING
           ===================================================================== */

        function draw() {
            ctx.imageSmoothingEnabled = false; // pixel art: a scaled sprite stays crisp, never blurred
            drawScreen();
        }

        // One game screen, drawn in coordinates 0..W x 0..H
        function drawScreen() {
            if (state === "boot") { drawBoot(); return; }
            if (state === "home") { drawHome(); return; }
            if (state === "intro") { drawIntro(); return; }
            if (state === "leaderboard") { drawLeaderboard(); return; }

            // --- Below: the game world (states "playing", "dying" and "gameover") ---
            ctx.save();

            // Screen shake offset (+ a constant rumble while the jetpack fires)
            let s = shakeTimer > 0 ? shakePower * (shakeTimer / SHAKE_DURATION) : 0;
            if (state === "playing" && player.jetting) s = Math.max(s, 1.6);
            if (s > 0) ctx.translate(rand(-s, s), rand(-s, s));

            // --- Backdrop (placeholder until the in-game art arrives) ---
            drawRunBackdrop();
            // Jetpack boost: speed streaks rushing past, behind the ground
            drawSpeedLines();
            // --- The ground the player runs on ---
            drawRunGround();

            // --- Holes cut into the ground ---
            const holeTop = GROUND_Y - 3;
            ctx.fillStyle = "#1c1c1c";
            for (const g of gaps) ctx.fillRect(g.x, holeTop, g.w, H - holeTop);

            // --- Obstacles: the animated koala / pigeon, drawn as FULL frames.
            // The frames share a canvas, so drawing them untrimmed is what keeps the
            // creature from sliding around between frames. ---
            for (const o of obstacles) {
                const f = obstacleFrameRect(o);
                const slot = obstacleFrameSlot(o);
                if (slot && drawSlot(slot, f.x, f.y, f.w, f.h)) continue;
                ctx.fillStyle = "#2a2a2a"; // placeholder rect on the hitbox itself
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }

            // --- Collectibles: drawn rect = pickup hitbox = the visible artwork ---
            for (const c of collectibles) {
                const box = collectibleBox(c);
                if (drawSlot(collectibleSlotName(c.kind), box.x, box.y, box.w, box.h)) continue;
                if (c.kind === "heart") { drawHeart(c.x, c.y, c.r * 2, "#ff3050"); continue; }
                // Circle fallback, one color per kind so they stay readable
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = c.kind === "jetpack" ? "#30c060" : "#909090";
                ctx.fill();
                ctx.beginPath(); // small inner dot for readability
                ctx.arc(c.x, c.y, c.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = "#f7f7f7";
                ctx.fill();
            }

            // --- Player (the death sequence draws its own character instead) ---
            if (state === "playing") {
                // Blinking right after losing a heart: he can't be hit during it
                if (invincibleTimer > 0 && Math.floor(invincibleTimer * 12) % 2 === 0) ctx.globalAlpha = 0.3;
                drawPlayer();
                ctx.globalAlpha = 1;
            }

            // Debug overlay: green boxes = the REAL collision rects of everything
            // (player, obstacles, collectibles). Obstacles also get their sprite FRAME
            // outlined in faint blue, so the gap between art and hitbox is visible.
            // Toggle with DEBUG_HITBOX; switch HITBOX_MODE to compare the two schemes.
            if (DEBUG_HITBOX && state === "playing") {
                drawHitboxDebug(); // player box
                ctx.lineWidth = 2;
                for (const o of obstacles) {
                    const f = obstacleFrameRect(o);
                    ctx.strokeStyle = "rgba(60,140,255,0.45)";
                    ctx.strokeRect(f.x, f.y, f.w, f.h);
                    const hb = obstacleHitbox(o);
                    ctx.strokeStyle = "#00e050";
                    ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
                }
                ctx.strokeStyle = "#00e050";
                for (const c of collectibles) { const b = collectibleBox(c); ctx.strokeRect(b.x, b.y, b.w, b.h); }
                ctx.fillStyle = "#00e050";
                ctx.font = "bold 13px monospace";
                ctx.textAlign = "right"; // bottom right, in the ground strip: clear of the runner
                ctx.fillText("HITBOX: " + HITBOX_MODE, W - HUD_INSET_X, H - 20);
            }

            // --- Particles ---
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / 0.7);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // --- Floating score popups ---
            for (const p of popups) {
                ctx.globalAlpha = Math.max(0, p.life / 0.8);
                ctx.fillStyle = p.color;
                ctx.font = "bold 18px monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;

            // --- HUD ---
            // No backdrop panels; the HUD simply sits away from the screen edges.
            const hudColor = "#2a2a2a";
            ctx.fillStyle = hudColor;
            ctx.font = "bold 30px monospace";
            ctx.textAlign = "right";
            ctx.fillText(String(Math.floor(score)).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 12);
            ctx.font = "18px monospace";
            ctx.fillText("HI " + String(bestScore).padStart(5, "0"), W - HUD_INSET_X, HUD_INSET_Y + 40);

            // Jetpack fuel gauge, top left, and the hearts (lives) right under it
            drawFuelGauge(HUD_INSET_X, HUD_INSET_Y + 7, hudColor);
            drawLives(HUD_INSET_X, HUD_INSET_Y + 40);

            // Controls reminder, always visible during the run
            if (state === "playing") drawControlsHint(H - 34, "#606060"); // it sits on the ground band

            ctx.restore();

            // --- Screen flash (drawn on top, ignores shake) ---
            if (flashTimer > 0) {
                ctx.globalAlpha = Math.min(0.5, flashTimer / FLASH_DURATION * 0.5);
                ctx.fillStyle = flashColor;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }

            // --- Overlays on top of the (frozen) world ---
            if (state === "dying") drawDeathSequence();
            if (state === "gameover") drawGameOverScreen();

            // --- Pause overlay (P) on top of everything in the window ---
            if (paused && state === "playing") drawPauseOverlay();
        }

        // Draws text in a chunky PIXELATED style: rendered small on an offscreen
        // canvas, then blown up with image smoothing disabled.
        const pixelCanvas = document.createElement("canvas");
        const pixelCtx = pixelCanvas.getContext("2d");
        function drawPixelText(text, cx, cy, smallPx, scaleFactor, color) {
            pixelCtx.font = "bold " + smallPx + "px monospace";
            const tw = Math.ceil(pixelCtx.measureText(text).width) + 4;
            const th = smallPx + 6;
            pixelCanvas.width = tw;  // resizing also clears the offscreen canvas
            pixelCanvas.height = th;
            pixelCtx.font = "bold " + smallPx + "px monospace"; // re-set after the resize
            pixelCtx.textAlign = "left";
            pixelCtx.textBaseline = "top";
            pixelCtx.fillStyle = color;
            pixelCtx.fillText(text, 2, 2);
            ctx.save();
            ctx.imageSmoothingEnabled = false; // this is what makes the pixels chunky
            ctx.drawImage(pixelCanvas, cx - (tw * scaleFactor) / 2, cy - (th * scaleFactor) / 2, tw * scaleFactor, th * scaleFactor);
            ctx.restore();
